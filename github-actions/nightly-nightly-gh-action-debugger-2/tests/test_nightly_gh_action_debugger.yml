name: Test Nightly GitHub Action Debugger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_debugger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Debugger Workflow with Startup Commands
        uses: actions/github-script@v7
        id: run_debugger
        with:
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/nightly-gh-action-debugger.yml',
              ref: 'main',
              inputs: {
                startup_commands: 'echo "Test command executed successfully!" && exit 0',
                docker_image: 'ubuntu:latest' # Use a minimal image for faster testing
              }
            });
            console.log('Workflow dispatch initiated. Run ID:', result.data.id);
            // In a real test, you'd poll for workflow run status here.
            // For simplicity, we'll assume dispatch success is enough for this mock.
            // Mock rationale: Simulates triggering the workflow and expects a successful dispatch response.
            // Actual status checking would require more complex API interaction or a dedicated testing framework.
            expect(result.status).toBe(204);

      - name: Verify Startup Command Output (Mock)
        # Mock rationale: This step simulates checking the output of the startup commands.
        # In a real scenario, you'd need to fetch the workflow run logs and parse them.
        # For this test, we assume the 'createWorkflowDispatch' call implies success if no error.
        run: echo "Mock verification: Startup commands were dispatched successfully."
