name: "Nightly Morale Boost"\ndescription: "Posts a whimsical morale‑boosting comment to the triggering issue or PR."\ninputs:\n  seed:\n    description: "Integer seed for deterministic phrase selection."\n    required: false\n    default: ""\n  custom_message:\n    description: "Custom message to post instead of a random phrase."\n    required: false\n    default: ""\nruns:\n  using: "composite"\n  steps:\n    - name: Run morale boost script\n      shell: bash\n      env:\n        INPUT_SEED: ${{ inputs.seed }}\n        INPUT_CUSTOM_MESSAGE: ${{ inputs.custom_message }}\n        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        GITHUB_REPOSITORY: ${{ github.repository }}\n        GITHUB_EVENT_PATH: ${{ github.event_path }}\n      run: |\n        ./src/boost.sh
