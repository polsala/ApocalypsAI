name: Nightly Zen PR Comment\ndescription: Posts a random Zen quote as a comment on a PR.\ninputs:\n  github_token:\n    description: GitHub token\n    required: true\n  pr_number:\n    description: Pull request number\n    required: true\nruns:\n  using: "composite"\n  steps:\n    - name: Post Zen comment\n      shell: bash\n      env:\n        GITHUB_TOKEN: ${{ inputs.github_token }}\n        PR_NUMBER: ${{ inputs.pr_number }}\n        GITHUB_REPOSITORY: ${{ github.repository }}\n      run: |\n        "${{ github.action_path }}/src/post_zen_comment.sh"
