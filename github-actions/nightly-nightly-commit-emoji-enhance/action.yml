name: "Commit Emoji Enhancer"\ndescription: "Returns an emoji that matches a conventional commit type"\ninputs:\n  type:\n    description: "Conventional commit type (feat, fix, docs, chore, refactor, test, style, perf, build, ci, revert)"\n    required: true\noutputs:\n  emoji:\n    description: "Emoji string corresponding to the provided type"\nruns:\n  using: "composite"\n  steps:\n    - name: Determine emoji\n      id: determine\n      run: bash ${{ github.action_path }}/src/emoji.sh "${{ inputs.type }}"\n      shell: bash\n    - name: Set output\n      run: echo "emoji=$(cat $GITHUB_OUTPUT | grep '^emoji=' | cut -d'=' -f2-)" >> $GITHUB_OUTPUT\n      shell: bash
