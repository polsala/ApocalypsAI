name: Nightly Issue Labeler\ndescription: Auto‑label new issues with apocalypse‑themed tags based on keywords\ninputs:\n  github-token:\n    description: GITHUB_TOKEN for API access\n    required: true\n  label-config:\n    description: JSON string mapping keywords to labels\n    required: false\n    default: '{"radiation":"radiation","mutant":"mutant","survivor":"survivor"}'\nruns:\n  using: "composite"\n  steps:\n    - name: Run labeler script\n      shell: bash\n      env:\n        GITHUB_TOKEN: ${{ inputs.github-token }}\n        LABEL_CONFIG: ${{ inputs.label-config }}\n        EVENT_PAYLOAD: ${{ github.event_path }}\n      run: |
        bash "${{ github.action_path }}/src/labeler.sh"
