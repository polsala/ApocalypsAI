name: Nightly Workflow Guardian Angel

on:
  schedule:
    # Runs daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  guardian_angel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML requests rich

      - name: Run Workflow Guardian Angel
        id: guardian_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python scripts/workflow_guardian_angel.py

      - name: Post findings to a new issue (if any)
        if: steps.guardian_run.outputs.findings != ''
        uses: actions/github-script@v7
        with:
          script: |
            const findings = process.env.FINDINGS;
            const owner = process.env.REPO_OWNER;
            const repo = process.env.REPO_NAME;

            github.rest.issues.create({
              owner: owner,
              repo: repo,
              title: `Workflow Guardian Angel Report - ${new Date().toISOString().split('T')[0]}`, 
              body: findings
            });
        env:
          FINDINGS: ${{ steps.guardian_run.outputs.findings }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
