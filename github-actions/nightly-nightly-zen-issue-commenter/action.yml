name: "Nightly Zen Issue Commenter"\ndescription: "Posts a random Zen quote as a comment on newly opened issues."\nauthor: "ApocalypsAI"\ninputs: {}\nruns:\n  using: "composite"\n  steps:\n    - name: Generate Zen Quote\n      id: zen\n      run: |
        #!/usr/bin/env bash\n        set -e\n        ./src/zen_comment.sh > $GITHUB_OUTPUT\n      shell: bash\n\n    - name: Post comment via gh CLI\n      env:\n        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n        REPO: ${{ github.repository }}\n        ISSUE_NUMBER: ${{ github.event.issue.number }}\n        COMMENT: ${{ steps.zen.outputs.comment }}\n      run: |
        #!/usr/bin/env bash\n        set -e\n        # The gh CLI must be available in the runner.\n        gh api -X POST "/repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$COMMENT"\n      shell: bash
