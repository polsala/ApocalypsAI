name: "Nightly PR Motivator"
description: "Posts a random motivational quote comment on a PR"
inputs:
  github-token:
    description: "GitHub token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Run motivator script
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        bash "${{ github.action_path }}/src/entrypoint.sh"

