name: 'Nightly PR Thematic Sentry'\ndescription: 'Ensures PR titles and descriptions align with project thematic guidelines by checking for required or forbidden keywords.'\ninputs:\n  github-token:\n    description: 'GitHub token for API access.'\n    required: true\n  required-keywords:\n    description: 'Comma-separated list of keywords that MUST be present in the PR title or body. Case-insensitive.'\n    required: false\n    default: ''\n  forbidden-keywords:\n    description: 'Comma-separated list of keywords that MUST NOT be present in the PR title or body. Case-insensitive.'\n    required: false\n    default: ''\noutputs:\n  thematic-check-status:\n    description: 'Result of the thematic check (success/failure). '\n  thematic-check-message:\n    description: 'Detailed message about the thematic check result.'\nruns:\n  using: 'node16'\n  main: 'src/main.js'
