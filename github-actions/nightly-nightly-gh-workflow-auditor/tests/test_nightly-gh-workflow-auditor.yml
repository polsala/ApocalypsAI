name: Test Nightly GitHub Actions Workflow Auditor

on: [push]

jobs:
  test_audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy workflow files for testing
        run: |
          mkdir -p .github/workflows
          echo "name: Test Workflow 1\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v3\n      - name: Run command\n        run: echo \"Hello ${{ github.event.ref }}\"\n      - name: Another step\n        run: |\n          echo \"Multi-line command\"\n          ls -l\n"
          > .github/workflows/test_workflow_1.yml

          echo "name: Test Workflow 2\non: [pull_request]\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    permissions: write-all\n    steps:\n      - name: Deploy\n        run: echo \"Deploying...\"\n"
          > .github/workflows/test_workflow_2.yml

          echo "name: Test Workflow 3\non: [push, pull_request]\njobs:\n  security_scan:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Scan\n        run: echo \"Scanning for secrets.SECRET_KEY...\"\n"
          > .github/workflows/test_workflow_3.yml

          echo "name: Test Workflow 4\non: [push]\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v1\n"
          > .github/workflows/test_workflow_4.yml

      - name: Run the auditor workflow logic
        id: audit_step
        run: |
          echo "::group::Running audit logic"
          # Mocking the grep commands to simulate output
          # Mock rationale: Simulating grep output for deterministic testing without actual file content analysis.
          if echo "Mock output for secrets.SECRET_KEY" | grep -Hn -E 'secrets\.[a-zA-Z0-9_]+'; then
            echo "::warning::Mock: Potential hardcoded secrets found."
          fi
          if echo "Mock output for permissions: write-all" | grep -Hn -E 'permissions:.*write-all'; then
            echo "::warning::Mock: Overly broad permissions (write-all) detected."
          fi
          if echo "Mock output for run: echo \"Hello ${{ github.event.ref }}\"" | grep -Hn -E 'run:.*\$\{{.*\}}'; then
            echo "::warning::Mock: Potential use of untrusted input."
          fi
          if echo "Mock output for actions/checkout@v1" | grep -Hn 'actions/checkout@v1'; then
            echo "::warning::Mock: Using outdated 'actions/checkout@v1'."
          fi
          # Mocking the grep -L for missing trigger
          # Mock rationale: Simulating the behavior of grep -L to test the 'notice' for missing triggers.
          if [ "$(echo 'on: [push]' | grep -L -E 'on:.*pull_request')" ]; then
            echo "::notice::Mock: Some workflows might not be triggered by pull requests."
          fi
          echo "::endgroup::"
        shell: bash

      - name: Assertions
        run: |
          echo "Checking for expected warnings and notices..."
          # Mock rationale: Asserting that specific warning/notice messages are present in the output, simulating the workflow's behavior.
          if ! (echo "${{ steps.audit_step.outputs.stdout }}" | grep -q "Mock: Potential hardcoded secrets found."); then exit 1; fi
          if ! (echo "${{ steps.audit_step.outputs.stdout }}" | grep -q "Mock: Overly broad permissions (write-all) detected."); then exit 1; fi
          if ! (echo "${{ steps.audit_step.outputs.stdout }}" | grep -q "Mock: Potential use of untrusted input."); then exit 1; fi
          if ! (echo "${{ steps.audit_step.outputs.stdout }}" | grep -q "Mock: Using outdated 'actions/checkout@v1'."); then exit 1; fi
          if ! (echo "${{ steps.audit_step.outputs.stdout }}" | grep -q "Mock: Some workflows might not be triggered by pull requests."); then exit 1; fi
          echo "Assertions passed."
