name: Nightly PR Labeler\ndescription: Outputs a label when a filename matches a glob pattern.\ninputs:\n  filename:\n    description: Filename to test\n    required: true\n  pattern:\n    description: Glob pattern to match against\n    required: true\n  label:\n    description: Label to output on match\n    required: true\noutputs:\n  label:\n    description: The label if pattern matches, otherwise empty\nruns:\n  using: "composite"\n  steps:\n    - name: Determine label\n      shell: bash\n      run: |\n        ./src/labeler.sh "${{ inputs.filename }}" "${{ inputs.pattern }}" "${{ inputs.label }}" >> "$GITHUB_OUTPUT"\n
