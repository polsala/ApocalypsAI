name: PR Labeler\n\non:\n  pull_request:\n    types: [opened, reopened, edited]\n\njobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Add labels based on title\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const title = context.payload.pull_request.title.toLowerCase();\n            const labels = [];\n            if (title.includes('bug')) labels.push('bug');\n            if (title.includes('feature')) labels.push('enhancement');\n            if (title.includes('doc') || title.includes('docs')) labels.push('documentation');\n            // Add a whimsical emoji label\n            const emojis = ['🚀','🧟','🦄','🌵','⚡'];\n            const random = Math.floor(Math.random() * emojis.length);\n            labels.push(emojis[random]);\n            if (labels.length > 0) {\n              await github.issues.addLabels({\n                owner: context.repo.owner,\n                repo: context.repo.repo,\n                issue_number: context.payload.pull_request.number,\n                labels: labels\n              });\n            }
