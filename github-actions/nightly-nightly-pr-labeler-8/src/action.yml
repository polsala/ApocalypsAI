name: PR Labeler\ndescription: Add a label to a PR based on changed file types\ninputs:\n  files:\n    description: Space-separated list of changed file paths\n    required: true\n  github-token:\n    description: GitHub token with repo permissions\n    required: true\nruns:\n  using: "composite"\n  steps:\n    - name: Determine label\n      id: label\n      run: |\n        echo "Determined label: $(bash ${{{{ github.action_path }}}}/labeler.sh ${{{{ inputs.files }}}})"\n        echo "label=$(bash ${{{{ github.action_path }}}}/labeler.sh ${{{{ inputs.files }}}})" >> $GITHUB_OUTPUT\n    - name: Add label via API\n      env:\n        GITHUB_TOKEN: ${{{{ inputs.github-token }}}}\n        PR_NUMBER: ${{{{ github.event.pull_request.number }}}}\n        REPO: ${{{{ github.repository }}}}\n        LABEL: ${{{{ steps.label.outputs.label }}}}\n      run: |\n        curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \\\n          -H "Accept: application/vnd.github+json" \\n          https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels \\n          -d "{\"labels\":[\"$LABEL\"]}"\n      shell: bash
