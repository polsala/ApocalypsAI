name: "Nightly PR Labeler"\ndescription: "Auto‑label PRs based on title keywords and leave a whimsical comment."\nauthor: "ApocalypsAI"\n\ninputs:\n  github-token:\n    description: "GITHUB_TOKEN with repo scope"\n    required: true\n  label-map:\n    description: "JSON string mapping keywords to label names"\n    required: false\n    default: "{}"\n  comment-template:\n    description: "Comment template with {keyword} placeholder"\n    required: false\n    default: "✨ Your PR looks like a **{keyword}**! Keep it up!"\n\nruns:\n  using: "node12"\n  main: "src/index.js"\n
