name: Nightly PR Labeler\non:\n  workflow_call:\n    inputs:\n      github-token:\n        required: true\n        type: string\n\njobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v3\n\n      - name: Get changed files\n        id: changes\n        uses: actions/github-script@v6\n        with:\n          github-token: ${{ inputs.github-token }}\n          script: |\n            const pr = context.payload.pull_request || await github.rest.pulls.get({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              pull_number: context.payload.workflow_run?.pull_requests?.[0]?.number || 0\n            }).then(res => res.data);\n            const files = await github.paginate(github.rest.pulls.listFiles, {\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              pull_number: pr.number\n            });\n            const paths = files.map(f => f.filename);\n            core.setOutput('files', JSON.stringify(paths));\n\n      - name: Determine labels\n        id: labels\n        uses: actions/github-script@v6\n        with:\n          github-token: ${{ inputs.github-token }}\n          script: |\n            const files = JSON.parse('${{ steps.changes.outputs.files }}');\n            const labels = new Set();\n            for (const f of files) {\n              if (f.startsWith('docs/') || f.endsWith('.md')) {\n                labels.add('documentation');\n              } else if (f.startsWith('tests/') || f.endsWith('_test.py') || f.endsWith('.spec.js')) {\n                labels.add('tests');\n              } else if (f.endsWith('.py') || f.endsWith('.js') || f.endsWith('.ts') || f.endsWith('.go') || f.endsWith('.rs')) {\n                labels.add('enhancement');\n              }\n            }\n            core.setOutput('labels', Array.from(labels).join(','));\n\n      - name: Add labels to PR\n        if: steps.labels.outputs.labels != ''\n        uses: actions/github-script@v6\n        with:\n          github-token: ${{ inputs.github-token }}\n          script: |\n            const pr = context.payload.pull_request || await github.rest.pulls.get({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              pull_number: context.payload.workflow_run?.pull_requests?.[0]?.number || 0\n            }).then(res => res.data);\n            const labels = '${{ steps.labels.outputs.labels }}'.split(',').filter(l => l);\n            await github.rest.issues.addLabels({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              issue_number: pr.number,\n              labels: labels\n            });
