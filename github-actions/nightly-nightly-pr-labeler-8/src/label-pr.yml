name: Auto PR Labeler\n\non:\n  workflow_call:\n    inputs:\n      token:\n        description: 'GitHub token with repo scope'\n        required: true\n        type: string\n\njobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v3\n\n      - name: Get changed files\n        id: changes\n        uses: jitterbit/get-changed-files@v1\n        with:\n          format: 'json'\n\n      - name: Determine labels\n        id: labels\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const changed = JSON.parse(process.env.CHANGED_FILES);\n            const labels = new Set();\n            for (const file of changed) {\n              if (file.startsWith('docs/')) labels.add('documentation');\n              if (file.endsWith('.test.js') || file.endsWith('_test.py')) labels.add('tests');\n              if (file.includes('wizard')) labels.add('🧙‍♂️ wizardry');\n            }\n            core.setOutput('labels', Array.from(labels).join(','));\n          env:\n            CHANGED_FILES: ${{ steps.changes.outputs.files }}\n\n      - name: Add labels to PR\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const raw = '${{ steps.labels.outputs.labels }}';\n            const labels = raw.split(',').filter(l => l);\n            if (labels.length === 0) return;\n            await github.rest.issues.addLabels({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              issue_number: context.payload.pull_request.number,\n              labels: labels\n            });\n        env:\n          GITHUB_TOKEN: ${{ inputs.token }}\n
