name: PR Title Labeler\n\non:\n  workflow_call:\n    inputs:\n      github-token:\n        description: "GitHub token with repo scope"\n        required: true\n        type: string\n\njobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Determine labels\n        id: determine\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const title = context.payload.pull_request.title.toLowerCase();\n            const labels = [];\n            if (title.includes('bug')) labels.push('bug');\n            if (title.includes('feature')) labels.push('enhancement');\n            if (title.includes('doc')) labels.push('documentation');\n            return JSON.stringify(labels);\n          result-encoding: string\n\n      - name: Add labels\n        if: steps.determine.outputs.result != '[]'\n        uses: actions/github-script@v6\n        with:\n          script: |\n            const labels = JSON.parse('${{ steps.determine.outputs.result }}');\n            await github.rest.issues.addLabels({\n              owner: context.repo.owner,\n              repo: context.repo.repo,\n              issue_number: context.payload.pull_request.number,\n              labels: labels\n            });\n
