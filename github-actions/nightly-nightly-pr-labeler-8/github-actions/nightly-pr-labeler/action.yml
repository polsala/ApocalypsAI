name: Nightly PR Labeler\ndescription: Auto‑label PRs based on title keywords and add a random emoji label.\ninputs:\n  title:\n    description: Pull request title\n    required: true\n  github-token:\n    description: Token to call GitHub API\n    required: true\nruns:\n  using: "composite"\n  steps:\n    - name: Run labeler script\n      shell: bash\n      env:\n        PR_TITLE: ${{ inputs.title }}\n        GITHUB_TOKEN: ${{ inputs.github-token }}\n      run: |\n        bash "${{ github.action_path }}/src/labeler.sh"
