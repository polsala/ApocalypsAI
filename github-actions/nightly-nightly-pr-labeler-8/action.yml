name: PR Labeler\ndescription: Suggests labels for PRs based on title keywords and adds a whimsical emoji label\ninputs:\n  pr_title:\n    description: Title of the pull request\n    required: true\n  label_map:\n    description: JSON mapping of keyword to label (e.g., {\"bug\":\"bug\",\"feature\":\"enhancement\"})\n    required: false\n    default: "{}"\nruns:\n  using: composite\n  steps:\n    - name: Run labeler\n      shell: bash\n      run: |\n        ./src/labeler.sh "${{ inputs.pr_title }}" '${{ inputs.label_map }}'\n
