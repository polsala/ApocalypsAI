name: Icebreaker Issue Comment\ndescription: Posts a random icebreaker comment on newly opened issues.\ninputs:\n  github_token:\n    description: 'GitHub token with repo scope'\n    required: true\nruns:\n  using: "composite"\n  steps:\n    - name: Set up Python\n      uses: actions/setup-python@v4\n      with:\n        python-version: "3.11"\n    - name: Run icebreaker script\n      env:\n        GITHUB_TOKEN: ${{ inputs.github_token }}\n        GITHUB_REPOSITORY: ${{ github.repository }}\n        ISSUE_NUMBER: ${{ github.event.issue.number }}\n      run: |\n        python ${{ github.action_path }}/src/main.py
