name: Test Chaos Orchestrator

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (basic|comprehensive)'
        required: false
        default: 'basic'
        type: string

jobs:
  test-basic-chaos:
    name: Basic Chaos Testing
    if: github.event.inputs.test_mode == 'basic' || github.event.inputs.test_mode == ''
    uses: ./.github/workflows/nightly-workflow-chaos-orchestrator.yml
    with:
      chaos_level: '3'
      chaos_types: 'network,cpu'
      chaos_duration: '60'
    secrets: inherit

  test-comprehensive-chaos:
    name: Comprehensive Chaos Testing
    if: github.event.inputs.test_mode == 'comprehensive'
    uses: ./.github/workflows/nightly-workflow-chaos-orchestrator.yml
    with:
      chaos_level: '5'
      chaos_types: 'network,cpu,memory,disk,random'
      chaos_duration: '120'
    secrets: inherit

  test-chaos-disabled:
    name: Chaos Disabled Test
    uses: ./.github/workflows/nightly-workflow-chaos-orchestrator.yml
    with:
      chaos_level: '0'
      chaos_types: 'network,cpu,memory,disk'
      chaos_duration: '30'
    secrets: inherit

  validate-chaos-parameters:
    name: Validate Chaos Parameters
    runs-on: ubuntu-latest
    steps:
      - name: Test parameter validation
        run: |
          echo "Testing chaos parameter validation..."
          
          # Test invalid chaos level (too high)
          echo "Testing chaos_level > 10..."
          # This would normally fail in the actual workflow
          
          # Test invalid chaos level (too low)
          echo "Testing chaos_level < 0..."
          # This would normally fail in the actual workflow
          
          # Test invalid chaos duration (too short)
          echo "Testing chaos_duration < 10..."
          # This would normally fail in the actual workflow
          
          # Test invalid chaos duration (too long)
          echo "Testing chaos_duration > 3600..."
          # This would normally fail in the actual workflow
          
          echo "Parameter validation tests completed"

  verify-chaos-artifacts:
    name: Verify Chaos Artifacts
    needs: [test-basic-chaos, test-chaos-disabled]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for chaos report artifact
        run: |
          echo "Checking for chaos report artifacts..."
          
          # In a real test, we would download and verify the artifact
          # For this test, we'll just verify the workflow structure
          if [ -f '.github/workflows/nightly-workflow-chaos-orchestrator.yml' ]; then
            echo "✅ Chaos orchestrator workflow file exists"
          else
            echo "❌ Chaos orchestrator workflow file not found"
            exit 1
          fi
          
          echo "Artifact verification completed"

  chaos-documentation-test:
    name: Chaos Documentation Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify documentation
        run: |
          echo "Verifying chaos orchestrator documentation..."
          
          if [ -f 'README.md' ]; then
            echo "✅ README.md exists"
            
            # Check for key sections
            if grep -q "# Nightly Workflow Chaos Orchestrator" README.md; then
              echo "✅ Title section found"
            else
              echo "❌ Title section missing"
              exit 1
            fi
            
            if grep -q "## Features" README.md; then
              echo "✅ Features section found"
            else
              echo "❌ Features section missing"
              exit 1
            fi
            
            if grep -q "## Usage" README.md; then
              echo "✅ Usage section found"
            else
              echo "❌ Usage section missing"
              exit 1
            fi
            
            if grep -q "## Chaos Types" README.md; then
              echo "✅ Chaos Types section found"
            else
              echo "❌ Chaos Types section missing"
              exit 1
            fi
            
            if grep -q "## Safety Features" README.md; then
              echo "✅ Safety Features section found"
            else
              echo "❌ Safety Features section missing"
              exit 1
            fi
          else
            echo "❌ README.md not found"
            exit 1
          fi
          
          echo "Documentation verification completed"

  chaos-workflow-structure-test:
    name: Chaos Workflow Structure Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow structure
        run: |
          echo "Verifying chaos orchestrator workflow structure..."
          
          WORKFLOW_FILE='.github/workflows/nightly-workflow-chaos-orchestrator.yml'
          
          if [ -f "$WORKFLOW_FILE" ]; then
            echo "✅ Workflow file exists"
            
            # Check for required sections
            if grep -q "workflow_call:" "$WORKFLOW_FILE"; then
              echo "✅ workflow_call trigger found"
            else
              echo "❌ workflow_call trigger missing"
              exit 1
            fi
            
            if grep -q "inputs:" "$WORKFLOW_FILE"; then
              echo "✅ inputs section found"
            else
              echo "❌ inputs section missing"
              exit 1
            fi
            
            if grep -q "secrets:" "$WORKFLOW_FILE"; then
              echo "✅ secrets section found"
            else
              echo "❌ secrets section missing"
              exit 1
            fi
            
            if grep -q "jobs:" "$WORKFLOW_FILE"; then
              echo "✅ jobs section found"
            else
              echo "❌ jobs section missing"
              exit 1
            fi
            
            # Count jobs
            JOB_COUNT=$(grep -c "^[a-zA-Z0-9_-]*:" "$WORKFLOW_FILE" | head -1)
            echo "✅ Found $JOB_COUNT jobs in workflow"
            
          else
            echo "❌ Workflow file not found"
            exit 1
          fi
          
          echo "Workflow structure verification completed"

  chaos-security-test:
    name: Chaos Security Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify security measures
        run: |
          echo "Verifying chaos orchestrator security measures..."
          
          WORKFLOW_FILE='.github/workflows/nightly-workflow-chaos-orchestrator.yml'
          
          # Check for secrets handling
          if grep -q "secrets: inherit" "$WORKFLOW_FILE"; then
            echo "✅ Secrets inheritance configured"
          else
            echo "❌ Secrets inheritance not found"
            exit 1
          fi
          
          # Check for input validation
          if grep -q "Parse and validate inputs" "$WORKFLOW_FILE"; then
            echo "✅ Input validation present"
          else
            echo "❌ Input validation missing"
            exit 1
          fi
          
          # Check for chaos level validation
          if grep -q "CHAOS_LEVEL.*[0-9]\+" "$WORKFLOW_FILE"; then
            echo "✅ Chaos level validation found"
          else
            echo "❌ Chaos level validation missing"
            exit 1
          fi
          
          # Check for duration validation
          if grep -q "CHAOS_DURATION.*[0-9]\+" "$WORKFLOW_FILE"; then
            echo "✅ Chaos duration validation found"
          else
            echo "❌ Chaos duration validation missing"
            exit 1
          fi
          
          echo "Security verification completed"

  chaos-cleanup-test:
    name: Chaos Cleanup Test
    runs-on: ubuntu-latest
    steps:
      - name: Verify cleanup procedures
        run: |
          echo "Verifying chaos orchestrator cleanup procedures..."
          
          WORKFLOW_FILE='.github/workflows/nightly-workflow-chaos-orchestrator.yml'
          
          # Check for cleanup job
          if grep -q "chaos-cleanup:" "$WORKFLOW_FILE"; then
            echo "✅ Cleanup job found"
          else
            echo "❌ Cleanup job missing"
            exit 1
          fi
          
          # Check for network cleanup
          if grep -q "tc qdisc del" "$WORKFLOW_FILE"; then
            echo "✅ Network cleanup found"
          else
            echo "❌ Network cleanup missing"
            exit 1
          fi
          
          # Check for process cleanup
          if grep -q "pkill" "$WORKFLOW_FILE"; then
            echo "✅ Process cleanup found"
          else
            echo "❌ Process cleanup missing"
            exit 1
          fi
          
          # Check for file cleanup
          if grep -q "rm -f" "$WORKFLOW_FILE"; then
            echo "✅ File cleanup found"
          else
            echo "❌ File cleanup missing"
            exit 1
          fi
          
          echo "Cleanup verification completed"
