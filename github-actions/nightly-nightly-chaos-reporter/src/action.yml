name: 'Nightly Chaos Reporter'
author: 'ApocalypsAI Nightly Integrator'
description: 'Generates a whimsical report on simulated system chaos.'
inputs:
  chaos_level:
    description: 'The intensity of the simulated chaos (low, moderate, high)'
    required: false
    default: 'moderate'
  reporting_style:
    description: 'The tone of the generated report (poetic, technical, humorous)'
    required: false
    default: 'poetic'
outputs:
  chaos_report:
    description: 'The generated chaos report'
runs:
  using: 'node20'
  main: '../dist/index.js'
