name: 'CI/CD Fortune Teller'
description: 'Posts a whimsical, randomly generated CI/CD fortune or deployment blessing as a PR comment.'
inputs:
  github-token:
    description: 'GitHub token for posting comments. Usually `secrets.GITHUB_TOKEN`.'
    required: true
  fortune-type:
    description: 'Type of fortune to generate: "blessing" or "warning". Defaults to "blessing".'
    required: false
    default: 'blessing'
  pr-number:
    description: 'The pull request number to comment on. If not provided, attempts to get from GITHUB_REF.'
    required: false
outputs:
  fortune:
    description: 'The generated fortune message.'
runs:
  using: 'composite'
  steps:
    - name: Generate Fortune
      id: generate_fortune
      shell: bash
      run: |
        FORTUNE=$(bash "${{ github.action_path }}/src/fortune.sh" "${{ inputs.fortune-type }}")
        echo "fortune=$FORTUNE" >> "$GITHUB_OUTPUT"
        echo "Generated Fortune: $FORTUNE"

    - name: Get PR Number
      id: get_pr_number
      shell: bash
      run: |
        PR_NUMBER="${{ inputs.pr-number }}"
        if [ -z "$PR_NUMBER" ]; then
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [[ "${{ github.ref }}" == refs/pull/* ]]; then
            PR_NUMBER=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}')
          fi
        fi
        echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        echo "Determined PR Number: $PR_NUMBER"

    - name: Post Fortune as PR Comment
      if: steps.get_pr_number.outputs.pr_number != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const prNumber = ${{ steps.get_pr_number.outputs.pr_number }};
          const fortuneMessage = "${{ steps.generate_fortune.outputs.fortune }}";
          if (prNumber) {
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✨ **CI/CD Fortune Teller says:** ✨\n\n> ${fortuneMessage}\n\n_May your pipelines be ever green!_`
            });
            console.log(`Posted fortune to PR #${prNumber}`);
          } else {
            console.log('Could not determine PR number. Fortune not posted as comment.');
          }
