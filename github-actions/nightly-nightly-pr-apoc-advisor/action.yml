name: 'Nightly PR Apoc Advisor'
description: 'Advises on Pull Request descriptions with whimsical apocalyptic wisdom.'
inputs:
  github-token:
    description: 'GitHub token for API access.'
    required: true
  wisdom-keyword:
    description: 'Keyword to look for in the PR description. If found, no advice is given.'
    required: false
    default: 'survival tip'
outputs:
  comment-id:
    description: 'The ID of the comment created, if any.'
runs:
  using: 'node20'
  main: 'dist/index.js' # This will be the bundled JS file generated by ncc
