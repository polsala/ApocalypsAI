name: 'PR Whimsy Blesser'
description: 'Adds a whimsical blessing to small, labeled Pull Requests.'
inputs:
  github-token:
    description: 'GitHub token for API calls'
    required: true
  pr-number:
    description: 'The PR number'
    required: true
  pr-labels:
    description: 'Comma-separated list of PR labels'
    required: true
  pr-lines-changed:
    description: 'Total lines changed in the PR'
    required: true
  blessings-file:
    description: 'Path to the blessings file'
    required: false
    default: 'src/blessings.txt'
  required-label:
    description: 'The label a PR must have to be considered for a blessing.'
    required: false
    default: 'bless-me'
  min-lines:
    description: 'Minimum lines changed for a PR to be blessed.'
    required: false
    default: '1'
  max-lines:
    description: 'Maximum lines changed for a PR to be blessed.'
    required: false
    default: '50'
outputs:
  blessing-message:
    description: 'The whimsical blessing message, if posted'
    value: ${{ steps.bless.outputs.blessing-message }}
  blessing-posted:
    description: 'True if a blessing was posted, false otherwise'
    value: ${{ steps.bless.outputs.blessing-posted }}
runs:
  using: 'composite'
  steps:
    - id: bless
      shell: bash
      run: |
        PR_LABELS="${{ inputs.pr-labels }}"
        PR_LINES_CHANGED="${{ inputs.pr-lines-changed }}"
        BLESSINGS_FILE="${{ github.action_path }}/${{ inputs.blessings-file }}"
        REQUIRED_LABEL="${{ inputs.required-label }}"
        MIN_LINES="${{ inputs.min-lines }}"
        MAX_LINES="${{ inputs.max-lines }}"

        echo "Checking PR #${{ inputs.pr-number }} with labels: $PR_LABELS, lines changed: $PR_LINES_CHANGED"

        # Check if required label is present
        if [[ ! "$PR_LABELS" =~ (^|,)$REQUIRED_LABEL($|,) ]]; then
          echo "::notice::PR does not have the '$REQUIRED_LABEL' label. Skipping blessing."
          echo "blessing-posted=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Check PR size
        if (( PR_LINES_CHANGED < MIN_LINES || PR_LINES_CHANGED > MAX_LINES )); then
          echo "::notice::PR lines changed ($PR_LINES_CHANGED) is not within the range ($MIN_LINES-$MAX_LINES). Skipping blessing."
          echo "blessing-posted=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Read blessings from file
        if [ ! -f "$BLESSINGS_FILE" ]; then
          echo "::error::Blessings file not found: $BLESSINGS_FILE"
          exit 1
        fi
        
        BLESSINGS=()
        while IFS= read -r line; do
          if [[ -n "$line" ]]; then # Only add non-empty lines
            BLESSINGS+=("$line")
          fi
        done < "$BLESSINGS_FILE"

        if [ ${#BLESSINGS[@]} -eq 0 ]; then
          echo "::error::No blessings found in $BLESSINGS_FILE"
          exit 1
        fi

        RANDOM_INDEX=$(( RANDOM % ${#BLESSINGS[@]} ))
        SELECTED_BLESSING="${BLESSINGS[$RANDOM_INDEX]}"

        echo "::notice::PR #${{ inputs.pr-number }} is blessed! Message: $SELECTED_BLESSING"
        echo "blessing-message=$SELECTED_BLESSING" >> "$GITHUB_OUTPUT"
        echo "blessing-posted=true" >> "$GITHUB_OUTPUT"

        # In a real scenario, you'd use the github-token here to post a comment:
        # The 'gh' CLI is usually available on GitHub Actions runners.
        # echo "Would post comment: $SELECTED_BLESSING"
        # gh pr comment ${{ inputs.pr-number }} --body "$SELECTED_BLESSING" --repo "${{ github.repository }}" --token "${{ inputs.github-token }}"
