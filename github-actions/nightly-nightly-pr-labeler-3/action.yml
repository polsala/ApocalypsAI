name: "Nightly PR Labeler"
description: "Auto-label PRs based on changed files"
inputs:
  github-token:
    description: "GitHub token"
    required: true
runs:
  using: "composite"
  steps:
    - name: Install gh CLI
      run: |
        sudo apt-get update && sudo apt-get install -y gh
    - name: Run labeler
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        bash "${{ github.action_path }}/src/labeler.sh"
