name: Nightly GitHub Actions Validator

# Trigger on pull requests targeting the main branch
on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/*.yml"

jobs:
  validate_actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML

      - name: Run workflow validator script
        id: validator
        run: |
          python scripts/validate_github_actions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post validation results to PR
        if: steps.validator.outputs.validation_status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const validation_output = `${{ steps.validator.outputs.validation_results }}`;
            const comment_body = `:warning: **GitHub Actions Workflow Validation Failed** :warning:

Found the following potential issues in your workflow:

${validation_output}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment_body
            });

      - name: Post success message if no issues found
        if: steps.validator.outputs.validation_status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ':tada: **GitHub Actions Workflow Validation Successful** :tada:

All workflows checked passed validation.'
            });
