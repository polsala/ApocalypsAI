name: 'Chrono-Drift Injector'
description: 'Injects configurable, randomized delays or transient failures into workflow steps to expose timing-sensitive bugs and improve CI robustness.'
inputs:
  min_delay:
    description: 'Minimum delay in seconds to inject.'
    required: false
    default: '0'
  max_delay:
    description: 'Maximum delay in seconds to inject.'
    required: false
    default: '5'
  failure_chance:
    description: 'Percentage chance (0-100) for the step to fail.'
    required: false
    default: '0'
  drift_seed:
    description: 'Optional seed for reproducible randomness. If not provided, uses current timestamp.'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Inject Chrono-Drift
      shell: bash
      env:
        INPUT_MIN_DELAY: ${{ inputs.min_delay }}
        INPUT_MAX_DELAY: ${{ inputs.max_delay }}
        INPUT_FAILURE_CHANCE: ${{ inputs.failure_chance }}
        INPUT_DRIFT_SEED: ${{ inputs.drift_seed }}
      run: |
        # Ensure the script is executable
        chmod +x ${{ github.action_path }}/src/drift_injector.sh
        ${{ github.action_path }}/src/drift_injector.sh
