name: Nightly Workflow Guardian

on:
  schedule:
    - cron: '30 3 * * *' # Run daily at 3:30 AM UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  monitor_workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests PyYAML

      - name: Run Workflow Guardian
        id: guardian_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: python ./utils/nightly-workflow-guardian/src/guardian.py

      - name: Create Issue on Failure
        if: steps.guardian_run.outputs.status == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: process.env.REPO_OWNER,
              repo: process.env.REPO_NAME,
              title: `🚨 Workflow Guardian Alert: Workflow Health Issue Detected`, 
              body: `The nightly workflow guardian has detected an issue with one or more GitHub Actions workflows. Please review the logs for details. Output: ${{ steps.guardian_run.outputs.message }}`
            });
            console.log(`Created issue: #${issue.number}`);
