name: PR Labeler\n\non:\n  workflow_call:\n    inputs:\n      token:\n        description: "GitHub token"
        required: true\n        type: string\n\njobs:\n  label:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v3\n        with:\n          fetch-depth: 0\n\n      - name: Determine changed files\n        id: changes\n        run: |\n          echo "CHANGED_FILES<<EOF" >> $GITHUB_ENV\n          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} >> $GITHUB_ENV\n          echo "EOF" >> $GITHUB_ENV\n\n      - name: Run labeler\n        id: labeler\n        run: |\n          node ${{ github.workspace }}/src/labeler.js > labels.txt\n          echo "labels=$(cat labels.txt)" >> $GITHUB_OUTPUT\n        env:\n          CHANGED_FILES: ${{ env.CHANGED_FILES }}\n\n      - name: Apply labels\n        uses: actions/github-script@v6\n        with:\n          github-token: ${{ inputs.token }}\n          script: |\n            const labels = `${{ steps.labeler.outputs.labels }}`.trim().split('\n').filter(l => l);\n            if (labels.length) {\n              await github.rest.issues.addLabels({\n                owner: context.repo.owner,\n                repo: context.repo.repo,\n                issue_number: context.payload.pull_request.number,\n                labels\n              });\n            }
