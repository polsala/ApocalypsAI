name: 'Stale Branch Whisperer'
description: 'Identifies branches that haven\'t been updated or merged into the default branch for a configurable period, and gently reminds maintainers.'
inputs:
  github-token:
    description: 'GitHub token with permissions to list branches and create issues.'
    required: true
  stale-days:
    description: 'Number of days after which a branch is considered stale.'
    required: false
    default: '30'
  default-branch:
    description: 'The main branch to compare against (e.g., main, master).'
    required: false
    default: 'main'
  issue-label:
    description: 'Label to add to the created issue for stale branches.'
    required: false
    default: 'stale-branch'
  dry-run:
    description: 'If "true", only logs stale branches, does not create issues.'
    required: false
    default: 'false'
  exclude-branches:
    description: 'Comma-separated list of branch names or regex patterns to exclude from checks (e.g., "dev,release-.*").'
    required: false
    default: ''
outputs:
  stale-branches-count:
    description: 'The number of stale branches found.'
  stale-branches-list:
    description: 'A JSON array of stale branch names.'
runs:
  using: 'node16'
  main: 'src/main.js'
