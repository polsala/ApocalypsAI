name: "PR Title Enforcer"\ndescription: "Fails if PR title does not start with a required prefix"\ninputs:\n  prefix:\n    description: "Required prefix for PR titles"\n    required: false\n    default: "🚀"\nruns:\n  using: "composite"\n  steps:\n    - name: Check PR title\n      env:\n        INPUT_PREFIX: ${{ inputs.prefix }}\n        GITHUB_EVENT_PATH: ${{ github.event_path }}\n      run: bash ${{ github.action_path }}/src/check_title.sh\n
