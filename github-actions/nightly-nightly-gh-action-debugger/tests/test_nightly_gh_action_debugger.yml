name: Test Nightly GitHub Action Debugger

# This workflow simulates a run of the nightly-gh-action-debugger workflow
# to ensure its core logic for collecting information works as expected.
# It uses mock data where necessary to avoid actual external dependencies.

# Note: This test workflow itself is not meant to be run as part of the main ApocalypsAI CI.
# It's a standalone test for the debugger utility.

on: [workflow_dispatch]

jobs:
  test_debugger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test files
        uses: actions/checkout@v4
        with:
          path: repo # Checkout the main repo into a subdirectory to simulate a typical workflow run

      - name: Mock environment variables
        run: |
          echo "MOCK_VAR_1=mock_value_1" >> $GITHUB_ENV
          echo "MOCK_VAR_2=mock_value_2" >> $GITHUB_ENV
          echo "PATH=/usr/local/bin:/usr/bin:/bin" >> $GITHUB_ENV

      - name: Mock file system structure
        run: |
          mkdir -p repo/.github/workflows
          mkdir -p repo/agents
          mkdir -p repo/utils
          touch repo/.github/workflows/some_workflow.yml
          touch repo/agents/agent_base.py
          touch repo/utils/some_utility.py
          echo "Mock file content" > repo/utils/some_utility.py

      - name: Mock Git information
        run: |
          # Simulate git log output
          echo "abcdef1 - Mock Author, 1 day ago : Initial commit" > git_log.txt
          echo "fedcba2 - Another Mock, 2 days ago : Add feature X" >> git_log.txt
          echo "1234567 - Test User, 3 days ago : Fix bug Y" >> git_log.txt
          echo "7654321 - Dev, 4 days ago : Refactor Z" >> git_log.txt
          echo "9876543 - QA, 5 days ago : Update docs" >> git_log.txt

      - name: Mock GitHub context
        run: |
          # Simulate GitHub context JSON
          echo '{ "eventName": "workflow_dispatch", "sha": "mocksha12345", "ref": "refs/heads/main", "repository": "mockorg/mockrepo" }' > github_context.json

      - name: Run the debugger workflow (simulated)
        id: debugger_run
        uses: ./repo/.github/workflows/nightly-gh-action-debugger.yml@main # Use the actual workflow file from the checkout
        with:
          # No inputs needed for this workflow
          pass
        env:
          # Inject mocked environment variables into the step execution context
          MOCK_VAR_1: "mock_value_1"
          MOCK_VAR_2: "mock_value_2"
          PATH: "/usr/local/bin:/usr/bin:/bin"
          # Mocking the actual environment variables that actions/checkout might set
          GITHUB_ENV: "$GITHUB_ENV"
          GITHUB_WORKSPACE: "${{ github.workspace }}"
          GITHUB_REPOSITORY: "mockorg/mockrepo"
          GITHUB_SHA: "mocksha12345"
          GITHUB_EVENT_NAME: "workflow_dispatch"
          GITHUB_REF: "refs/heads/main"

      # --- Assertions --- #
      # These assertions check the generated log file for expected content.
      # We'll use a simple grep-like approach for demonstration.

      - name: Verify Environment Variables in Log
        run: |
          grep "MOCK_VAR_1: mock_value_1" action_environment_debug.log
          grep "MOCK_VAR_2: mock_value_2" action_environment_debug.log
          grep "PATH: /usr/local/bin:/usr/bin:/bin" action_environment_debug.log
        # Mock rationale: The 'action_environment_debug.log' file is generated by the debugger workflow itself.
        # We are asserting its content based on the mocked environment variables we injected.

      - name: Verify File System Info in Log
        run: |
          grep "repo/.:" action_environment_debug.log
          grep "repo/.github/workflows/some_workflow.yml" action_environment_debug.log
          grep "repo/agents/agent_base.py" action_environment_debug.log
          grep "repo/utils/some_utility.py" action_environment_debug.log
        # Mock rationale: The file system structure is mocked before running the debugger.
        # We assert that the debugger correctly captured these mocked paths and filenames in its output.

      - name: Verify Git Information in Log
        run: |
          grep "abcdef1 - Mock Author, 1 day ago : Initial commit" action_environment_debug.log
          grep "fedcba2 - Another Mock, 2 days ago : Add feature X" action_environment_debug.log
        # Mock rationale: Git log output is mocked to a file. The debugger should capture this.
        # We assert that the mocked git log entries are present in the generated debug log.

      - name: Verify GitHub Context in Log
        run: |
          grep "eventName: workflow_dispatch" action_environment_debug.log
          grep "sha: mocksha12345" action_environment_debug.log
          grep "repository: mockorg/mockrepo" action_environment_debug.log
        # Mock rationale: GitHub context is mocked to a JSON file. The debugger should capture this.
        # We assert that the mocked context details are present in the generated debug log.

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debugger_test_logs
          path: action_environment_debug.log
