<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Entanglement Simulator - Tests</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .test-suite {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-case {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #ccc;
        }
        .test-case.pass {
            border-left-color: #4caf50;
        }
        .test-case.fail {
            border-left-color: #f44336;
        }
        .test-result {
            margin-top: 10px;
            font-family: monospace;
        }
        button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px;
        }
        button.run-all {
            background: #2196f3;
        }
    </style>
</head>
<body>
    <div class="test-suite">
        <h1>Quantum Entanglement Simulator - Test Suite</h1>
        <p>Testing the core functionality of the quantum entanglement simulator.</p>
        
        <button onclick="runAllTests()" class="run-all">Run All Tests</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="test-output"></div>
    </div>

    <!-- Include the simulator code for testing -->
    <script>
        // Mock DOM elements for testing
        function createMockContainer() {
            const container = document.createElement('div');
            container.id = 'test-container';
            document.body.appendChild(container);
            return container;
        }

        // Test cases
        function runAllTests() {
            clearResults();
            
            const tests = [
                testParticleCreation,
                testEntanglementCreation,
                testMeasurementCollapse,
                testEntanglementCorrelation,
                testBoundsChecking,
                testStatsUpdate
            ];

            tests.forEach(test => {
                runTest(test);
            });
        }

        function runTest(testFn) {
            const result = document.createElement('div');
            result.className = 'test-case';
            result.innerHTML = `<strong>${testFn.name}</strong><div class="test-result"></div>`;
            
            const output = result.querySelector('.test-result');
            
            try {
                const testResult = testFn();
                if (testResult.pass) {
                    result.classList.add('pass');
                    output.innerHTML = `✅ PASS: ${testResult.message}`;
                } else {
                    result.classList.add('fail');
                    output.innerHTML = `❌ FAIL: ${testResult.message}`;
                }
            } catch (error) {
                result.classList.add('fail');
                output.innerHTML = `❌ ERROR: ${error.message}`;
            }
            
            document.getElementById('test-output').appendChild(result);
        }

        function clearResults() {
            document.getElementById('test-output').innerHTML = '';
        }

        // Test implementations
        function testParticleCreation() {
            // Mock the container
            const container = createMockContainer();
            
            // Create a simplified particle
            const particle = {
                id: Date.now(),
                x: 100,
                y: 100,
                radius: 15,
                measured: false
            };
            
            // Check basic properties
            if (particle.id && particle.x === 100 && particle.y === 100 && !particle.measured) {
                return { pass: true, message: 'Particle created with correct initial properties' };
            }
            
            return { pass: false, message: 'Particle creation failed' };
        }

        function testEntanglementCreation() {
            const entanglements = [];
            const p1 = { id: 1 };
            const p2 = { id: 2 };
            
            const entanglement = {
                id: Date.now(),
                particle1: p1,
                particle2: p2,
                strength: 1.0
            };
            
            entanglements.push(entanglement);
            
            if (entanglements.length === 1 && 
                entanglement.particle1.id === 1 && 
                entanglement.particle2.id === 2) {
                return { pass: true, message: 'Entanglement pair created successfully' };
            }
            
            return { pass: false, message: 'Entanglement creation failed' };
        }

        function testMeasurementCollapse() {
            const particle = {
                measured: false,
                measurementResult: null
            };
            
            // Simulate measurement
            particle.measured = true;
            particle.measurementResult = Math.random() > 0.5 ? 'UP' : 'DOWN';
            
            if (particle.measured && (particle.measurementResult === 'UP' || particle.measurementResult === 'DOWN')) {
                return { pass: true, message: 'Particle measurement and collapse working correctly' };
            }
            
            return { pass: false, message: 'Measurement collapse failed' };
        }

        function testEntanglementCorrelation() {
            const p1 = { measured: false, measurementResult: null };
            const p2 = { measured: false, measurementResult: null };
            
            // Measure first particle
            p1.measured = true;
            p1.measurementResult = 'UP';
            
            // Simulate entanglement effect on second particle
            p2.measured = true;
            p2.measurementResult = p1.measurementResult === 'UP' ? 'DOWN' : 'UP';
            
            if (p1.measured && p2.measured && p1.measurementResult !== p2.measurementResult) {
                return { pass: true, message: 'Entanglement correlation working (opposite states)' };
            }
            
            return { pass: false, message: 'Entanglement correlation failed' };
        }

        function testBoundsChecking() {
            const width = 800;
            const height = 600;
            const radius = 15;
            
            let x = 10;
            let y = 10;
            
            // Simulate boundary check
            x = Math.max(radius, Math.min(width - radius, x));
            y = Math.max(radius, Math.min(height - radius, y));
            
            if (x === radius && y === radius) {
                return { pass: true, message: 'Bounds checking working correctly' };
            }
            
            return { pass: false, message: 'Bounds checking failed' };
        }

        function testStatsUpdate() {
            const stats = {
                particles: 0,
                pairs: 0,
                measured: 0
            };
            
            // Simulate adding particles and pairs
            stats.particles = 4;
            stats.pairs = 2;
            stats.measured = 1;
            
            if (stats.particles === 4 && stats.pairs === 2 && stats.measured === 1) {
                return { pass: true, message: 'Stats update working correctly' };
            }
            
            return { pass: false, message: 'Stats update failed' };
        }

        // Run tests automatically when page loads
        window.onload = function() {
            console.log('Quantum Entanglement Simulator Tests Loaded');
        };
    </script>
</body>
</html>
