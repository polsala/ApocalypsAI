<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nightly Quantum Entanglement Simulator</title>
    <style>
        :root {
            --bg: #0f1226;
            --panel: #1a1f3d;
            --accent: #6c5ce7;
            --accent-2: #00cec9;
            --text: #e6e6e6;
            --muted: #a0a7c8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(1200px 800px at 20% -10%, #1b2047 0%, #0f1226 50%, #0a0d1a 100%);
            color: var(--text);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .title {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .quantum-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
        }
        .controls {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }
        .panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
        }
        .panel h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #d8def1;
        }
        .gate-palette {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .gate-btn {
            padding: 10px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            background: linear-gradient(180deg, rgba(108, 92, 231, 0.15), rgba(0, 206, 201, 0.1));
            color: var(--text);
            cursor: grab;
            text-align: center;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .gate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.3);
            border-color: rgba(108, 92, 231, 0.6);
        }
        .circuit-board {
            position: relative;
            min-height: 300px;
            background: linear-gradient(180deg, rgba(26, 31, 61, 0.8), rgba(15, 18, 38, 0.8));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
        }
        .qubit-lines {
            display: grid;
            grid-template-rows: repeat(4, 60px);
            gap: 10px;
            margin-bottom: 20px;
        }
        .qubit-line {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .qubit-label {
            width: 40px;
            text-align: center;
            font-weight: bold;
            color: #b8c0ff;
        }
        .qubit-wire {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, rgba(108, 92, 231, 0.6), rgba(0, 206, 201, 0.6));
            position: relative;
        }
        .gate-slot {
            width: 60px;
            height: 100%;
            border-radius: 6px;
            border: 1px dashed rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .gate-slot:hover {
            background: rgba(108, 92, 231, 0.15);
            border-color: rgba(108, 92, 231, 0.6);
        }
        .gate-placed {
            background: linear-gradient(180deg, rgba(108, 92, 231, 0.3), rgba(0, 206, 201, 0.2));
            border: 1px solid rgba(108, 92, 231, 0.7);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }
        .gate-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: linear-gradient(180deg, rgba(108, 92, 231, 0.2), rgba(0, 206, 201, 0.15));
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }
        .btn-danger {
            background: linear-gradient(180deg, rgba(255, 82, 82, 0.2), rgba(255, 82, 82, 0.1));
            border-color: rgba(255, 82, 82, 0.6);
        }
        .btn-success {
            background: linear-gradient(180deg, rgba(72, 201, 176, 0.2), rgba(72, 201, 176, 0.1));
            border-color: rgba(72, 201, 176, 0.6);
        }
        .visualization {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(26, 31, 61, 0.8), rgba(15, 18, 38, 0.8));
            border: 1px solid rgba(255,255,255,0.1);
        }
        .prob-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .prob-item {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        .prob-value {
            font-size: 18px;
            font-weight: bold;
            color: #b8c0ff;
        }
        .prob-label {
            font-size: 12px;
            color: var(--muted);
        }
        .entanglement-visual {
            width: 100%;
            height: 200px;
            border-radius: 8px;
            background: radial-gradient(400px 200px at 50% 50%, rgba(108, 92, 231, 0.15), rgba(0, 0, 0, 0));
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            pointer-events: none;
            z-index: 1000;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        @media (max-width: 900px) {
            .controls {
                grid-template-columns: 1fr;
            }
            .prob-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">
                <div class="quantum-dot"></div>
                <div>
                    <h1>Nightly Quantum Entanglement Simulator</h1>
                    <div class="subtitle">Build circuits, visualize entanglement, and explore quantum mechanics</div>
                </div>
            </div>
            <div class="subtitle">Made with React & D3.js</div>
        </header>

        <div id="root"></div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script type="text/babel" src="main.js"></script>
</body>
</html>
