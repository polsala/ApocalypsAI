<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Entanglement Simulator</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --grid-color: #2a2f3a;
            --particle-color: #00f3ff;
            --entangled-color: #ff00ff;
            --measurement-color: #ffff00;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--particle-color), var(--entangled-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--particle-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        button:hover {
            background: var(--particle-color);
            color: #000;
            box-shadow: 0 0 10px var(--particle-color);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #666;
        }

        .measurement-controls {
            display: flex;
            gap: 5px;
        }

        .measurement-btn {
            border-color: var(--measurement-color);
        }

        .measurement-btn.active {
            background: var(--measurement-color);
            color: #000;
            font-weight: bold;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            font-size: 0.8rem;
            color: #aaa;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 4px;
        }

        .canvas-container {
            flex: 1;
            position: relative;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .entanglement-line {
            stroke: var(--entangled-color);
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            opacity: 0.5;
        }

        .entanglement-line.active {
            stroke-dasharray: none;
            stroke-width: 3;
            opacity: 1;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .particle-label {
            font-size: 10px;
            fill: white;
            text-anchor: middle;
            pointer-events: none;
        }

        .superposition-ring {
            stroke: var(--particle-color);
            stroke-width: 1;
            fill: none;
            opacity: 0.3;
        }

        .measurement-wave {
            stroke: var(--measurement-color);
            stroke-width: 2;
            fill: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Quantum Entanglement Simulator</h1>
        <p class="subtitle">Spooky action at a distance, visualized</p>
        
        <div class="controls">
            <button id="createBtn">Create Entangled Pair</button>
            <button id="resetBtn">Reset Simulation</button>
            <button id="toggleSoundBtn">🔊 Sound On</button>
        </div>
        
        <div class="measurement-controls">
            <span style="margin-right: 10px;">Measurement Basis:</span>
            <button class="measurement-btn active" data-basis="z">Z-Axis</button>
            <button class="measurement-btn" data-basis="x">X-Axis</button>
            <button class="measurement-btn" data-basis="y">Y-Axis</button>
        </div>
        
        <div class="stats">
            <div class="stat-item">Pairs: <span id="pairCount">0</span></div>
            <div class="stat-item">Entangled: <span id="entangledCount">0</span></div>
            <div class="stat-item">Collapsed: <span id="collapsedCount">0</span></div>
            <div class="stat-item">Distance: <span id="distance">0</span>px</div>
        </div>
    </header>

    <div class="canvas-container">
        <canvas id="quantumCanvas"></canvas>
        <div class="instructions">
            <strong>How to use:</strong><br>
            1. Create entangled pairs<br>
            2. Click on particles to measure them<br>
            3. Watch instant correlation across distance<br>
            4. Try different measurement bases
        </div>
    </div>

    <script>
        class QuantumEntanglementSimulator {
            constructor() {
                this.canvas = document.getElementById('quantumCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.entanglements = [];
                this.measurementBasis = 'z';
                this.audioContext = null;
                this.soundEnabled = true;
                this.animationId = null;
                this.time = 0;

                this.init();
                this.setupEventListeners();
                this.animate();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            }

            setupEventListeners() {
                document.getElementById('createBtn').addEventListener('click', () => this.createEntangledPair());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
                document.getElementById('toggleSoundBtn').addEventListener('click', (e) => this.toggleSound(e.target));
                
                document.querySelectorAll('.measurement-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.measurement-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.measurementBasis = e.target.dataset.basis;
                    });
                });

                this.canvas.addEventListener('click', (e) => this.handleCanvasClick(e));
            }

            createEntangledPair() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                // Create two particles at random positions
                const p1 = new QuantumParticle(
                    Math.random() * (width * 0.4) + (width * 0.1),
                    Math.random() * height,
                    'Particle A'
                );
                
                const p2 = new QuantumParticle(
                    Math.random() * (width * 0.4) + (width * 0.5),
                    Math.random() * height,
                    'Particle B'
                );

                this.particles.push(p1, p2);
                this.entanglements.push(new Entanglement(p1, p2));
                
                if (this.soundEnabled) {
                    this.playSound('entangle');
                }
                
                this.updateStats();
            }

            handleCanvasClick(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Find clicked particle
                for (let particle of this.particles) {
                    const distance = Math.hypot(particle.x - x, particle.y - y);
                    if (distance < particle.radius + 10) {
                        this.measureParticle(particle);
                        break;
                    }
                }
            }

            measureParticle(particle) {
                if (particle.isCollapsed) return;

                // Find entangled partner
                const entanglement = this.entanglements.find(e => 
                    e.particle1 === particle || e.particle2 === particle
                );

                if (entanglement) {
                    const partner = entanglement.particle1 === particle ? entanglement.particle2 : entanglement.particle1;
                    
                    // Calculate measurement result based on basis
                    const result = this.measureState(particle.state, this.measurementBasis);
                    const partnerResult = this.getPartnerResult(result, this.measurementBasis);

                    // Apply results
                    particle.collapse(result);
                    partner.collapse(partnerResult);

                    // Visual effects
                    this.createMeasurementWave(particle);
                    this.createMeasurementWave(partner);

                    if (this.soundEnabled) {
                        this.playSound('collapse');
                    }

                    this.updateStats();
                }
            }

            measureState(state, basis) {
                // Simplified quantum measurement
                const random = Math.random();
                
                if (basis === 'z') {
                    return random < Math.abs(state.z) ? 1 : -1;
                } else if (basis === 'x') {
                    return random < Math.abs(state.x) ? 1 : -1;
                } else if (basis === 'y') {
                    return random < Math.abs(state.y) ? 1 : -1;
                }
                
                return random < 0.5 ? 1 : -1;
            }

            getPartnerResult(result, basis) {
                // For entangled particles, partner has opposite result
                return -result;
            }

            createMeasurementWave(particle) {
                particle.measurementWave = {
                    radius: 0,
                    maxRadius: 200,
                    opacity: 1
                };
            }

            reset() {
                this.particles = [];
                this.entanglements = [];
                this.updateStats();
                if (this.soundEnabled) {
                    this.playSound('reset');
                }
            }

            toggleSound(button) {
                this.soundEnabled = !this.soundEnabled;
                button.textContent = this.soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
                
                if (this.soundEnabled && !this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playSound(type) {
                if (!this.soundEnabled) return;
                
                if (!this.audioContext) {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }

                const osc = this.audioContext.createOscillator();
                const gain = this.audioContext.createGain();
                
                osc.connect(gain);
                gain.connect(this.audioContext.destination);

                const now = this.audioContext.currentTime;

                if (type === 'entangle') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'collapse') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'reset') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, now);
                    osc.frequency.linearRampToValueAtTime(220, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            }

            updateStats() {
                document.getElementById('pairCount').textContent = this.entanglements.length;
                document.getElementById('entangledCount').textContent = this.particles.filter(p => !p.isCollapsed).length;
                document.getElementById('collapsedCount').textContent = this.particles.filter(p => p.isCollapsed).length;
                
                if (this.entanglements.length > 0) {
                    const firstEntanglement = this.entanglements[0];
                    const dist = Math.hypot(
                        firstEntanglement.particle1.x - firstEntanglement.particle2.x,
                        firstEntanglement.particle1.y - firstEntanglement.particle2.y
                    );
                    document.getElementById('distance').textContent = Math.round(dist);
                } else {
                    document.getElementById('distance').textContent = '0';
                }
            }

            animate() {
                this.time += 0.1;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.drawGrid();
                this.drawEntanglements();
                this.updateParticles();
                
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            drawGrid() {
                this.ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-color');
                this.ctx.lineWidth = 1;
                this.ctx.beginPath();
                
                const gridSize = 50;
                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                }
                for (let y = 0; y < this.canvas.height; y += gridSize) {
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                }
                this.ctx.stroke();
            }

            drawEntanglements() {
                this.entanglements.forEach(entanglement => {
                    const p1 = entanglement.particle1;
                    const p2 = entanglement.particle2;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(p1.x, p1.y);
                    this.ctx.lineTo(p2.x, p2.y);
                    
                    if (p1.isCollapsed || p2.isCollapsed) {
                        this.ctx.setLineDash([]);
                        this.ctx.strokeStyle = '#666';
                        this.ctx.lineWidth = 1;
                    } else {
                        this.ctx.setLineDash([5, 5]);
                        this.ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--entangled-color');
                        this.ctx.lineWidth = 2;
                    }
                    
                    this.ctx.stroke();
                });
            }

            updateParticles() {
                this.particles.forEach(particle => {
                    particle.update();
                    particle.draw(this.ctx, this.time);
                });
            }
        }

        class QuantumParticle {
            constructor(x, y, label) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.label = label;
                this.isCollapsed = false;
                this.state = {
                    x: Math.random() * 2 - 1,
                    y: Math.random() * 2 - 1,
                    z: Math.random() * 2 - 1
                };
                this.color = this.getRandomColor();
                this.measurementWave = null;
                this.collapseResult = null;
            }

            getRandomColor() {
                const colors = ['#00f3ff', '#ff00ff', '#ffff00', '#00ff88', '#ff8800'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            collapse(result) {
                this.isCollapsed = true;
                this.collapseResult = result;
                this.color = result === 1 ? '#ffff00' : '#ff0000';
            }

            update() {
                if (this.measurementWave) {
                    this.measurementWave.radius += 5;
                    this.measurementWave.opacity -= 0.02;
                    
                    if (this.measurementWave.opacity <= 0) {
                        this.measurementWave = null;
                    }
                }
            }

            draw(ctx, time) {
                // Draw superposition ring
                if (!this.isCollapsed) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 10 + Math.sin(time * 2) * 3, 0, Math.PI * 2);
                    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--particle-color');
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Draw particle
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw measurement wave
                if (this.measurementWave) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.measurementWave.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--measurement-color');
                    ctx.lineWidth = 2;
                    ctx.globalAlpha = this.measurementWave.opacity;
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                }

                // Draw label
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.label, this.x, this.y - this.radius - 5);

                // Draw state indicator
                if (!this.isCollapsed) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.font = '8px Arial';
                    ctx.fillText('Superposition', this.x, this.y + this.radius + 12);
                } else {
                    ctx.fillStyle = this.collapseResult === 1 ? '#ffff00' : '#ff0000';
                    ctx.font = '8px Arial';
                    ctx.fillText(this.collapseResult === 1 ? '↑ Spin Up' : '↓ Spin Down', this.x, this.y + this.radius + 12);
                }
            }
        }

        class Entanglement {
            constructor(particle1, particle2) {
                this.particle1 = particle1;
                this.particle2 = particle2;
            }
        }

        // Initialize simulator when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new QuantumEntanglementSimulator();
        });
    </script>
</body>
</html>
