<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚛️</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Interactive Quantum Entanglement Simulator" />
    <title>Quantum Entanglement Simulator</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
      }
      #root {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .loading {
        color: white;
        text-align: center;
        padding: 50px;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading">⚛️ Initializing Quantum Simulator...</div>
    </div>
    
    <!-- React and ReactDOM (CDN for standalone use) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Main Application -->
    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      const QuantumSimulator = () => {
        const [qubits, setQubits] = useState(2);
        const [circuit, setCircuit] = useState([]);
        const [entanglements, setEntanglements] = useState([]);
        const [measurementResults, setMeasurementResults] = useState([]);
        const [isSimulating, setIsSimulating] = useState(false);
        const [quantumState, setQuantumState] = useState('|00⟩');
        const [showTooltip, setShowTooltip] = useState(false);
        const [tooltipText, setTooltipText] = useState('');
        const [tooltipPos, setTooltipPos] = useState({ x: 0, y: 0 });
        const circuitRef = useRef(null);

        const gates = [
          { name: 'H', type: 'h-gate', tooltip: 'Hadamard Gate: Creates superposition' },
          { name: 'X', type: 'x-gate', tooltip: 'Pauli-X Gate: Quantum NOT operation' },
          { name: '●', type: 'cnot', tooltip: 'CNOT Gate: Creates entanglement between qubits' },
          { name: 'M', type: 'measure', tooltip: 'Measurement: Collapses quantum state to classical result' }
        ];

        const addQubit = () => {
          if (qubits < 6) {
            setQubits(qubits + 1);
            setCircuit(circuit.map(row => [...row, null]));
          }
        };

        const removeQubit = () => {
          if (qubits > 1) {
            setQubits(qubits - 1);
            setCircuit(circuit.map(row => row.slice(0, -1)));
          }
        };

        const clearCircuit = () => {
          setCircuit([]);
          setEntanglements([]);
          setMeasurementResults([]);
          setQuantumState('|00⟩');
        };

        const handleDragStart = (e, gate) => {
          e.dataTransfer.setData('gate', JSON.stringify(gate));
        };

        const handleDrop = (e, qubitIndex, timeIndex) => {
          e.preventDefault();
          const gateData = JSON.parse(e.dataTransfer.getData('gate'));
          
          const newCircuit = [...circuit];
          while (newCircuit.length <= qubitIndex) {
            newCircuit.push([]);
          }
          while (newCircuit[qubitIndex].length <= timeIndex) {
            newCircuit[qubitIndex].push(null);
          }
          
          newCircuit[qubitIndex][timeIndex] = gateData;
          setCircuit(newCircuit);
        };

        const handleDragOver = (e) => {
          e.preventDefault();
        };

        const handleMouseEnter = (e, text) => {
          setTooltipText(text);
          setTooltipPos({ x: e.clientX + 10, y: e.clientY + 10 });
          setShowTooltip(true);
        };

        const handleMouseLeave = () => {
          setShowTooltip(false);
        };

        const simulateCircuit = async () => {
          setIsSimulating(true);
          setQuantumState('Simulating...');
          
          await new Promise(resolve => setTimeout(resolve, 1000));
          
          const newEntanglements = [];
          for (let i = 0; i < circuit.length; i++) {
            for (let j = i + 1; j < circuit.length; j++) {
              for (let t = 0; t < Math.max(circuit[i].length, circuit[j].length); t++) {
                const gateI = circuit[i][t];
                const gateJ = circuit[j][t];
                if (gateI && gateJ && (gateI.type === 'cnot' || gateJ.type === 'cnot')) {
                  newEntanglements.push({ q1: i, q2: j, time: t });
                }
              }
            }
          }
          setEntanglements(newEntanglements);
          
          let state = '|0'.repeat(qubits) + '⟩';
          if (newEntanglements.length > 0) {
            state = newEntanglements.length === 1 ? '|Bell⟩' : '|GHZ⟩';
          }
          setQuantumState(state);
          
          const results = [];
          for (let i = 0; i < qubits; i++) {
            const hasMeasurement = circuit[i] && circuit[i].some(g => g && g.type === 'measure');
            if (hasMeasurement) {
              const isEntangled = newEntanglements.some(e => e.q1 === i || e.q2 === i);
              const result = Math.random() < 0.5 ? '0' : '1';
              results.push({
                qubit: i,
                result: isEntangled ? 'Correlated' : result,
                probability: isEntangled ? 50 : (result === '0' ? 60 : 40)
              });
            }
          }
          setMeasurementResults(results);
          
          setIsSimulating(false);
        };

        const createBellState = () => {
          const newCircuit = Array.from({ length: 2 }, () => []);
          newCircuit[0][0] = { name: 'H', type: 'h-gate' };
          newCircuit[1][1] = { name: '●', type: 'cnot' };
          setCircuit(newCircuit);
        };

        const createGHZState = () => {
          const newCircuit = Array.from({ length: 3 }, () => []);
          newCircuit[0][0] = { name: 'H', type: 'h-gate' };
          newCircuit[1][1] = { name: '●', type: 'cnot' };
          newCircuit[2][2] = { name: '●', type: 'cnot' };
          setCircuit(newCircuit);
        };

        return React.createElement('div', { className: 'quantum-container' },
          React.createElement('div', { className: 'header' },
            React.createElement('h1', {}, '⚛️ Quantum Entanglement Simulator'),
            React.createElement('p', {}, 'Build circuits, create entanglement, and observe quantum magic!')
          ),
          React.createElement('div', { className: 'controls' },
            React.createElement('div', { className: 'controls-grid' },
              React.createElement('div', {},
                React.createElement('label', { style: { color: 'white', fontWeight: 'bold' } }, `Qubits: ${qubits}`),
                React.createElement('div', { style: { marginTop: '10px' } },
                  React.createElement('button', {
                    className: 'btn secondary',
                    onClick: addQubit,
                    disabled: qubits >= 6
                  }, '+ Add Qubit'),
                  React.createElement('button', {
                    className: 'btn secondary',
                    onClick: removeQubit,
                    disabled: qubits <= 1,
                    style: { marginLeft: '10px' }
                  }, '- Remove Qubit')
                )
              ),
              React.createElement('div', {},
                React.createElement('label', { style: { color: 'white', fontWeight: 'bold' } }, 'Quick Presets:'),
                React.createElement('div', { style: { marginTop: '10px' } },
                  React.createElement('button', { className: 'btn', onClick: createBellState }, 'Bell State'),
                  React.createElement('button', {
                    className: 'btn',
                    onClick: createGHZState,
                    style: { marginLeft: '10px' }
                  }, 'GHZ State')
                )
              ),
              React.createElement('div', {},
                React.createElement('button', {
                  className: 'btn',
                  onClick: simulateCircuit,
                  disabled: isSimulating || circuit.length === 0
                }, isSimulating ? 'Simulating...' : 'Run Simulation'),
                React.createElement('button', {
                  className: 'btn secondary',
                  onClick: clearCircuit,
                  style: { marginLeft: '10px' }
                }, 'Clear Circuit')
              )
            )
          ),
          React.createElement('div', { className: 'circuit-container' },
            React.createElement('h3', { style: { color: 'white', marginBottom: '20px' } }, 'Quantum Circuit Builder'),
            React.createElement('div', { className: 'draggable-gates' },
              gates.map((gate, index) =>
                React.createElement('div', {
                  key: index,
                  className: 'draggable-gate',
                  draggable: true,
                  onDragStart: (e) => handleDragStart(e, gate),
                  onMouseEnter: (e) => handleMouseEnter(e, gate.tooltip),
                  onMouseLeave: handleMouseLeave
                }, gate.name)
              )
            ),
            React.createElement('div', {
              className: 'circuit-grid',
              ref: circuitRef,
              onDragOver: handleDragOver
            },
              React.createElement('div', { className: 'qubit-labels' },
                Array.from({ length: qubits }, (_, i) =>
                  React.createElement('div', { key: i, className: 'qubit-label' }, `Qubit ${i}`)
                )
              ),
              React.createElement('div', { className: 'circuit-board' },
                Array.from({ length: qubits }, (_, qubitIndex) =>
                  React.createElement('div', { key: qubitIndex, className: 'qubit-line' },
                    circuit[qubitIndex] && circuit[qubitIndex].map((gate, timeIndex) =>
                      React.createElement('div', {
                        key: timeIndex,
                        className: `gate ${gate ? gate.type : ''}`,
                        style: { left: `${timeIndex * 100 + 50}px` },
                        onMouseEnter: (e) => gate && handleMouseEnter(e, gate.tooltip),
                        onMouseLeave: handleMouseLeave,
                        onClick: () => {
                          const newCircuit = [...circuit];
                          if (newCircuit[qubitIndex]) {
                            newCircuit[qubitIndex][timeIndex] = null;
                            setCircuit(newCircuit);
                          }
                        }
                      }, gate ? gate.name : '')
                    ),
                    entanglements.map((ent, index) => {
                      if (ent.q1 === qubitIndex || ent.q2 === qubitIndex) {
                        const otherQubit = ent.q1 === qubitIndex ? ent.q2 : ent.q1;
                        const y1 = qubitIndex * 40 + 20;
                        const y2 = otherQubit * 40 + 20;
                        const x = ent.time * 100 + 70;
                        
                        return React.createElement('div', {
                          key: `ent-${index}`,
                          className: 'entanglement-line',
                          style: {
                            top: `${Math.min(y1, y2)}px`,
                            left: `${x}px`,
                            width: '2px',
                            height: `${Math.abs(y2 - y1)}px`
                          }
                        });
                      }
                      return null;
                    })
                  )
                )
              )
            )
          ),
          React.createElement('div', { className: 'results-panel' },
            React.createElement('h3', { style: { color: 'white', marginBottom: '20px' } }, 'Simulation Results'),
            React.createElement('div', { className: 'results-grid' },
              React.createElement('div', { className: 'result-card' },
                React.createElement('h4', { style: { margin: '0 0 10px 0', color: '#fff' } }, 'Quantum State'),
                React.createElement('div', { className: 'quantum-state' }, quantumState),
                entanglements.length > 0 &&
                  React.createElement('div', { style: { marginTop: '10px', color: '#ff00ff' } },
                    React.createElement('span', { className: 'status-indicator' }),
                    `${entanglements.length} entanglement(s) detected`
                  )
              ),
              React.createElement('div', { className: 'result-card entangled' },
                React.createElement('h4', { style: { margin: '0 0 10px 0', color: '#fff' } }, 'Entanglement Status'),
                React.createElement('p', { style: { color: '#ccc' } },
                  entanglements.length === 0
                    ? 'No entanglement detected. Qubits are independent.'
                    : `${entanglements.length} entangled pair(s) found. Spooky action at a distance!`
                )
              ),
              React.createElement('div', { className: 'result-card collapsed' },
                React.createElement('h4', { style: { margin: '0 0 10px 0', color: '#fff' } }, 'Measurement Results'),
                measurementResults.length === 0
                  ? React.createElement('p', { style: { color: '#ccc' } }, 'Run simulation to see measurement outcomes')
                  : measurementResults.map((result, index) =>
                      React.createElement('div', { key: index, style: { marginBottom: '15px' } },
                        React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
                          React.createElement('span', { style: { color: '#fff', fontWeight: 'bold' } }, `Qubit ${result.qubit}`),
                          React.createElement('span', { style: { color: '#f39c12', fontWeight: 'bold' } }, result.result)
                        ),
                        React.createElement('div', { className: 'probability-bar' },
                          React.createElement('div', { className: 'probability-fill', style: { width: `${result.probability}%` } })
                        ),
                        React.createElement('small', { style: { color: '#ccc' } }, `${result.probability}% probability`)
                      )
                    )
              )
            )
          ),
          showTooltip &&
            React.createElement('div', {
              className: 'tooltip show',
              style: {
                left: tooltipPos.x,
                top: tooltipPos.y
              }
            }, tooltipText)
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(React.createElement(QuantumSimulator));
    </script>
  </body>
</html>
