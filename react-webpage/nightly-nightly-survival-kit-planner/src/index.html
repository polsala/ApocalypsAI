<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survival Kit Planner</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <style>
    body {font-family: Arial, sans-serif; margin: 2rem;}
    .kit {margin-top: 1rem;}
    .kit li {margin: 0.3rem 0;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import {environments, getKit} from "./kit.js";
    const e = React.createElement;
    function App() {
      const [env, setEnv] = React.useState("");
      const [kit, setKit] = React.useState([]);
      const generate = () => {
        setKit(getKit(env));
      };
      return e("div", null,
        e("h1", null, "Survival Kit Planner"),
        e("label", null, "Choose environment: ",
          e("select", {value: env, onChange: e => setEnv(e.target.value)},
            e("option", {value: ""}, "--Select--"),
            Object.keys(environments).map(key =>
              e("option", {key, value: key}, key)
            )
          )
        ),
        e("button", {onClick: generate, style: {marginLeft: "0.5rem"}}, "Generate"),
        kit.length > 0 && e("div", {className: "kit"},
          e("h2", null, `${env} Survival Kit`),
          e("ul", null,
            kit.map((item, i) => e("li", {key: i}, item))
          )
        )
      );
    }
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
</html>
