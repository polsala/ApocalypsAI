# Example environment configuration

# A unique name for your environment. This will be used to prefix the container name.
name: my-dev-env

# The Docker image to use for this environment.
# You can use official images like python:3.11-slim, node:18, or your own custom images.
image: python:3.11-slim

# Ports to expose from the container to the host.
# Format: "HOST_PORT:CONTAINER_PORT"
ports:
  - "8000:8000"
  - "5000:5000"

# Volumes to mount into the container.
# Format: "HOST_PATH:CONTAINER_PATH"
# This is useful for sharing your code or data with the container.
volumes:
  - ".:/app"
  - "~/.ssh:/root/.ssh:ro"

# Commands to run inside the container after it starts.
# This is useful for setting up your environment, installing dependencies, etc.
commands:
  - "echo 'Setting up development environment...'"
  - "pip install --no-cache-dir -r requirements.txt"
  - "echo 'Environment ready!'"
