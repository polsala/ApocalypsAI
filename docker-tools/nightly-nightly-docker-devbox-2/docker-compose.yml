version: '3.8'

services:
  nightly-devbox:
    build: .
    container_name: nightly-devbox
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2222:22"
    stdin_open: true
    tty: true
    restart: unless-stopped
    command: ["sh", "-c", "service ssh start && tail -f /dev/null"]
