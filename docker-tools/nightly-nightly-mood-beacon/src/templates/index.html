<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApocalypsAI Mood Beacon</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: {{ color }}; /* Dynamic background color */
            color: #333;
            text-align: center;
            transition: background-color 0.5s ease;
        }
        .beacon-container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 80%;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #222;
        }
        p {
            font-size: 1.5em;
            line-height: 1.6;
            color: #444;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="beacon-container">
        <h1>ApocalypsAI Mood Beacon</h1>
        <p>{{ message }}</p>
        <div class="footer">
            Beacon operational. Stay vigilant.
        </div>
    </div>
</body>
</html>
