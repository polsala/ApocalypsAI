version: '3.8'
services:
  web:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # Ensure nginx.conf exists alongside this file
  app:
    image: busybox:latest
    command: sh -c "while true; do echo 'App is running!'; sleep 5; done"
    depends_on:
      - web
