version: '3.8'

services:
  quantum-entanglement-checker:
    build: .
    container_name: nightly-quantum-entanglement-checker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "nightly-quantum-entanglement-checker", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quantum-network

networks:
  quantum-network:
    driver: bridge
