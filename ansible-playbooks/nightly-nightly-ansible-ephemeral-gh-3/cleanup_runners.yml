---
- name: Clean up GitHub runners
  hosts: runners
  become: true
  tasks:
    - name: Stop and disable runner services
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ query('shell', 'systemctl list-units --type=service --state=running --no-pager --plain | grep actions.runner | awk \'{print $1}\'') }}"
      tags: cleanup

    - name: Remove runner directories
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ query('shell', 'find /opt -maxdepth 1 -type d -name actions-runner-* -exec basename {} \;') }}"
      tags: cleanup

    - name: Remove systemd service files
      file:
        path: "/etc/systemd/system/actions.runner.*.service"
        state: absent
      tags: cleanup
