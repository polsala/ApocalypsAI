---\n- name: Test Survival Environment Setup\n  hosts: localhost\n  become: false\n  vars:\n    install_packages: false\n  tasks:\n    - name: Ensure install_packages is false for testing\n      set_fact:\n        install_packages: false\n\n    - name: Run the setup playbook\n      import_playbook: ../src/setup_survival.yml\n\n    - name: Verify survival directory exists\n      stat:\n        path: /opt/survival\n      register: surv_dir\n\n    - name: Assert directory is present\n      assert:\n        that:\n          - surv_dir.stat.isdir\n\n    - name: Verify checklist file content\n      slurp:\n        src: /opt/survival/checklist.txt\n      register: checklist\n\n    - name: Decode checklist content\n      set_fact:\n        checklist_content: "{{ checklist.content | b64decode }}"\n\n    - name: Assert checklist contains 'Water purification'\n      assert:\n        that:\n          - "'Water purification' in checklist_content"\n\n    - name: Clean up created files (teardown)\n      file:\n        path: /opt/survival\n        state: absent\n      become: true\n
