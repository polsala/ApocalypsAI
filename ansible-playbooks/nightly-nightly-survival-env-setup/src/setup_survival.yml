---\n- name: Setup Survival Environment\n  hosts: all\n  become: true\n  vars:\n    survival_dir: /opt/survival\n    packages:\n      - curl\n      - git\n      - htop\n    install_packages: true\n  tasks:\n    - name: Install essential packages\n      apt:\n        name: "{{ packages }}"\n        state: present\n        update_cache: yes\n      when: install_packages and ansible_os_family == "Debian"\n\n    - name: Ensure survival directory exists\n      file:\n        path: "{{ survival_dir }}"\n        state: directory\n        mode: "0755"\n\n    - name: Deploy survival checklist\n      copy:\n        dest: "{{ survival_dir }}/checklist.txt"\n        content: |\n          Survival Checklist:\n          - Water purification\n          - Food rations\n          - First aid kit\n          - Radio\n          - Flashlight\n        mode: "0644"\n\n    - name: Setup daily log rotation cron\n      cron:\n        name: "Survival log rotate"\n        minute: "0"\n        hour: "0"\n        job: "logrotate /etc/logrotate.d/survival"\n        state: present\n
