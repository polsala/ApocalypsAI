---
- name: Test log_parser playbook
  hosts: all
  gather_facts: no

  tasks:
    - name: Mock log file content
      copy:
        dest: /tmp/mock_syslog.log
        content: |
          Jan 1 00:00:01 testserver sshd[123]: Failed password for invalid user testuser from 192.168.1.1 port 12345 ssh2
          Jan 1 00:00:02 testserver sshd[124]: Failed password for invalid user testuser from 192.168.1.1 port 12346 ssh2
          Jan 1 00:00:03 testserver sshd[125]: Failed password for invalid user testuser from 192.168.1.1 port 12347 ssh2
          Jan 1 00:00:04 testserver sshd[126]: Failed password for invalid user testuser from 192.168.1.1 port 12348 ssh2
          Jan 1 00:00:05 testserver sshd[127]: Failed password for invalid user testuser from 192.168.1.1 port 12349 ssh2
          Jan 1 00:00:06 testserver sshd[128]: Failed password for invalid user testuser from 192.168.1.1 port 12350 ssh2
          Jan 1 00:00:07 testserver kernel: Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)
          Jan 1 00:00:08 testserver systemd[1]: Failed to start NetworkManager.service.
          Jan 1 00:00:09 testserver kernel: No space left on device
          Jan 1 00:00:10 testserver kernel: No space left on device
          Jan 1 00:00:11 testserver kernel: No space left on device
          Jan 1 00:00:12 testserver kernel: No space left on device
          Jan 1 00:00:13 testserver kernel: No space left on device
          Jan 1 00:00:14 testserver kernel: No space left on device
          Jan 1 00:00:15 testserver sudo:    root : TTY=pts/0 ; PWD=/home/user ; USER=root ; COMMAND=/bin/bash
          Jan 1 00:00:16 testserver sudo:    root : TTY=pts/0 ; PWD=/home/user ; USER=root ; COMMAND=/bin/bash

    - name: Set mock log file in vars
      set_fact:
        log_files: ["/tmp/mock_syslog.log"]
        anomaly_threshold: 5

    - name: Run the log parser playbook (dry run)
      ansible.builtin.command: "ansible-playbook log_parser.yml --check --extra-vars 'log_files=["/tmp/mock_syslog.log"] anomaly_threshold=5'"
      register: playbook_run
      changed_when: false

    - name: Assert that SSH failed logins are detected
      assert:
        that:
          - "'Failed password for invalid user' in playbook_run.stdout"

    - name: Assert that disk full messages are detected
      assert:
        that:
          - "'No space left on device' in playbook_run.stdout"

    - name: Assert that SSH failed login anomalies are detected (threshold 5)
      assert:
        that:
          - "'SSH failed login' is not defined or 'SSH failed login' in playbook_run.stdout"
          # This assertion is tricky because the output might not explicitly name the anomaly.
          # A more robust test would involve checking the generated report file.
          # For this example, we'll check for the presence of the pattern itself.

    - name: Assert that disk full anomalies are detected (threshold 5)
      assert:
        that:
          - "'disk_full' is not defined or 'disk_full' in playbook_run.stdout"
          # Similar to above, checking for the pattern presence.

    - name: Check for the existence of the report file
      stat:
        path: "/tmp/log_analysis_report_localhost.txt"
      register: report_file
      assert:
        that:
          - "report_file.stat.exists"

    - name: Clean up mock log file
      file:
        path: /tmp/mock_syslog.log
        state: absent
