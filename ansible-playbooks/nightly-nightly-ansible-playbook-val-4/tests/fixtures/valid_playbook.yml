- name: Web Server Setup
  hosts: webservers
  become: true
  tasks:
    - name: Install Apache
      package:
        name: apache2
        state: present
    
    - name: Start Apache service
      service:
        name: apache2
        state: started
        enabled: true
    
    - name: Create index.html
      copy:
        content: |
          <html>
          <head><title>Test Page</title></head>
          <body><h1>Hello from Ansible!</h1></body>
          </html>
        dest: /var/www/html/index.html
        mode: '0644'
        owner: www-data
        group: www-data
