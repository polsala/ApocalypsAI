---
- name: Autoremove orphaned packages
  ansible.builtin.apt:
    autoremove: yes
  register: apt_autoremove_result
  # Mock rationale: The apt module interacts with the system's package manager. In tests, we'll verify this task is called.

- name: Report on orphaned package removal
  ansible.builtin.debug:
    msg: "Orphaned packages removed: {{ apt_autoremove_result.changed }}"
  when: apt_autoremove_result.changed
