---
- name: Gather uptime from targets and generate report
  hosts: targets
  gather_facts: false
  vars:
    report_path: "{{ playbook_dir }}/../uptime_report.txt"
  tasks:
    - name: Retrieve uptime (simulated)
      command: echo "up 10 days"
      register: uptime_cmd
      changed_when: false

    - name: Set host uptime fact
      set_fact:
        host_uptime: "{{ uptime_cmd.stdout }}"

    - name: Render uptime report
      template:
        src: "{{ playbook_dir }}/templates/uptime_report.j2"
        dest: "{{ report_path }}"
      vars:
        host_name: "{{ inventory_hostname }}"
        host_uptime: "{{ host_uptime }}"

