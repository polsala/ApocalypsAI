---\n- name: Nightly Apt Cleanup Playbook\n  hosts: local\n  gather_facts: false\n  vars:\n    # Users can override these via extra vars\n    mock_mode: false\n    mock_packages: ""\n  tasks:\n    - name: Gather installed packages (real mode)\n      command: apt list --installed\n      register: apt_list_raw\n      changed_when: false\n      when: not mock_mode\n\n    - name: Set package list output (real mode)\n      set_fact:\n        apt_list_output: "{{ apt_list_raw.stdout }}"\n      when: not mock_mode\n\n    - name: Set package list output (mock mode)\n      set_fact:\n        apt_list_output: "{{ mock_packages }}"\n      when: mock_mode\n\n    - name: Parse package names into a list\n      set_fact:\n        package_names: "{{ apt_list_output.split() }}"\n\n    - name: Count installed packages\n      set_fact:\n        package_count: "{{ package_names | length }}"\n\n    - name: Autoremove unused packages (real mode)\n      apt:\n        autoremove: yes\n        purge: yes\n      when: not mock_mode\n\n    - name: Clean apt cache (real mode)\n      apt:\n        autoclean: yes\n      when: not mock_mode\n\n    - name: Assemble cleanup report\n      set_fact:\n        apt_cleanup_report:\n          total_installed: "{{ package_count }}"\n          cleaned: "{{ not mock_mode }}"\n\n    - name: Display report\n      debug:\n        var: apt_cleanup_report\n
