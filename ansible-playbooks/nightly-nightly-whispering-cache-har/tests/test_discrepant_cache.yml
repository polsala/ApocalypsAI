---
- name: Setup mock discrepant cache environment
  hosts: localhost
  gather_facts: no
  vars:
    test_base_path: "/tmp/ansible_test_cache_harmonizer_discrepant"
    test_report_file: "/tmp/ansible_test_cache_harmony_report_discrepant.txt"
  tasks:
    - name: Clean up previous test environment
      ansible.builtin.file:
        path: "{{ test_base_path }}"
        state: absent
      changed_when: false
      # Mock rationale: Ensures a clean slate for deterministic testing.

    - name: Ensure base test directory exists
      ansible.builtin.file:
        path: "{{ test_base_path }}"
        state: directory
        mode: '0755'

    - name: Create some required directories (but intentionally omit 'tools')
      ansible.builtin.file:
        path: "{{ test_base_path }}/rations"
        state: directory
        mode: '0755'

    - name: Create required files with INCORRECT content for manifest.txt
      ansible.builtin.copy:
        content: "just some random text\n" # Does not match regex ".*(water|food|meds).*"
        dest: "{{ test_base_path }}/manifest.txt"
        mode: '0644'
    - ansible.builtin.copy:
        content: "secret plans for survival\n"
        dest: "{{ test_base_path }}/secret_plans.txt"
        mode: '0644'

    - name: Clean up previous test report
      ansible.builtin.file:
        path: "{{ test_report_file }}"
        state: absent
      changed_when: false
      # Mock rationale: Ensures a clean slate for deterministic testing.

- name: Run the Whispering Cache Harmonizer playbook against discrepant mock environment
  import_playbook: ../src/harmonize_caches.yml
  vars:
    cache_base_path: "/tmp/ansible_test_cache_harmonizer_discrepant"
    report_file: "/tmp/ansible_test_cache_harmony_report_discrepant.txt"

- name: Verify the results for discrepant cache
  hosts: localhost
  gather_facts: no
  vars:
    test_report_file: "/tmp/ansible_test_cache_harmony_report_discrepant.txt"
  tasks:
    - name: Check if report file was created
      ansible.builtin.stat:
        path: "{{ test_report_file }}"
      register: report_stat

    - name: Assert report file exists
      ansible.builtin.assert:
        that:
          - report_stat.stat.exists
          - report_stat.stat.isreg
        fail_msg: "Discrepant cache report file was not created at {{ test_report_file }}"
        success_msg: "Discrepant cache report file exists."

    - name: Read the report content
      ansible.builtin.slurp:
        src: "{{ test_report_file }}"
      register: report_content

    - name: Assert report content indicates discrepancies
      ansible.builtin.assert:
        that:
          - report_content.content | b64decode | search("DISCREPANCIES DETECTED - Whispers are troubled!")
          - report_content.content | b64decode | search("Type: directory, Path: tools, Status: missing")
          - report_content.content | b64decode | search("Type: file, Path: manifest.txt, Status: content_mismatch")
        fail_msg: "Report content does not indicate correct discrepancies for discrepant cache."
        success_msg: "Report content correctly indicates discrepancies for discrepant cache."

    - name: Clean up test environment after verification
      ansible.builtin.file:
        path: "/tmp/ansible_test_cache_harmonizer_discrepant"
        state: absent
      changed_when: false
      # Mock rationale: Cleans up temporary files created during testing.
    - name: Clean up test report file
      ansible.builtin.file:
        path: "{{ test_report_file }}"
        state: absent
      changed_when: false
      # Mock rationale: Cleans up temporary files created during testing.
