---\n- name: Test survival tip rotator\n  hosts: localhost\n  gather_facts: false\n  vars:\n    tip_index: 0  # Force the first tip for a deterministic test\n  tasks:\n    - name: Run tip rotator playbook\n      import_playbook: ../src/tip_rotator.yml\n\n    - name: Read generated tip file\n      slurp:\n        src: /tmp/survival_tip.txt\n      register: tip_file\n\n    - name: Decode file content\n      set_fact:\n        tip_content: "{{ tip_file.content | b64decode | trim }}"\n\n    - name: Assert tip matches the first entry\n      assert:\n        that:\n          - tip_content == \"Always keep a spare water filter.\"\n        fail_msg: \"Tip content does not match expected first tip\"\n
