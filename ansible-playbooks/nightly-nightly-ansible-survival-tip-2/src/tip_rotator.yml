---\n- name: Rotate survival tip\n  hosts: all\n  gather_facts: false\n  vars_files:\n    - tips.yml\n  vars:\n    # If tip_index is not provided, pick a random index\n    tip_index: "{{ tip_index | default(lookup('random', range(tips | length) | list) | int) }}"\n  tasks:\n    - name: Determine selected tip\n      set_fact:\n        selected_tip: "{{ tips[ tip_index | int ] }}"\n\n    - name: Write tip to file\n      copy:\n        dest: /tmp/survival_tip.txt\n        content: "{{ selected_tip }}\n"\n        mode: '0644'\n
