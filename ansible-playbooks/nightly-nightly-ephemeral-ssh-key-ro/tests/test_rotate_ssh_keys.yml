---\n- name: Test SSH key rotation playbook (dry‑run)\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Execute the rotation playbook in check mode\n      command: ansible-playbook -i ../src/inventory.ini ../src/rotate_ssh_keys.yml --check\n      register: result\n      changed_when: false\n\n    - name: Ensure the playbook exited cleanly\n      assert:\n        that:\n          - result.rc == 0\n        fail_msg: "Rotation playbook failed with rc={{ result.rc }}"\n
