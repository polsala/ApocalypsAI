---\n- name: Rotate SSH keys on target hosts\n  hosts: all\n  gather_facts: false\n  vars:\n    ssh_key_path: "{{ ssh_key_path | default('~/.ssh/ansible_rotated_key') }}"\n    ssh_user: "{{ ssh_user | default(ansible_user | default('root')) }}"\n  tasks:\n    - name: Ensure the directory for the key exists\n      file:\n        path: "{{ ssh_key_path | dirname }}"\n        state: directory\n        mode: "0700"\n\n    - name: Generate a new SSH key pair\n      openssh_keypair:\n        path: "{{ ssh_key_path }}"\n        type: rsa\n        size: 4096\n        force: true\n        mode: "0600"\n\n    - name: Read the generated public key\n      slurp:\n        src: "{{ ssh_key_path }}.pub"\n      register: pubkey_content\n\n    - name: Set public key string variable\n      set_fact:\n        public_key: "{{ pubkey_content.content | b64decode }}"\n\n    - name: Install the new public key for the remote user\n      authorized_key:\n        user: "{{ ssh_user }}"\n        state: present\n        key: "{{ public_key }}"\n\n    - name: (Optional) Remove an old key if fingerprint provided\n      authorized_key:\n        user: "{{ ssh_user }}"\n        state: absent\n        key: "{{ old_key }}"\n      when: old_key is defined\n
