---
- name: Test Ansible Configuration Synchronization
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    # Mock rationale: Using a minimal set of hosts for testing.
    target_hosts: ["test_host_1", "test_host_2"]
    inventory_source: "./mock_inventory.ini"
    playbook_sources: ["./mock_playbooks/role_a", "./mock_playbooks/playbook_b"]
    destination_base_path: "/tmp/ansible_sync_test/"

  tasks:
    - name: Create mock inventory file
      ansible.builtin.copy:
        dest: "{{ inventory_source }}"
        content: "[all]\nlocalhost ansible_connection=local\n"

    - name: Create mock playbook directories and files
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop: ["./mock_playbooks/role_a", "./mock_playbooks/playbook_b"]

    - name: Create dummy playbook file
      ansible.builtin.copy:
        dest: "./mock_playbooks/role_a/tasks/main.yml"
        content: "- name: Dummy task\n  debug: msg='Hello from role_a'\n"

    - name: Include the main sync playbook
      ansible.builtin.import_playbook:
        name: ../sync_configs.yml

    - name: Verify destination base path creation (mocked)
      ansible.builtin.command: "echo '{{ destination_base_path }}'"
      register: created_path_output
      changed_when: true # Mocking that the file module would have changed state
      failed_when: created_path_output.stdout != destination_base_path

    - name: Verify inventory file copied (mocked)
      ansible.builtin.command: "echo '{{ destination_base_path }}/inventory.ini'"
      register: copied_inventory_output
      changed_when: true
      failed_when: copied_inventory_output.stdout != '{{ destination_base_path }}/inventory.ini'

    - name: Verify playbook directory copied (mocked)
      ansible.builtin.command: "echo '{{ destination_base_path }}/mock_playbooks/role_a'"
      register: copied_playbook_output
      changed_when: true
      failed_when: copied_playbook_output.stdout != '{{ destination_base_path }}/mock_playbooks/role_a'

    - name: Clean up mock files and directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["{{ inventory_source }}", "./mock_playbooks", "{{ destination_base_path }}"]
