- name: Test quote_of_the_day playbook\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Execute the playbook\n      command: ansible-playbook -i src/inventory.ini src/quote_of_the_day.yml\n      register: playbook_result\n      changed_when: false\n\n    - name: Verify the target file exists\n      stat:\n        path: /tmp/motd_test\n      register: file_stat\n      failed_when: not file_stat.stat.exists\n\n    - name: Read the content of the target file\n      slurp:\n        src: /tmp/motd_test\n      register: file_content\n\n    - name: Assert the content matches the expected first quote\n      assert:\n        that:\n          - (file_content.content | b64decode).strip() == "Stay hungry, stay foolish."\n\n    - name: Clean up the generated file\n      file:\n        path: /tmp/motd_test\n        state: absent\n
