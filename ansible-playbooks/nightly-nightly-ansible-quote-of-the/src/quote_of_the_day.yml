- hosts: all\n  gather_facts: false\n  vars:\n    quote_file: quotes.txt\n    target_path: /tmp/motd_test\n  tasks:\n    - name: Read quotes file\n      slurp:\n        src: "{{ quote_file }}"\n      register: quotes_content\n\n    - name: Decode quotes\n      set_fact:\n        quotes_list: "{{ quotes_content.content | b64decode | splitlines }}"\n\n    - name: Select first quote (deterministic for testing)\n      set_fact:\n        selected_quote: "{{ quotes_list[0] }}"\n\n    - name: Write quote to target file\n      copy:\n        dest: "{{ target_path }}"\n        content: "{{ selected_quote }}\n"\n        mode: '0644'\n
