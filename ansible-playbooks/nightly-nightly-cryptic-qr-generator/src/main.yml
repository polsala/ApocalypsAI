---\n- name: Generate a cryptic QR placeholder\n  hosts: all\n  gather_facts: false\n  vars:\n    # If a phrase is supplied via extra vars, use it; otherwise generate a random base64 string\n    phrase: "{{ phrase | default(lookup('pipe', 'openssl rand -base64 12')) }}"\n  tasks:\n    - name: Ensure output directory exists\n      file:\n        path: /tmp\n        state: directory\n        mode: "0755"\n\n    - name: Create QR placeholder file with the phrase\n      copy:\n        content: "{{ phrase }}"\n        dest: /tmp/qr.png\n        mode: "0644"\n
