---\n- name: Test nightly-cryptic-qr-generator\n  hosts: all\n  gather_facts: false\n  vars:\n    phrase: "TESTPHRASE"\n  tasks:\n    - name: Include the main playbook\n      import_playbook: ../src/main.yml\n\n    - name: Verify the QR file was created\n      stat:\n        path: /tmp/qr.png\n      register: qr_stat\n\n    - name: Assert file exists\n      assert:\n        that:\n          - qr_stat.stat.exists\n          - qr_stat.stat.size > 0\n        fail_msg: "QR placeholder file was not created or is empty"\n
