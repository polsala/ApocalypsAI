- name: Network Chaos - Add latency
  ansible.builtin.shell: |
    tc qdisc add dev eth0 root netem delay 100ms 50ms
  when: chaos_scenarios.network.latency | default(true)
  ignore_errors: true

- name: Network Chaos - Packet loss
  ansible.builtin.shell: |
    tc qdisc add dev eth0 root netem loss 10%
  when: chaos_scenarios.network.packet_loss | default(false)
  ignore_errors: true

- name: Network Chaos - Bandwidth limit
  ansible.builtin.shell: |
    tc qdisc add dev eth0 root tbf rate 1mbit burst 32kbit latency 400ms
  when: chaos_scenarios.network.bandwidth_limit | default(false)
  ignore_errors: true

- name: Record network chaos execution
  ansible.builtin.set_fact:
    chaos_executed: "{{ (chaos_executed | default([])) + ['network'] }}"
