- hosts: all\n  gather_facts: false\n  vars:\n    quotes:\n      - "The only limit to our realization of tomorrow is our doubts of today."\n      - "Life is what happens when you're busy making other plans."\n  tasks:\n    - import_playbook: ../src/quote_dispatch.yml\n    - name: Verify quote file exists\n      stat:\n        path: /tmp/quote_of_the_day.txt\n      register: quote_file\n    - name: Assert file exists\n      assert:\n        that:\n          - quote_file.stat.exists\n    - name: Read file content\n      slurp:\n        src: /tmp/quote_of_the_day.txt\n      register: quote_content\n    - name: Decode content\n      set_fact:\n        quote_text: "{{ quote_content.content | b64decode | trim }}"\n    - name: Assert content matches expected quote\n      assert:\n        that:\n          - quote_text == quotes[0]\n
