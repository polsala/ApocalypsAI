---\n- name: Backup a directory on target hosts\n  hosts: all\n  become: true\n  vars:\n    backup_src: "/var/www"\n    backup_dest: "/tmp/backups"\n    timestamp: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"\n    archive_name: "{{ backup_src | basename }}-{{ timestamp }}.tar.gz"\n    archive_path: "{{ backup_dest }}/{{ archive_name }}"\n  tasks:\n    - name: Ensure backup destination exists\n      file:\n        path: "{{ backup_dest }}"\n        state: directory\n        mode: '0755'\n\n    - name: Create archive of source directory\n      archive:\n        path: "{{ backup_src }}"\n        dest: "{{ archive_path }}"\n        format: gz\n        force_archive: true\n\n    - name: Fetch backup archive to control machine (optional)\n      fetch:\n        src: "{{ archive_path }}"\n        dest: "./backups/{{ inventory_hostname }}/"\n        flat: true\n      when: fetch_backup | default(false)\n
