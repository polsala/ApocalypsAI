---\n- name: Test backup playbook\n  hosts: localhost\n  become: false\n  vars:\n    test_dir: "/tmp/ansible_test_dir"\n    test_file: "sample.txt"\n    backup_src: "{{ test_dir }}"\n    backup_dest: "/tmp/ansible_test_backups"\n    fetch_backup: false\n  tasks:\n    - name: Ensure clean test source directory\n      file:\n        path: "{{ test_dir }}"\n        state: absent\n\n    - name: Create test source directory\n      file:\n        path: "{{ test_dir }}"\n        state: directory\n        mode: '0755'\n\n    - name: Create sample file in source directory\n      copy:\n        dest: "{{ test_dir }}/{{ test_file }}"\n        content: "Hello, Ansible!"\n\n    - name: Ensure clean backup destination\n      file:\n        path: "{{ backup_dest }}"\n        state: absent\n\n    - name: Recreate backup destination directory\n      file:\n        path: "{{ backup_dest }}"\n        state: directory\n        mode: '0755'\n\n    - name: Include the backup playbook\n      include_tasks: "../src/backup.yml"\n\n    - name: Find backup archives in destination\n      find:\n        paths: "{{ backup_dest }}"\n        patterns: "*.tar.gz"\n        file_type: file\n      register: found_archives\n\n    - name: Assert at least one archive was created\n      assert:\n        that:\n          - found_archives.matched > 0\n        fail_msg: "No backup archive was found in {{ backup_dest }}"\n
