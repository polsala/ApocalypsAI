---
wisdom_messages:
  - "The sun may set on civilization, but it rises on new opportunities. Keep building."
  - "Keep your wits sharp and your water clean. Survival is a mindset, not a destination."
  - "Even in the ruins, beauty can be found. Look closer, and find your purpose."
  - "A well-maintained tool is a loyal companion. Cherish your gear, and it will serve you well."
  - "Remember the past, but build for the future. The wasteland awaits your touch, make it bloom."
  - "In the silence of the aftermath, listen for new beginnings. They are always there."
  - "Your resilience is your greatest resource. Tap into it daily."
  - "Every sunrise is a fresh start. Embrace the dust, and forge ahead.""
  - "The strongest shelters are built with hope and ingenuity. Never lose either."
  - "Share your light, even in the darkest corners. Community is survival."
