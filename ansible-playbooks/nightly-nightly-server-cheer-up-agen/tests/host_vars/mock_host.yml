# Mock rationale: These variables simulate the state of a target host *after* the main playbook has successfully run.
# This allows for deterministic and offline testing of the playbook's logic without requiring actual system modifications or remote connections.
mock_cowsay_installed: true
mock_fortune_installed: true
mock_motd_script_exists: true
mock_motd_script_content: |-
  #!/bin/bash
  # This script is generated by the Nightly Server Cheer-Up Agent.
  # It displays a random fortune message using cowsay upon login.

  # Check if cowsay and fortune are installed before attempting to run
  if command -v fortune &> /dev/null && command -v cowsay &> /dev/null; then
    fortune | cowsay
  fi


  # Display custom ASCII art
  if [ -f "/usr/local/share/nightly_ascii_art.txt" ]; then
    cat "/usr/local/share/nightly_ascii_art.txt"
  fi
mock_ascii_art_file_exists: true
