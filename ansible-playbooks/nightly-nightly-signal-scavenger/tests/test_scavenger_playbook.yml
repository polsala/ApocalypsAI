---
- name: Test Nightly Signal Scavenger Playbook
  hosts: localhost
  gather_facts: yes

  vars:
    test_report_dir: "{{ playbook_dir }}/test_reports"
    test_report_file: "{{ test_report_dir }}/signal_scavenger_report.txt"
    test_data_dir: "/tmp/signal_scavenger_test"
    data_present_path: "{{ test_data_dir }}/data_present.txt"
    data_missing_path: "{{ test_data_dir }}/data_missing.txt"

  pre_tasks:
    - name: Clean up previous test environment
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ test_report_dir }}"
        - "{{ test_data_dir }}"
      # Mock rationale: Ensures a clean slate for deterministic testing.

    - name: Create test directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ test_report_dir }}"
        - "{{ test_data_dir }}"
      # Mock rationale: Provides necessary directories for the playbook to operate and for data fragments.

    - name: Create dummy data fragment for 'present' test case
      ansible.builtin.copy:
        content: "Vital signal data fragment"
        dest: "{{ data_present_path }}"
        mode: '0644'
      # Mock rationale: Simulates an existing data fragment for a successful 'data_fragment_verify' check.

    - name: Ensure data fragment for 'missing' test case does NOT exist
      ansible.builtin.file:
        path: "{{ data_missing_path }}"
        state: absent
      # Mock rationale: Ensures the file is absent to simulate a missing data fragment for a failed 'data_fragment_verify' check.

  tasks:
    - name: Run the main scavenger playbook against test inventory
      ansible.builtin.include_playbook:
        file: ../scavenger_playbook.yml
      vars:
        report_dir: "{{ test_report_dir }}" # Override report_dir for testing
      # Mock rationale: Executes the target playbook in a controlled test environment.

  post_tasks:
    - name: Verify report file exists
      ansible.builtin.stat:
        path: "{{ test_report_file }}"
      register: report_stat
      ansible.builtin.assert:
        that:
          - report_stat.stat.exists is true
          - report_stat.stat.isreg is true
        fail_msg: "Test report file '{{ test_report_file }}' was not created or is not a regular file."
      # Mock rationale: Checks if the playbook successfully generated the report file.

    - name: Read report content
      ansible.builtin.slurp:
        src: "{{ test_report_file }}"
      register: report_content_b64
      # Mock rationale: Reads the generated report to assert its content.

    - name: Decode report content
      set_fact:
        report_content: "{{ report_content_b64['content'] | b64decode }}"
      # Mock rationale: Decodes the base64 content for easier assertion.

    - name: Assert content for 'UP' and 'PRESENT' beacon
      ansible.builtin.assert:
        that:
          - "'Beacon ID: TEST_UP_PRESENT' in report_content"
          - "'Signal Status: UP' in report_content"
          - "'Data Fragment: PRESENT' in report_content"
        fail_msg: "Report content for TEST_UP_PRESENT is incorrect."
      # Mock rationale: Verifies that the report correctly reflects the status of the beacon with a present data fragment.

    - name: Assert content for 'UP' and 'MISSING' beacon
      ansible.builtin.assert:
        that:
          - "'Beacon ID: TEST_UP_MISSING' in report_content"
          - "'Signal Status: UP' in report_content"
          - "'Data Fragment: MISSING' in report_content"
        fail_msg: "Report content for TEST_UP_MISSING is incorrect."
      # Mock rationale: Verifies that the report correctly reflects the status of the beacon with a missing data fragment.

    - name: Clean up test environment
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ test_report_dir }}"
        - "{{ test_data_dir }}"
      # Mock rationale: Removes all temporary files and directories created during testing to ensure idempotence and prevent side effects.

