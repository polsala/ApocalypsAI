---
- name: Test Digital Dust Bunny Sweeper
  hosts: localhost # Run tests on localhost
  gather_facts: no
  vars:
    # Override playbook defaults for testing
    scan_paths: ["/mock/scan/path"] # These are not actually used by the mocked run
    age_threshold_days: 7 # This is not actually used by the mocked run
    cleanup_mode: false # Always test in reporting mode first

    # Mock the list of paths that 'find' *would have returned* if run with age_threshold_days: 7
    _mock_found_paths:
      - "/mock/scan/path/old_log.txt"
      - "/mock/scan/path/temp_dir"
      # Mock rationale: Simulates the final output of the 'find' module after it has
      # already filtered by age, allowing deterministic testing of the playbook's
      # subsequent reporting and cleanup logic without actual filesystem interaction.

  tasks:
    - name: Include the main playbook for testing
      ansible.builtin.include_tasks:
        file: ../dust_bunny_sweeper.yml
      vars:
        # Pass mock variables to the included playbook
        _mock_found_paths: "{{ _mock_found_paths }}"
        cleanup_mode: "{{ cleanup_mode }}" # Ensure cleanup is off for initial assertion

    - name: Assert that the correct dust bunnies were identified
      ansible.builtin.assert:
        that:
          - dust_bunnies_to_clean is defined
          - dust_bunnies_to_clean | length == 2
          - "/mock/scan/path/old_log.txt" in dust_bunnies_to_clean
          - "/mock/scan/path/temp_dir" in dust_bunnies_to_clean
        msg: "Test failed: Incorrect digital dust bunnies identified."
      # Mock rationale: Verifies that the playbook correctly processes the mocked list
      # of 'found' files and sets the 'dust_bunnies_to_clean' variable as expected.

    - name: Test cleanup mode (simulate via debug)
      ansible.builtin.debug:
        msg: "Simulating cleanup for: {{ dust_bunnies_to_clean }}"
      vars:
        cleanup_mode: true # Simulate cleanup mode for this debug message
      # Mock rationale: This task demonstrates what would happen if cleanup_mode was true.
      # Since actual file deletion is not performed in offline tests,
      # asserting on the 'dust_bunnies_to_clean' list in the previous step is sufficient
      # for verifying the logic that determines *what* should be cleaned.
      # This debug step confirms the playbook *would* proceed with these items.
