---
- name: Deploy Serenity Scrolls
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Ensure serenity scroll directory exists
      ansible.builtin.file:
        path: "{{ serenity_scroll_dir }}"
        state: directory
        mode: '0755'

    - name: Select a random serenity scroll template
      ansible.builtin.set_fact:
        selected_scroll: "{{ scroll_templates | random }}"
      run_once: true # Select once for all hosts in this run

    - name: Deploy the selected serenity scroll
      ansible.builtin.template:
        src: "templates/{{ selected_scroll }}"
        dest: "{{ serenity_scroll_dir }}/serenity_scroll.txt"
        mode: '0644'
      notify: Report deployed scroll

  handlers:
    - name: Report deployed scroll
      ansible.builtin.debug:
        msg: "Serenity scroll '{{ selected_scroll }}' deployed to {{ serenity_scroll_dir }}/serenity_scroll.txt"
