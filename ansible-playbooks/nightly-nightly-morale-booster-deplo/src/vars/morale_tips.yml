morale_tips:
  - "Remember, even in the darkest void, your Wi-Fi signal is strong... probably."
  - "A day without laughter is a day wasted. Find a sentient toaster and tell it a joke."
  - "Hydrate! Your future self will thank you, especially when fleeing mutant squirrels."
  - "Keep calm and carry a spork. You never know when you'll need to eat mystery goo."
  - "The best defense is a good offense, unless it's a really good defense. Then use that."
  - "Don't forget to stretch! Limber survivors are harder to catch."
  - "Always know where your towel is. It's the ultimate multi-tool."
