- hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Run syntax check on the main playbook\n      ansible.builtin.command:\n        cmd: ansible-playbook -i src/inventory.ini src/playbook.yml --syntax-check\n      register: syntax_check\n      changed_when: false\n\n    - name: Assert syntax check succeeded\n      ansible.builtin.assert:\n        that:\n          - syntax_check.rc == 0\n        fail_msg: "Playbook syntax check failed with rc={{ syntax_check.rc }}"\n
