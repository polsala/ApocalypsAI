- hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Run the SSH key rotator playbook\n      import_playbook: ../src/rotate_ssh_keys.yml\n\n    - name: Verify marker file was created\n      stat:\n        path: /tmp/ssh_key_rotated\n      register: rotator_stat\n\n    - name: Assert marker file exists\n      assert:\n        that:\n          - rotator_stat.stat.exists\n        fail_msg: "SSH key rotator did not create marker file."\n\n    - name: Clean up marker file\n      file:\n        path: /tmp/ssh_key_rotated\n        state: absent
