- name: Test SSH key rotation playbook in check mode
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Execute rotate_ssh_keys.yml in check mode
      ansible.builtin.command: ansible-playbook -i {{ playbook_dir }}/../src/inventory.ini {{ playbook_dir }}/../src/rotate_ssh_keys.yml --check
      register: result
      changed_when: false

    - name: Assert the playbook exited cleanly
      ansible.builtin.assert:
        that:
          - result.rc == 0
        fail_msg: "rotate_ssh_keys.yml failed in check mode"
