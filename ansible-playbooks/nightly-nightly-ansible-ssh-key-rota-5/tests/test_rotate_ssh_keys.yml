---\n- name: Test SSH key rotation playbook\n  hosts: localhost\n  connection: local\n  gather_facts: false\n  vars:\n    test_key_dir: "{{ lookup('env','TMPDIR') | default('/tmp') }}/ssh_key_rotator_test_{{ 999999 | random }}"\n  tasks:\n    - name: Clean any previous test directory\n      file:\n        path: "{{ test_key_dir }}"\n        state: absent\n\n    - name: Create fresh test directory\n      file:\n        path: "{{ test_key_dir }}"\n        state: directory\n        mode: "0755"\n\n    - name: Run the SSH key rotation playbook (skip service restart)\n      import_playbook: "../src/rotate_ssh_keys.yml"\n      vars:\n        key_dir: "{{ test_key_dir }}"\n        ssh_service_name: ""\n\n    - name: Verify RSA key was created\n      stat:\n        path: "{{ test_key_dir }}/ssh_host_rsa_key"\n      register: rsa_key\n\n    - name: Assert RSA key exists\n      assert:\n        that:\n          - rsa_key.stat.exists\n\n    - name: Verify Ed25519 key was created\n      stat:\n        path: "{{ test_key_dir }}/ssh_host_ed25519_key"\n      register: ed_key\n\n    - name: Assert Ed25519 key exists\n      assert:\n        that:\n          - ed_key.stat.exists\n
