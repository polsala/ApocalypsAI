---\n- name: Test SSH key rotator playbook\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Run rotate playbook in check mode\n      command: ansible-playbook -i {{ playbook_dir }}/../inventory.ini {{ playbook_dir }}/../src/rotate_ssh_keys.yml --check\n      register: result\n      changed_when: false\n\n    - name: Assert playbook succeeded\n      assert:\n        that:\n          - result.rc == 0\n
