---\n- name: Test SSH key rotator playbook (dry run)\n  hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Run the rotation playbook in check mode\n      ansible.builtin.command:\n        cmd: ansible-playbook -i {{ playbook_dir }}/../src/inventory.ini {{ playbook_dir }}/../src/rotate_ssh_keys.yml --check\n      register: result\n      changed_when: false\n\n    - name: Assert playbook exited successfully\n      ansible.builtin.assert:\n        that:\n          - result.rc == 0\n        fail_msg: "Playbook failed in check mode"\n        success_msg: "Playbook dry-run succeeded"\n\n# Mock rationale: The test runs the playbook against a dummy inventory in check mode, ensuring no real hosts are touched. It asserts a zero return code, which indicates the playbook syntax and logic are sound.
