---\n- name: Test SSH key rotator\n  hosts: localhost\n  become: false\n  vars:\n    key_dir: "/tmp/ssh_keys_test"\n  pre_tasks:\n    - name: Clean previous test keys\n      ansible.builtin.file:\n        path: "{{ key_dir }}"\n        state: absent\n\n  tasks:\n    - name: Run rotator playbook\n      import_playbook: "../src/rotate_ssh_keys.yml"\n\n    - name: Verify key file exists\n      ansible.builtin.stat:\n        path: "{{ key_dir }}/localhost/ssh_host_rsa_key"\n      register: key_stat\n\n    - name: Assert key was created\n      ansible.builtin.assert:\n        that:\n          - key_stat.stat.exists\n        fail_msg: "SSH key was not created"\n
