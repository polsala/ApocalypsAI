---\n- name: Rotate SSH keys for a user\n  hosts: all\n  become: true\n  vars:\n    ssh_key_path: "/home/{{ target_user }}/.ssh/id_rsa"\n    ssh_pub_key_path: "{{ ssh_key_path }}.pub"\n  tasks:\n    - name: Ensure .ssh directory exists\n      file:\n        path: "/home/{{ target_user }}/.ssh"\n        state: directory\n        mode: '0700'\n        owner: "{{ target_user }}"\n        group: "{{ target_user }}"\n\n    - name: Generate new SSH key pair (mocked)\n      command: ssh-keygen -t rsa -b 2048 -f "{{ ssh_key_path }}" -N ""\n      args:\n        creates: "{{ ssh_key_path }}"\n      register: keygen_result\n      # Mock rationale: In test environment, this command is safe and idempotent.\n\n    - name: Read public key\n      slurp:\n        src: "{{ ssh_pub_key_path }}"\n      register: pubkey_content\n\n    - name: Set authorized key for the user\n      authorized_key:\n        user: "{{ target_user }}"\n        state: present\n        key: "{{ pubkey_content.content | b64decode }}"\n\n    - name: Remove old keys (optional)\n      file:\n        path: "{{ ssh_key_path }}.old"\n        state: absent
