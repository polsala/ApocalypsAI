---
- name: Rotate SSH keys for target user
  hosts: all
  become: true
  vars:
    ssh_key_path: "/home/{{ target_user }}/.ssh/id_rsa"
    ssh_pub_path: "{{ ssh_key_path }}.pub"
  tasks:
    - name: Generate new RSA key pair (if not present)
      openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: rsa
        size: 4096
        force: false
      register: keypair_result

    - name: Ensure new public key is in authorized_keys
      authorized_key:
        user: "{{ target_user }}"
        state: present
        key: "{{ lookup('file', ssh_pub_path) }}"

    - name: Remove old key line from authorized_keys by fingerprint
      lineinfile:
        path: "/home/{{ target_user }}/.ssh/authorized_keys"
        state: absent
        regexp: "{{ old_key_fingerprint }}"
      when: old_key_fingerprint is defined
      # Mock rationale: In tests we replace this task with a dummy debug to avoid touching real files.
