---\n- name: Rotate SSH host keys\n  hosts: all\n  become: true\n  gather_facts: false\n  vars:\n    # Default values – can be overridden via -e on the command line\n    key_dir: "/etc/ssh"\n    ssh_service_name: "sshd"\n  tasks:\n    - name: Ensure key directory exists\n      file:\n        path: "{{ key_dir }}"\n        state: directory\n        mode: "0755"\n\n    - name: Generate RSA host key (4096 bits)\n      command: >\n        ssh-keygen -t rsa -b 4096 -f "{{ key_dir }}/ssh_host_rsa_key" -N ""\n      args:\n        creates: "{{ key_dir }}/ssh_host_rsa_key"\n\n    - name: Generate Ed25519 host key\n      command: >\n        ssh-keygen -t ed25519 -f "{{ key_dir }}/ssh_host_ed25519_key" -N ""\n      args:\n        creates: "{{ key_dir }}/ssh_host_ed25519_key"\n\n    - name: Restart SSH service (if a service name is provided)\n      service:\n        name: "{{ ssh_service_name }}"\n        state: restarted\n      when: ssh_service_name != ""\n
