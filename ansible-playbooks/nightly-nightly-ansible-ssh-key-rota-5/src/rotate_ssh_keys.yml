---\n- name: Rotate SSH host keys on all targets\n  hosts: all\n  become: true\n  vars:\n    ssh_key_path: /etc/ssh\n  tasks:\n    - name: Ensure SSH host keys exist\n      command: ssh-keygen -A\n      args:\n        creates: "{{ ssh_key_path }}/ssh_host_rsa_key"\n      changed_when: true\n\n    - name: Fetch new RSA public host key\n      slurp:\n        src: "{{ ssh_key_path }}/ssh_host_rsa_key.pub"\n      register: host_rsa_key\n\n    - name: Update control node known_hosts with new RSA key\n      local_action:\n        module: known_hosts\n        name: "{{ inventory_hostname }}"\n        key: "{{ host_rsa_key.content | b64decode }}"\n      become: false\n\n    - name: Fetch new ECDSA public host key\n      slurp:\n        src: "{{ ssh_key_path }}/ssh_host_ecdsa_key.pub"\n      register: host_ecdsa_key\n\n    - name: Update control node known_hosts with new ECDSA key\n      local_action:\n        module: known_hosts\n        name: "{{ inventory_hostname }}"\n        key: "{{ host_ecdsa_key.content | b64decode }}"\n      become: false\n\n    - name: Fetch new ED25519 public host key\n      slurp:\n        src: "{{ ssh_key_path }}/ssh_host_ed25519_key.pub"\n      register: host_ed25519_key\n\n    - name: Update control node known_hosts with new ED25519 key\n      local_action:\n        module: known_hosts\n        name: "{{ inventory_hostname }}"\n        key: "{{ host_ed25519_key.content | b64decode }}"\n      become: false\n
