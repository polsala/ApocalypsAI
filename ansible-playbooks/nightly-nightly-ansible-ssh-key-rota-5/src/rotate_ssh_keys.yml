- name: Rotate SSH keys on target hosts
  hosts: all
  become: true
  vars:
    new_key_path: "{{ new_key_path | default('~/.ssh/id_rsa_new') }}"
    old_key_fingerprint: "{{ old_key_fingerprint | default('') }}"
  tasks:
    - name: Ensure ssh-keygen is available
      command: which ssh-keygen
      register: ssh_keygen_path
      changed_when: false

    - name: Generate new SSH key pair if not exists
      command: ssh-keygen -t rsa -b 4096 -f "{{ new_key_path }}" -N ""
      args:
        creates: "{{ new_key_path }}"
      when: not lookup('file', new_key_path)

    - name: Read public key
      slurp:
        src: "{{ new_key_path }}.pub"
      register: pub_key_content

    - name: Add new public key to authorized_keys
      authorized_key:
        user: "{{ ansible_user | default('root') }}"
        state: present
        key: "{{ pub_key_content.content | b64decode }}"

    - name: Remove old key line containing fingerprint
      lineinfile:
        path: "~/.ssh/authorized_keys"
        state: absent
        regexp: "{{ old_key_fingerprint }}"
      when: old_key_fingerprint != ''
