- hosts: all\n  become: true\n  vars:\n    backup_dir: /var/backups/ssh_keys\n    new_key_path: /tmp/new_ssh_key\n  tasks:\n    - name: Ensure backup directory exists\n      file:\n        path: "{{ backup_dir }}"\n        state: directory\n        mode: '0700'\n\n    - name: Backup existing authorized_keys\n      copy:\n        src: "/home/{{ ansible_user }}/.ssh/authorized_keys"\n        dest: "{{ backup_dir }}/authorized_keys_{{ ansible_date_time.iso8601_basic_short }}"\n        remote_src: yes\n      ignore_errors: yes\n\n    - name: Generate new SSH key pair\n      command: ssh-keygen -t rsa -b 2048 -f "{{ new_key_path }}" -N ""\n      args:\n        creates: "{{ new_key_path }}"\n\n    - name: Deploy new public key to authorized_keys\n      authorized_key:\n        user: "{{ ansible_user }}"\n        state: present\n        key: "{{ lookup('file', new_key_path + '.pub') }}"\n\n    - name: Clean up temporary key files\n      file:\n        path: "{{ item }}"\n        state: absent\n      loop:\n        - "{{ new_key_path }}"\n        - "{{ new_key_path }}.pub"\n\n    - name: Create marker file for test verification\n      file:\n        path: /tmp/ssh_key_rotated\n        state: touch
