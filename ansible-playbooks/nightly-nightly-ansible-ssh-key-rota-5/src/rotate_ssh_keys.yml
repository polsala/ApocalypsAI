---\n- name: Rotate SSH keys on remote hosts\n  hosts: all\n  become: true\n  vars:\n    new_key_path: "{{ playbook_dir }}/../generated_ssh_key"\n    # old_key_fingerprint can be supplied via extra vars if you want to purge a specific old key\n  tasks:\n    - name: Ensure ssh-keygen is available\n      ansible.builtin.command: which ssh-keygen\n      register: ssh_keygen_path\n      changed_when: false\n      failed_when: ssh_keygen_path.rc != 0\n\n    - name: Generate a new SSH key pair (if not already present)\n      ansible.builtin.command: >\n        ssh-keygen -t ed25519 -f {{ new_key_path }} -N '' -C 'rotated-key-{{ inventory_hostname }}'\n      args:\n        creates: "{{ new_key_path }}"\n      register: keygen_result\n\n    - name: Read the newly generated public key\n      ansible.builtin.slurp:\n        src: "{{ new_key_path }}.pub"\n      register: pubkey_content\n\n    - name: Decode public key content\n      ansible.builtin.set_fact:\n        new_pubkey: "{{ pubkey_content.content | b64decode }}"\n\n    - name: Backup existing authorized_keys\n      ansible.builtin.copy:\n        src: "~/.ssh/authorized_keys"\n        dest: "~/.ssh/authorized_keys.bak"\n        remote_src: true\n        mode: "0600"\n      ignore_errors: true\n\n    - name: Ensure new public key is present in authorized_keys\n      ansible.builtin.lineinfile:\n        path: "~/.ssh/authorized_keys"\n        line: "{{ new_pubkey }}"\n        state: present\n        create: true\n        mode: "0600"\n\n    - name: Remove old key if fingerprint provided\n      when: old_key_fingerprint is defined\n      block:\n        - name: Find matching old key line\n          ansible.builtin.shell: >\n            grep -F "{{ old_key_fingerprint }}" ~/.ssh/authorized_keys || true\n          register: old_key_line\n          changed_when: false\n\n        - name: Delete old key line\n          ansible.builtin.lineinfile:\n            path: "~/.ssh/authorized_keys"\n            regexp: "{{ old_key_line.stdout | regex_escape }}"\n            state: absent\n          when: old_key_line.stdout != ''\n\n    - name: Display summary\n      ansible.builtin.debug:\n        msg: "SSH key rotation completed on {{ inventory_hostname }}. New key stored at {{ new_key_path }}."
