---\n- name: Rotate SSH host keys\n  hosts: all\n  become: true\n  vars:\n    key_dir: "{{ key_dir | default('/tmp/ssh_keys') }}"\n    key_name: "ssh_host_rsa_key"\n    backup_dir: "{{ key_dir }}/backup"\n  tasks:\n    - name: Ensure key directory exists\n      ansible.builtin.file:\n        path: "{{ key_dir }}/{{ inventory_hostname }}"\n        state: directory\n        mode: '0700'\n\n    - name: Ensure backup directory exists\n      ansible.builtin.file:\n        path: "{{ backup_dir }}/{{ inventory_hostname }}"\n        state: directory\n        mode: '0700'\n\n    - name: Define key paths\n      ansible.builtin.set_fact:\n        key_path: "{{ key_dir }}/{{ inventory_hostname }}/{{ key_name }}"\n        backup_path: "{{ backup_dir }}/{{ inventory_hostname }}/{{ key_name }}_{{ lookup('pipe','date +%s') }}"\n\n    - name: Backup existing key if present\n      ansible.builtin.command:\n        cmd: cp "{{ key_path }}" "{{ backup_path }}"\n      args:\n        removes: "{{ key_path }}"\n      ignore_errors: true\n\n    - name: Generate new RSA key\n      ansible.builtin.command:\n        cmd: ssh-keygen -t rsa -b 2048 -f "{{ key_path }}" -N ""\n      creates: "{{ key_path }}"\n\n    - name: Set permissions on private key\n      ansible.builtin.file:\n        path: "{{ key_path }}"\n        mode: '0600'\n\n    - name: Set permissions on public key\n      ansible.builtin.file:\n        path: "{{ key_path }}.pub"\n        mode: '0644'\n
