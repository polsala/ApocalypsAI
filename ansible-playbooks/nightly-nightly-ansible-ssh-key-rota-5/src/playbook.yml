- hosts: all\n  become: true\n  vars:\n    new_key_path: /tmp/rotated_id_rsa\n    new_pub_key_path: "{{ new_key_path }}.pub"\n  tasks:\n    - name: Generate new SSH key pair if absent\n      ansible.builtin.command:\n        cmd: ssh-keygen -t rsa -b 2048 -f {{ new_key_path }} -N ""\n      args:\n        creates: "{{ new_key_path }}"\n      register: keygen_result\n      changed_when: keygen_result.rc == 0\n\n    - name: Read the generated public key\n      ansible.builtin.slurp:\n        src: "{{ new_pub_key_path }}"\n      register: pub_key_content\n\n    - name: Install new public key for the remote user\n      ansible.posix.authorized_key:\n        user: "{{ ansible_user | default('root') }}"\n        key: "{{ pub_key_content.content | b64decode }}"\n        state: present\n
