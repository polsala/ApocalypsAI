---
- name: Sweep Digital Dust Bunnies
  hosts: all
  gather_facts: false
  vars_files:
    - vars/main.yml

  tasks:
    - name: Ensure archive directory exists
      ansible.builtin.file:
        path: "{{ archive_dir }}"
        state: directory
        mode: '0755'

    - name: Find old files (dust bunnies)
      ansible.builtin.find:
        paths: "{{ item }}"
        age: "{{ age_days }}d"
        file_type: file
      loop: "{{ source_dirs }}"
      register: old_files_results
      ignore_errors: true # In case a source_dir doesn't exist or is empty

    - name: Consolidate found files
      ansible.builtin.set_fact:
        dust_bunnies: "{{ dust_bunnies | default([]) + item.files }}"
      loop: "{{ old_files_results.results }}"
      loop_control:
        label: "{{ item.path }}"
      when: item.files is defined and item.files | length > 0

    - name: Move dust bunnies to archive
      ansible.builtin.command: "mv {{ item.path }} {{ archive_dir }}/"
      loop: "{{ dust_bunnies }}"
      loop_control:
        label: "{{ item.path }}"
      when: dust_bunnies is defined and dust_bunnies | length > 0
      register: move_results
      changed_when: move_results.rc == 0 # Mark as changed if mv succeeds

    - name: Generate sweep report
      ansible.builtin.template:
        src: templates/sweep_report.j2
        dest: "{{ archive_dir }}/sweep_report_{{ ansible_date_time.iso8601_basic }}.txt"
      vars:
        swept_files: "{{ dust_bunnies }}"
        archive_location: "{{ archive_dir }}"
        run_date: "{{ ansible_date_time.iso8601_basic }}"
      when: dust_bunnies is defined and dust_bunnies | length > 0

    - name: Compress archive (optional)
      ansible.builtin.archive:
        path: "{{ archive_dir }}/*"
        dest: "{{ archive_dir }}/digital_attic_{{ ansible_date_time.iso8601_basic }}.tar.gz"
        format: gz
      when: compress_archive and dust_bunnies is defined and dust_bunnies | length > 0
