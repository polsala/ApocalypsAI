- name: Rotate SSH host keys
  hosts: all
  become: true
  vars_files:
    - vars.yml
  tasks:
    - name: Ensure key directory exists
      file:
        path: "{{ key_dir }}"
        state: directory
        mode: '0700'

    - name: Generate new RSA key pair
      openssh_keypair:
        path: "{{ key_dir }}/id_rsa"
        type: "{{ key_type }}"
        size: "{{ key_size }}"
        force: true
      register: keypair

    - name: Deploy new public key to authorized_keys
      authorized_key:
        user: "{{ ansible_user | default('root') }}"
        state: present
        key: "{{ lookup('file', keypair.public_key) }}"

    - name: Remove old private key if exists
      file:
        path: "{{ old_key_path | default('') }}"
        state: absent
      when: old_key_path != ''

