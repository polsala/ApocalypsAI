---\n- name: APT Mirror Sync\n  hosts: all\n  become: true\n  vars:\n    source_url: "{{ source_url | default('') }}"\n    target_dir: "{{ target_dir | default('') }}"\n  pre_tasks:\n    - name: Fail if source_url not provided\n      fail:\n        msg: "source_url variable is required"\n      when: source_url == ''\n    - name: Fail if target_dir not provided\n      fail:\n        msg: "target_dir variable is required"\n      when: target_dir == ''\n    - name: Ensure rsync is installed\n      apt:\n        name: rsync\n        state: present\n        update_cache: yes\n  tasks:\n    - name: Sync APT repository\n      command: >\n        rsync -a --delete {{ source_url }}/ {{ target_dir }}/\n      args:\n        creates: "{{ target_dir }}/dists"\n  post_tasks:\n    - name: Set proper permissions\n      file:\n        path: "{{ target_dir }}"\n        owner: root\n        group: root\n        mode: "0755"\n        recurse: yes\n
