[runners]
runner-01 ansible_host=192.168.1.10 ansible_user=ubuntu
runner-02 ansible_host=192.168.1.11 ansible_user=ubuntu
runner-03 ansible_host=192.168.1.12 ansible_user=ubuntu

[runners:vars]
# GitHub configuration
github_token=your_github_token_here
organization=your-org-name

# Cleanup configuration (optional, defaults apply)
cleanup_policy=moderate
dry_run=false
max_age_hours=24

# SSH configuration
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
