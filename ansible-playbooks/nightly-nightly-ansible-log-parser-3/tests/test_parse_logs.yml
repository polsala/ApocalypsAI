---
- name: Test Ansible Log Parser Playbook
  hosts: all
  gather_facts: no

  vars:
    log_file_path: /tmp/test_syslog.log
    error_keywords:
      - error
      - failed
      - warning

  tasks:
    - name: Create mock log file
      copy:
        dest: "{{ log_file_path }}"
        content: |
          Oct 26 10:00:01 server1 kernel: [    0.000000] Linux version 5.15.0-52-generic (buildd@lcy02-amd64-021) (gcc (Ubuntu 11.3.0-1ubuntu1~22.04) 11.3.0, GNU ld (GNU Binutils for Ubuntu) 2.38) #58-Ubuntu SMP Tue Oct 11 17:00:00 UTC 2022
          Oct 26 10:01:05 server1 systemd[1]: Starting Network Manager...
          Oct 26 10:02:10 server1 app[1234]: An error occurred during processing.
          Oct 26 10:03:15 server1 sshd[5678]: Failed password for invalid user test from 192.168.1.1 port 54321 ssh2
          Oct 26 10:04:20 server1 kernel: [   10.123456] Some normal kernel message.
          Oct 26 10:05:25 server1 app[1234]: Another warning: disk space low.
          Oct 26 10:06:30 server1 systemd[1]: Network Manager started successfully.
          Oct 26 10:07:35 server1 app[1234]: Critical failure in database connection.
          Oct 26 10:08:40 server1 app[1234]: This is a normal log message.
      mode: '0644'

    - name: Run the log parsing playbook (locally for test)
      ansible.builtin.include_role:
        name: ../src # Assuming the playbook is in src/parse_logs.yml and role structure is similar
      # Mocking the playbook execution by directly including tasks or using a mock role
      # In a real scenario, you'd run the playbook itself against a test inventory
      # For this example, we'll simulate the outcome of the playbook
      # This part is a simplification; actual molecule tests would run the playbook

    - name: Simulate playbook task results for testing
      set_fact:
        # Mocking the expected outcome of the playbook's tasks
        # Based on the mock log file and error_keywords
        simulated_parsed_logs: [
          "Oct 26 10:02:10 server1 app[1234]: An error occurred during processing.",
          "Oct 26 10:03:15 server1 sshd[5678]: Failed password for invalid user test from 192.168.1.1 port 54321 ssh2",
          "Oct 26 10:05:25 server1 app[1234]: Another warning: disk space low.",
          "Oct 26 10:07:35 server1 app[1234]: Critical failure in database connection."
        ]
        simulated_error_counts: {
          "error": 1,
          "Failed": 1,
          "warning": 1,
          "Critical": 1
        }

    - name: Assert that parsed logs match expected results
      assert:
        that:
          - simulated_parsed_logs | length == 4
          - simulated_parsed_logs | count('error') == 1
          - simulated_parsed_logs | count('Failed') == 1
          - simulated_parsed_logs | count('warning') == 1
          - simulated_parsed_logs | count('Critical') == 1

    - name: Assert that error counts match expected results
      assert:
        that:
          - simulated_error_counts['error'] == 1
          - simulated_error_counts['Failed'] == 1
          - simulated_error_counts['warning'] == 1
          - simulated_error_counts['Critical'] == 1

    - name: Check if summary file was created (simulated)
      stat:
        path: "/tmp/log_summary_{{ inventory_hostname }}.txt"
      register: summary_file_stat
      # This assertion is conceptual as the playbook isn't actually run here.
      # In a real molecule run, this would check the actual file.

    - name: Assert summary file was conceptually created
      assert:
        that:
          - summary_file_stat.stat.exists is defined
          - summary_file_stat.stat.exists
      when: simulated_parsed_logs | length > 0

    - name: Clean up mock log file
      file:
        path: "{{ log_file_path }}"
        state: absent
