---
- name: Test Nightly Ansible Log Parser
  hosts: all
  become: yes
  vars:
    # Mock variables for testing
    log_files_to_parse: ['/tmp/test_syslog.log', '/tmp/test_auth.log']
    keywords_to_find: ['TEST_ERROR', 'TEST_WARNING']

  tasks:
    # Mocking log files and content
    - name: Create mock log files
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        content: "{{ item.content }}"
      loop:
        - path: /tmp/test_syslog.log
          content: |-
            2023-10-27T10:00:00Z INFO: System started successfully.
            2023-10-27T10:05:15Z TEST_ERROR: A critical error occurred.
            2023-10-27T10:10:30Z DEBUG: Processing request.
        - path: /tmp/test_auth.log
          content: |-
            2023-10-27T09:55:00Z User 'admin' logged in.
            2023-10-27T10:12:00Z TEST_WARNING: Potential security issue detected.
            2023-10-27T10:15:00Z "failed login" attempt for user 'guest'.

    # Run the actual playbook tasks (or a subset for testing)
    - name: Ensure log analysis variables are defined (test)
      ansible.builtin.assert:
        that:
          - log_files_to_parse is defined
          - log_files_to_parse | length > 0
          - keywords_to_find is defined
          - keywords_to_find | length > 0
        fail_msg: "Log analysis variables (log_files_to_parse, keywords_to_find) must be defined."

    - name: Create temporary directory for log snippets (test)
      ansible.builtin.tempfile:
        state: directory
        suffix: log_snippets
      register: temp_log_dir

    - name: Iterate over mock log files and extract matching lines (test)
      ansible.builtin.lineinfile:
        path: "{{ item }}"
        regexp: "(?i)({{ keywords_to_find | join('|') }})"
      loop: "{{ log_files_to_parse }}"
      register: log_matches
      when: item is defined

    - name: Collect and format log snippets (test)
      ansible.builtin.set_fact:
        log_summary:
          "{{ log_summary | default([]) + [ {'host': inventory_hostname, 'file': item.item, 'lines': item.results | selectattr('rc', 'equal', 0) | map(attribute='line') | list} ] }}"
      loop: "{{ log_matches.results }}"
      when: item.results | length > 0 and (item.results | selectattr('rc', 'equal', 0) | list | length) > 0

    # Assertions to verify the output
    - name: Assert on log summary content for syslog
      ansible.builtin.assert:
        that:
          - "'/tmp/test_syslog.log' in (log_summary | map(attribute='file'))"
          - "(log_summary | selectattr('file', 'equal', '/tmp/test_syslog.log') | first).lines | length == 1"
          - "'2023-10-27T10:05:15Z TEST_ERROR: A critical error occurred.' in (log_summary | selectattr('file', 'equal', '/tmp/test_syslog.log') | first).lines"

    - name: Assert on log summary content for auth.log
      ansible.builtin.assert:
        that:
          - "'/tmp/test_auth.log' in (log_summary | map(attribute='file'))"
          - "(log_summary | selectattr('file', 'equal', '/tmp/test_auth.log') | first).lines | length == 2"
          - "'2023-10-27T10:12:00Z TEST_WARNING: Potential security issue detected.' in (log_summary | selectattr('file', 'equal', '/tmp/test_auth.log') | first).lines"
          - "'2023-10-27T10:15:00Z "failed login" attempt for user 'guest'.' in (log_summary | selectattr('file', 'equal', '/tmp/test_auth.log') | first).lines"

    - name: Clean up mock log files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: ["/tmp/test_syslog.log", "/tmp/test_auth.log"]

    - name: Clean up temporary directory (test)
      ansible.builtin.file:
        path: "{{ temp_log_dir.path }}"
        state: absent
      when: temp_log_dir.path is defined
