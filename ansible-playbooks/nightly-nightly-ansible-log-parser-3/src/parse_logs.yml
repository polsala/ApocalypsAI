---
- name: Parse System Logs and Summarize Errors
  hosts: log_servers
  become: yes
  vars:
    log_files: "/var/log/syslog"
    error_keywords: "error,failed,warning,denied,critical,exception"
    report_path: "/tmp/log_summary_{{ inventory_hostname }}.txt"

  tasks:
    - name: Ensure log directory exists (for testing purposes)
      file:
        path: "/var/log"
        state: directory
      when: ansible_env.USER == 'root' # Only run if elevated privileges are available for testing

    - name: Mock log file content for testing
      copy:
        content: |
          {{ lookup('file', 'tests/mock_syslog.log') }}
        dest: "{{ log_files }}"
      when: ansible_env.USER == 'root' # Only run if elevated privileges are available for testing

    - name: Read log file content
      slurp:
        src: "{{ log_files }}"
      register: log_content
      when: ansible_env.USER != 'root' # Real execution path

    - name: Process log content (mocked for testing)
      set_fact:
        processed_logs: "{{ lookup('file', 'tests/mock_syslog.log') }}"
      when: ansible_env.USER == 'root'

    - name: Extract and count error lines (real execution)
      set_fact:
        processed_logs: "{{ log_content.content | b64decode }}"
      when: ansible_env.USER != 'root'

    - name: Analyze log entries for keywords
      set_fact:
        log_analysis: "{{ processed_logs | regex_findall(item) | list }}"
      loop: "{{ error_keywords.split(',') }}"
      register: analysis_results

    - name: Aggregate keyword counts
      set_fact:
        keyword_counts: "{{ keyword_counts | default({}) | combine({item.item: item.log_analysis | length}) }}"
      loop: "{{ analysis_results.results }}"

    - name: Sort keywords by count (descending)
      set_fact:
        sorted_keyword_counts: "{{ keyword_counts | dictsort(attribute='value', reverse=true) }}"

    - name: Generate log summary report
      template:
        src: templates/log_summary.j2
        dest: "{{ report_path }}"

    - name: Display log summary report
      debug:
        msg: "Log summary generated at {{ report_path }} on {{ inventory_hostname }}:\n{{ lookup('file', report_path) }}"
