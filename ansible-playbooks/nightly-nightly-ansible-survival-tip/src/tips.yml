tips:
  - "Never trust a cactus with a secret."
  - "Always keep a spare can of beans in your backpack."
  - "If you hear a rustle, it might just be the wind… or a mutant rabbit."
  - "A well‑placed joke can defuse a radiation storm."
  - "Remember: water is liquid, but coffee is a solid morale booster."
  - "Carry a flashlight; darkness is just the universe's way of saying 'good night'."
  - "When in doubt, sing loudly – it confuses both zombies and Wi‑Fi."
  - "A map is useful, but a compass that points to the nearest pizza place is priceless."
