# Test inventory for Chaos Garden Orchestrator tests

[localhost]
localhost ansible_connection=local

[all:vars]
# Test configuration
chaos_enabled=true
max_chaos_duration=60

# Disable actual chaos for testing
chaos_scenarios:
  - name: "Test Scenario"
    type: "test"
    effect: "none"
    duration: 0
    tags: ["test"]
    description: "No actual chaos for testing"
