- name: 🌐 Inject network chaos
  ansible.builtin.debug:
    msg: "Injecting network chaos for {{ chaos_duration }} seconds"

- name: 🚫 Block network traffic
  ansible.builtin.shell: |
    iptables -A INPUT -j DROP
    sleep {{ chaos_duration }}
    iptables -D INPUT -j DROP
  args:
    executable: /bin/bash
  when: chaos_target == 'network' or chaos_target == 'all'

- name: 🐌 Introduce network latency
  ansible.builtin.shell: |
    tc qdisc add dev eth0 root netem delay 1000ms
    sleep {{ chaos_duration }}
    tc qdisc del dev eth0 root
  args:
    executable: /bin/bash
  when: chaos_target == 'network' or chaos_target == 'all'

- name: 📉 Simulate packet loss
  ansible.builtin.shell: |
    tc qdisc add dev eth0 root netem loss 50%
    sleep {{ chaos_duration }}
    tc qdisc del dev eth0 root
  args:
    executable: /bin/bash
  when: chaos_target == 'network' or chaos_target == 'all'
