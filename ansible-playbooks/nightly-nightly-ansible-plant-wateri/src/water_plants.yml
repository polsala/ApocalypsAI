- hosts: localhost\n  gather_facts: false\n  vars:\n    water_file: "{{ playbook_dir }}/.plant_watered_date"\n    water_interval_days: 3\n  tasks:\n    - name: Ensure water tracking file exists\n      file:\n        path: "{{ water_file }}"\n        state: touch\n\n    - name: Read last watered date\n      slurp:\n        src: "{{ water_file }}"\n      register: water_file_content\n\n    - name: Set last_watered fact\n      set_fact:\n        last_watered: "{{ (water_file_content.content | b64decode).strip() | default('1970-01-01') }}"\n\n    - name: Compute days since last watering\n      set_fact:\n        days_since: "{{ ((lookup('pipe', 'date +%s') | int) - (lookup('pipe', 'date -d ' + last_watered + ' +%s') | int)) // 86400 }}"\n\n    - name: Decide if watering is needed\n      debug:\n        msg: "💧 Plants need watering! ({{ days_since }} days since last water)"\n      when: days_since | int >= water_interval_days\n\n    - name: Simulate watering plants\n      command: echo "💧 Watering plants..."\n      when: days_since | int >= water_interval_days\n\n    - name: Update water file with today\n      copy:\n        dest: "{{ water_file }}"\n        content: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"\n      when: days_since | int >= water_interval_days\n\n    - name: No watering needed message\n      debug:\n        msg: "✅ Plants are happy, no watering needed. ({{ days_since }} days since last water)"\n      when: days_since | int < water_interval_days\n
