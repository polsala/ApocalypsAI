---
- name: Append a whimsical bedtime story to the log
  ansible.builtin.lineinfile:
    path: "{{ bedtime_log_file }}"
    line: "{{ ansible_date_time.iso8601 }} - Zzz... Server {{ inventory_hostname }} is dreaming sweet dreams of {{ ['uptime', 'low latency', 'fast CPUs', 'happy users'] | random }}."
    create: yes
    mode: '0644'
    owner: root
    group: root
