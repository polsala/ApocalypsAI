- import_playbook: ../playbook.yml\n  vars:\n    selected_quote: "Stay hungry, stay foolish."\n\n- hosts: localhost\n  gather_facts: false\n  tasks:\n    - name: Read the generated file\n      slurp:\n        src: /tmp/motivation.txt\n      register: file_content\n\n    - name: Assert the file contains the forced quote\n      assert:\n        that:\n          - file_content.content | b64decode == "Stay hungry, stay foolish."
