- import_playbook: ../playbook.yml
  vars:
    selected_quote: "Stay hungry, stay foolish."

- hosts: localhost
  gather_facts: false
  tasks:
    - name: Read the generated file
      slurp:
        src: /tmp/motivation.txt
      register: file_content

    - name: Assert the file contains the forced quote
      assert:
        that:
          - file_content.content | b64decode == "Stay hungry, stay foolish."
