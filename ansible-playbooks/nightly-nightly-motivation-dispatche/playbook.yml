- hosts: localhost\n  gather_facts: false\n  vars_files:\n    - vars/quotes.yml\n  tasks:\n    - name: Select a random quote\n      set_fact:\n        selected_quote: "{{ quotes | random }}"\n\n    - name: Write quote to file\n      copy:\n        dest: /tmp/motivation.txt\n        content: "{{ selected_quote }}"
