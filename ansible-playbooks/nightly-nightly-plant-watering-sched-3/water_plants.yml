---\n- name: Schedule plant watering\n  hosts: plant_controller\n  become: false\n  vars:\n    plug_name: "plant_watering_plug"\n    water_duration_minutes: 5\n    water_time: "{{ water_time | default('07:00') }}"\n  tasks:\n    - name: Ensure cron job for watering exists\n      cron:\n        name: "Water plants"\n        minute: "{{ water_time.split(':')[1] }}"\n        hour: "{{ water_time.split(':')[0] }}"\n        job: "ansible-playbook -i {{ inventory_hostname }}, -e plug_name={{ plug_name }} -e duration={{ water_duration_minutes }} {{ playbook_dir }}/toggle_plug.yml"\n        state: present\n\n    - name: Include toggle plug playbook for immediate run (optional)\n      import_playbook: toggle_plug.yml\n
