---\n- name: Toggle smart plug for watering\n  hosts: plant_controller\n  become: false\n  vars:\n    plug_name: "{{ plug_name }}"\n    duration: "{{ duration | default(5) }}"\n  tasks:\n    - name: Turn on the plug\n      debug:\n        msg: "Turning on {{ plug_name }}"\n\n    - name: Wait for duration minutes\n      pause:\n        minutes: "{{ duration }}"\n\n    - name: Turn off the plug\n      debug:\n        msg: "Turning off {{ plug_name }}"\n
