# Nightly Ephemeral Runner Ghost Buster Inventory
# Configure your cloud provider credentials and settings here

[aws]
# AWS Region where your ephemeral runners are deployed
aws_region=us-east-1

[azure]
# Azure subscription and resource group for your ephemeral runners
az_subscription_id=your-subscription-id-here
az_resource_group=your-resource-group-here

[gcp]
# GCP project and zone for your ephemeral runners
gcp_project_id=your-project-id-here
gcp_zone=us-central1-a

# Example configuration (replace with your actual values):
# [aws]
# aws_region=us-west-2
# 
# [azure]
# az_subscription_id=12345678-1234-1234-1234-123456789012
# az_resource_group=my-runner-rg
# 
# [gcp]
# gcp_project_id=my-gcp-project
# gcp_zone=us-east1-b
