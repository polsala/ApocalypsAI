morale_messages:
  - "Stay vigilant, wanderer! The dawn always follows the darkest night."
  - "Remember to hydrate! Even the dust has a thirst."
  - "A scavenged bolt today keeps the rust away tomorrow."
  - "Your spirit is your strongest shield. Keep it polished!"
  - "Even in the ruins, beauty can be found. Look for the glowing moss."
  - "Share your water, share your hope. We're all in this together."
  - "The best defense is a good offense... against despair."
  - "Don't forget to check your Geiger counter. Safety first!"
  - "A well-maintained tool is a loyal companion."
  - "Keep your comms open. You never know who's listening."
  - "The wasteland tests your limits, but also reveals your strength."
  - "Every sunrise is a new chance to scavenge, build, and thrive."
  - "A good map and a keen eye are worth more than gold."
  - "Laughter is a weapon against the gloom. Use it often."
  - "Protect your resources, but never hoard kindness."
