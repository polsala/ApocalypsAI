---\n- name: Generate whimsical MOTD\n  hosts: all\n  gather_facts: true\n  vars_files:\n    - quotes.yml\n  vars:\n    output_path: "{{ output_path | default('/etc/motd') }}"\n    selected_quote: "{{ selected_quote | default( quotes | random ) }}"\n  tasks:\n    - name: Assemble MOTD content\n      set_fact:\n        motd_content: |\n          {{ selected_quote }}\n\n          Host: {{ ansible_hostname }}\n          Uptime (seconds): {{ ansible_uptime_seconds }}\n\n    - name: Write MOTD file\n      copy:\n        dest: "{{ output_path }}"\n        content: "{{ motd_content }}"\n        mode: '0644'\n
