---\n- name: Test MOTD generation with deterministic quote\n  hosts: all\n  gather_facts: false\n  vars:\n    output_path: "/tmp/motd_test_ci"\n    selected_quote: "Test quote for CI"\n  tasks:\n    - name: Include the MOTD playbook\n      import_playbook: "../src/motd.yml"\n\n    - name: Verify file exists\n      stat:\n        path: "{{ output_path }}"\n      register: motd_stat\n\n    - name: Assert file was created\n      assert:\n        that:\n          - motd_stat.stat.exists\n          - motd_stat.stat.isreg\n\n    - name: Read file content\n      slurp:\n        src: "{{ output_path }}"\n      register: motd_data\n\n    - name: Decode content\n      set_fact:\n        motd_text: "{{ motd_data.content | b64decode }}"\n\n    - name: Check quote present\n      assert:\n        that:\n          - "'Test quote for CI' in motd_text"\n\n    - name: Clean up test artifact\n      file:\n        path: "{{ output_path }}"\n        state: absent\n
