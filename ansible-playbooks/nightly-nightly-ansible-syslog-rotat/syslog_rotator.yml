---
- name: Rotate and manage syslog files
  hosts: all
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Ensure logrotate is installed
      package: 
        name: logrotate
        state: present

    - name: Create logrotate configuration files
      template:
        src: templates/logrotate.conf.j2
        dest: "/etc/logrotate.d/{{ item.path | basename }}"
        owner: root
        group: root
        mode: '0644'
      loop: "{{ log_files_to_rotate }}"
      notify: Rotate logs now

  handlers:
    - name: Rotate logs now
      command: logrotate -f /etc/logrotate.d/{{ item.path | basename }}
      loop: "{{ log_files_to_rotate }}"
      listen: "Rotate logs now"
