- name: Network Chaos - Add latency to web servers
  shell: |
    set -e
    tc qdisc add dev eth0 root netem delay 100ms 50ms distribution normal || \
    tc qdisc change dev eth0 root netem delay 100ms 50ms distribution normal
    echo "Network latency added: 100ms ± 50ms"
  args:
    executable: /bin/bash
  when: "'webservers' in group_names"
  register: network_latency
  ignore_errors: true

- name: Network Chaos - Record latency addition
  set_fact:
    chaos_results: "{{ chaos_results + [{
      'description': 'Added network latency to webservers',
      'impact': 'Increased response times by ~100ms',
      'apocalypse_points': 10
    }] }}"
  when: network_latency is succeeded

- name: Network Chaos - Add packet loss to databases
  shell: |
    set -e
    tc qdisc add dev eth0 root netem loss 5% || \
    tc qdisc change dev eth0 root netem loss 5%
    echo "Packet loss added: 5%"
  args:
    executable: /bin/bash
  when: "'databases' in group_names"
  register: packet_loss
  ignore_errors: true

- name: Network Chaos - Record packet loss
  set_fact:
    chaos_results: "{{ chaos_results + [{
      'description': 'Added packet loss to databases',
      'impact': '5% of packets will be lost',
      'apocalypse_points': 15
    }] }}"
  when: packet_loss is succeeded

- name: Network Chaos - Wait for chaos duration
  pause:
    seconds: "{{ chaos_duration }}"
  when: network_latency is succeeded or packet_loss is succeeded

- name: Network Chaos - Remove network latency
  shell: tc qdisc del dev eth0 root netem
  when: network_latency is succeeded
  ignore_errors: true

- name: Network Chaos - Remove packet loss
  shell: tc qdisc del dev eth0 root netem
  when: packet_loss is succeeded
  ignore_errors: true
