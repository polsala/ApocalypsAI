# Inventory for Nightly Ephemeral Runner Ghost Buster
# This utility runs locally, so we use localhost

[localhost]
127.0.0.1 ansible_connection=local

[all:vars]
# GitHub configuration
github_org=your-org
github_repo=your-repo

# Cloud provider configuration
aws_profile=default
azure_subscription_id=your-subscription-id
gcp_project_id=your-gcp-project-id

# Cleanup configuration
max_age_hours=4
debug_mode=false
report_output_path=/tmp/ghost_buster_report.txt

dry_run=false
