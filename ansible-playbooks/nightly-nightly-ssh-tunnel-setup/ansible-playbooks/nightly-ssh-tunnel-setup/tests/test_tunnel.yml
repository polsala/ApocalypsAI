- hosts: localhost\n  become: false\n  vars:\n    remote_user: testuser\n    remote_host: example.com\n    remote_port: 2222\n    local_port: 8080\n    ssh_key_path: /tmp/dummy_key\n    ssh_tunnel_service_path: /tmp/ssh-tunnel-test.service\n    skip_package_install: true\n  roles:\n    - ssh_tunnel\n\n- name: Verify service file created and contains correct ExecStart\n  hosts: localhost\n  become: false\n  tasks:\n    - name: Read service file\n      ansible.builtin.slurp:\n        src: "{{ ssh_tunnel_service_path }}"\n      register: service_file\n\n    - name: Decode content\n      set_fact:\n        service_content: "{{ service_file.content | b64decode }}"\n\n    - name: Assert ExecStart contains expected parameters\n      ansible.builtin.assert:\n        that:\n          - "'-R {{ remote_port }}:localhost:{{ local_port }}' in service_content"\n          - "'{{ remote_user }}@{{ remote_host }}' in service_content"\n
