- name: Ensure autossh is installed\n  ansible.builtin.apt:\n    name: autossh\n    state: present\n    update_cache: yes\n  when: not (skip_package_install | default(false))\n\n- name: Deploy systemd service for reverse tunnel\n  ansible.builtin.template:\n    src: ssh_tunnel.service.j2\n    dest: "{{ ssh_tunnel_service_path }}"\n    mode: '0644'\n\n- name: Reload systemd daemon\n  ansible.builtin.systemd:\n    daemon_reload: yes\n\n- name: Enable and start ssh-tunnel service\n  ansible.builtin.systemd:\n    name: ssh-tunnel\n    enabled: yes\n    state: started\n
