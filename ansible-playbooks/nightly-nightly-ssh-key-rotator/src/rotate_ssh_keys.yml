- hosts: all\n  become: true\n  vars:\n    ssh_key_path: /etc/ssh/ssh_host_rsa_key\n    backup_dir: /etc/ssh/backup_keys\n  tasks:\n    - name: Ensure backup directory exists\n      file:\n        path: "{{ backup_dir }}"\n        state: directory\n        mode: "0700"\n\n    - name: Backup existing key if present\n      copy:\n        src: "{{ ssh_key_path }}"\n        dest: "{{ backup_dir }}/ssh_host_rsa_key_{{ ansible_date_time.iso8601_basic_short }}"\n        remote_src: true\n      when: lookup('file', ssh_key_path, errors='ignore') != ''\n\n    - name: Generate new SSH host key (mock)\n      copy:\n        content: "MOCK_SSH_HOST_KEY"\n        dest: "{{ ssh_key_path }}"\n        mode: "0600"\n\n    - name: Restart SSH service\n      service:\n        name: sshd\n        state: restarted\n      ignore_errors: true
