- hosts: localhost\n  connection: local\n  gather_facts: false\n  vars:\n    ssh_key_path: /tmp/mock_ssh_host_rsa_key\n    backup_dir: /tmp/mock_ssh_backup\n  tasks:\n    - name: Ensure no previous key file exists\n      file:\n        path: "{{ ssh_key_path }}"\n        state: absent\n\n    - name: Ensure no previous backup directory exists\n      file:\n        path: "{{ backup_dir }}"\n        state: absent\n\n    - name: Include the rotation playbook with overridden variables\n      import_playbook: "../../src/rotate_ssh_keys.yml"\n      vars:\n        ssh_key_path: "{{ ssh_key_path }}"\n        backup_dir: "{{ backup_dir }}"\n\n    - name: Verify new key file exists\n      stat:\n        path: "{{ ssh_key_path }}"\n      register: key_stat\n\n    - name: Assert key file was created with correct permissions\n      assert:\n        that:\n          - key_stat.stat.exists\n          - key_stat.stat.mode == '0600'\n\n    - name: Verify backup directory was created\n      stat:\n        path: "{{ backup_dir }}"\n      register: backup_stat\n\n    - name: Assert backup directory exists\n      assert:\n        that:\n          - backup_stat.stat.isdir
