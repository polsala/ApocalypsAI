- name: Introduce network latency
  shell: |
    tc qdisc add dev eth0 root netem delay 100ms 50ms distribution normal
  ignore_errors: yes

- name: Add packet loss
  shell: |
    tc qdisc add dev eth0 root netem loss 10%
  ignore_errors: yes

- name: Log network chaos applied
  debug:
    msg: "Network chaos applied: latency and packet loss introduced"
