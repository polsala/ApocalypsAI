---
- name: Test Nightly Ansible Log Analyzer
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    log_files_to_analyze:
      - "/tmp/test_syslog.log"
      - "/tmp/test_auth.log"
    patterns_to_find:
      - name: "ERROR"
        regex: "ERROR"
      - name: "WARNING"
        regex: "WARN(ING)?"

  tasks:
    - name: Create mock log files
      copy:
        dest: "{{ item }}"
        content: |
          This is a test log file.
          ERROR: Something went wrong.
          WARNING: This is a warning message.
          Another line.
          ERROR: Another error occurred.
          WARN: A short warning.
        mode: '0644'
      loop: "{{ log_files_to_analyze }}"

    - name: Mock the log_analyzer.py script
      copy:
        dest: /tmp/log_analyzer.py
        content: |
          import sys
          import re
          import json

          def analyze_logs(log_files, patterns):
              # Mock rationale: Simulate the actual script's behavior for testing.
              # This mock returns predefined results based on the input patterns and files.
              mock_results = {
                  "/tmp/test_syslog.log": {
                      "ERROR": 2,
                      "WARNING": 1
                  },
                  "/tmp/test_auth.log": {
                      "ERROR": 0,
                      "WARNING": 1
                  }
              }
              return mock_results

          if __name__ == "__main__":
              log_files_input = json.loads(sys.argv[1])
              patterns_input = json.loads(sys.argv[2])
              analysis_results = analyze_logs(log_files_input, patterns_input)
              print(json.dumps(analysis_results, indent=2))
        mode: '0755'

    - name: Run log analysis script (mocked)
      command: "python3 /tmp/log_analyzer.py '{{ log_files_to_analyze | tojson }}' '{{ patterns_to_find | tojson }}'"
      register: log_analysis_output
      changed_when: false

    - name: Assert log analysis results are correct
      assert:
        that:
          - "log_analysis_output.stdout | from_json | json_query('\''/tmp/test_syslog.log.ERROR'\'') == 2"
          - "log_analysis_output.stdout | from_json | json_query('\''/tmp/test_syslog.log.WARNING'\'') == 1"
          - "log_analysis_output.stdout | from_json | json_query('\''/tmp/test_auth.log.ERROR'\'') == 0"
          - "log_analysis_output.stdout | from_json | json_query('\''/tmp/test_auth.log.WARNING'\'') == 1"

    - name: Clean up mock log files
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ log_files_to_analyze }}"

    - name: Clean up temporary script
      file:
        path: /tmp/log_analyzer.py
        state: absent
