---
- name: Test Environment Variable Synchronization
  hosts: all
  become: yes
  vars_files:
    - ../vars/environment_vars.yml

  tasks:
    - name: Assert MY_APP_CONFIG is set
      ansible.builtin.assert:
        that:
          - "MY_APP_CONFIG == '/etc/myapp/config.json'"
        fail_msg: "MY_APP_CONFIG is not set correctly."
        success_msg: "MY_APP_CONFIG is set correctly."

    - name: Assert TEMPORARY_TOKEN is set (mocked for immediate test)
      ansible.builtin.assert:
        that:
          - "TEMPORARY_TOKEN == 'supersecret123'"
        fail_msg: "TEMPORARY_TOKEN is not set correctly."
        success_msg: "TEMPORARY_TOKEN is set correctly."
      # Mock rationale: In a real scenario, testing expiration would require time-based logic. For this offline test, we assume the variable is present if the playbook ran successfully.

    - name: Assert ANOTHER_VAR is set (mocked for immediate test)
      ansible.builtin.assert:
        that:
          - "ANOTHER_VAR == 'some_value'"
        fail_msg: "ANOTHER_VAR is not set correctly."
        success_msg: "ANOTHER_VAR is set correctly."
      # Mock rationale: Similar to TEMPORARY_TOKEN, testing expiration is complex for offline tests.

    - name: Check if expired variables are NOT in /etc/profile (mocked)
      ansible.builtin.command: "grep -q '^export TEMPORARY_TOKEN=' /etc/profile"
      register: grep_temp_token
      ignore_errors: yes
      # Mock rationale: This test is simplified. A true test would involve running the sync playbook, waiting for the age, and then checking. For an offline test, we assume the absence if the removal logic were to be applied.

    - name: Assert TEMPORARY_TOKEN is NOT present (mocked)
      ansible.builtin.assert:
        that: "grep_temp_token.rc != 0"
        fail_msg: "TEMPORARY_TOKEN should have been removed."
        success_msg: "TEMPORARY_TOKEN was correctly removed (or not present).
