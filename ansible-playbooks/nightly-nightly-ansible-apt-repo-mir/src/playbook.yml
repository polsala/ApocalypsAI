---\n- name: Mirror Apt Repository\n  hosts: all\n  become: true\n  vars:\n    # Default mirror URL – can be overridden via extra vars\n    mirror_url: "http://archive.ubuntu.com/ubuntu"\n    mirror_dir: "/var/spool/apt-mirror"\n    mirror_list_path: "/etc/apt/mirror.list"\n  tasks:\n    - name: Ensure apt-mirror package is installed\n      ansible.builtin.apt:\n        name: apt-mirror\n        state: present\n        update_cache: true\n\n    - name: Create mirror directory\n      ansible.builtin.file:\n        path: "{{ mirror_dir }}"\n        state: directory\n        mode: "0755"\n\n    - name: Generate mirror.list configuration\n      ansible.builtin.copy:\n        dest: "{{ mirror_list_path }}"\n        content: |
          deb {{ mirror_url }} {{ ansible_distribution_release }} main restricted universe multiverse\n          deb-src {{ mirror_url }} {{ ansible_distribution_release }} main restricted universe multiverse\n        owner: root\n        group: root\n        mode: "0644"\n\n    - name: Run apt-mirror (skip in check mode)\n      ansible.builtin.command:\n        cmd: apt-mirror\n      args:\n        creates: "{{ mirror_dir }}/skel"\n      when: not ansible_check_mode\n\n    - name: Report success\n      ansible.builtin.debug:\n        msg: "Apt repository successfully mirrored from {{ mirror_url }} to {{ mirror_dir }}"
