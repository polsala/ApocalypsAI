---\n- name: Test nightly-ansible-apt-repo-mirror playbook\n  hosts: all\n  gather_facts: false\n  vars:\n    mirror_url: "http://example.com/ubuntu"\n  tasks:\n    - name: Include the main playbook in check mode\n      ansible.builtin.import_playbook:\n        file: ../src/playbook.yml\n      vars:\n        ansible_check_mode: true\n\n    - name: Verify that mirror_url variable is defined and correct\n      ansible.builtin.assert:\n        that:\n          - mirror_url is defined\n          - mirror_url == "http://example.com/ubuntu"\n        fail_msg: "mirror_url variable is missing or incorrect"\n
