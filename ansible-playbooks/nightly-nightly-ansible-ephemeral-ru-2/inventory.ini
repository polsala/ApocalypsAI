# Ansible Inventory for Ephemeral GitHub Actions Runners
# This file is dynamically managed by the orchestrator

[runners]
# Runners will be added here dynamically during provisioning

[runners:vars]
# Common variables for all runners
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# GitHub Actions configuration
github_org=your-org
github_repo=your-repo
