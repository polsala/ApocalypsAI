# Test Inventory for Ephemeral GitHub Actions Runners
# This file is used for testing purposes

[runners]
# Test runners will be added here during testing

[runners:vars]
# Test variables for all runners
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Test GitHub Actions configuration
github_org=test-org
github_repo=test-repo
