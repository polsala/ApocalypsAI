---
- name: Identify old GCP instances
  set_fact:
    old_instances: "{{ cloud_instances | selectattr('creationTimestamp') | select('lt', (ansible_date_time.epoch | int - (cleanup_timeout | int * 3600))) | list }}"

- name: Terminate old GCP instances
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    zone: "{{ gcp_zone }}"
    state: absent
  loop: "{{ old_instances }}"
  loop_control:
    loop_var: instance
  when: old_instances | length > 0
