---
- name: Get list of Azure VMs
  azure.azcollection.azure_rm_virtualmachine_info:
    resource_group: "{{ azure_resource_group }}"
    tags:
      Project: "GitHub-Actions-Runners"
      Environment: "Ephemeral"
      ManagedBy: "Ansible-Orchestrator"
  register: azure_info

- name: Set cloud instances fact
  set_fact:
    cloud_instances: "{{ azure_info.vms | selectattr('powerstate', 'equalto', 'running') | list }}"
