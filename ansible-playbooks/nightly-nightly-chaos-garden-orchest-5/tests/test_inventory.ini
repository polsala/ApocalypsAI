# Test Inventory for Chaos Garden Orchestrator
# This is a minimal test inventory

[chaos_targets]
test-host ansible_host=localhost ansible_connection=local

[chaos_targets:vars]
ansible_user=root
chaos_intensity=low
chaos_duration=60
enable_cleanup=true
enable_reporting=true

# Chaos scenario configuration
[chaos_scenarios:vars]
chaos_scenarios:
  network:
    enabled: true
  resource:
    enabled: true
  service:
    enabled: true
  time:
    enabled: true
  random:
    enabled: false
