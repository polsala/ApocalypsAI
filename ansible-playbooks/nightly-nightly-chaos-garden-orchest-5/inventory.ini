# Chaos Garden Orchestrator Inventory
# Define your chaos targets here

[chaos_targets]
# Example targets - replace with your actual hosts
# target1 ansible_host=192.168.1.10
# target2 ansible_host=192.168.1.11
# target3 ansible_host=192.168.1.12

[chaos_targets:vars]
# Default variables for chaos targets
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa

# Chaos configuration
chaos_intensity=medium
chaos_duration=300
enable_cleanup=true
enable_reporting=true
