# Define the base path for comfort zone files.\n# This can be overridden at runtime or for testing.\ncomfort_zone_base_path: "" # Default to empty, meaning absolute paths as defined below.\n\ncomfort_zone_files:\n  - path: "/etc/motd.d/apocalypsai_welcome"\n    content: "Welcome, Survivor! May your code be bug-free and your coffee strong.\n"\n    mode: "0644"\n  - path: "/home/{{ ansible_user }}/.config/apocalypsai/daily_affirmation.txt"\n    content: "You are resilient. You are creative. You are integrated.\n"\n    mode: "0600"\n  - path: "/home/{{ ansible_user }}/.bash_aliases"\n    content: |-\n      alias comfort='echo \"Feeling comfy?\"'\n      alias integrate='ansible-playbook ~/nightly-comfort-zone-enforce/src/comfort_zone.yml'\n    mode: "0644"\n
