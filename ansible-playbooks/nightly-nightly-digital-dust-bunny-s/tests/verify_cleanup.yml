---
- name: Verify Cleanup Results
  hosts: test_servers
  gather_facts: no

  vars:
    report_path: "/tmp/dust_bunny_sweeper_report_localhost.txt"

  tasks:
    - name: Verify report content after cleanup
      ansible.builtin.slurp:
        src: "{{ report_path }}"
      register: report_content_cleanup
      delegate_to: localhost
      # Mock rationale: Reads the generated report to verify its contents after cleanup.

    - name: Assert report indicates cleanup
      ansible.builtin.assert:
        that:
          - "'CLEANUP COMPLETE' in report_content_cleanup.content | b64decode"
          - "'DRY RUN' not in report_content_cleanup.content | b64decode"
        msg: "Cleanup report did not indicate actual cleanup."
      # Mock rationale: Verifies the report accurately reflects the cleanup action.

    - name: Verify old files are deleted
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/tmp/digital_dust_bunnies_test/old_file_1.txt"
        - "/tmp/digital_dust_bunnies_test/old_file_2.log"
        - "/tmp/digital_dust_bunnies_test/old_dir/old_file_in_dir.tmp"
      register: deleted_file_stats
      # Mock rationale: Confirms that files identified as dust bunnies are indeed removed.

    - name: Assert old files are absent
      ansible.builtin.assert:
        that:
          - "not item.stat.exists"
        msg: "Old file {{ item.path }} was not deleted."
      loop: "{{ deleted_file_stats.results }}"
      # Mock rationale: Confirms that files identified as dust bunnies are indeed removed.

    - name: Verify recent files still exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/tmp/digital_dust_bunnies_test/recent_file.txt"
        - "/tmp/digital_dust_bunnies_test/seven_day_old_file.txt"
      register: remaining_file_stats
      # Mock rationale: Confirms that recent files are not accidentally deleted.

    - name: Assert recent files are present
      ansible.builtin.assert:
        that:
          - "item.stat.exists"
        msg: "Recent file {{ item.path }} was unexpectedly deleted."
      loop: "{{ remaining_file_stats.results }}"
      # Mock rationale: Confirms that recent files are not accidentally deleted.
