---\n- name: Deploy Bunker Alarm systemd service\n  hosts: all\n  become: true\n  vars:\n    alarm_script_path: /usr/local/bin/bunker_alarm.sh\n    service_path: /etc/systemd/system/bunker_alarm.service\n    timer_path: /etc/systemd/system/bunker_alarm.timer\n  tasks:\n    - name: Copy alarm script\n      copy:\n        src: files/bunker_alarm.sh\n        dest: "{{ alarm_script_path }}"\n        mode: '0755'\n\n    - name: Copy systemd service unit\n      copy:\n        src: files/bunker_alarm.service\n        dest: "{{ service_path }}"\n        mode: '0644'\n\n    - name: Copy systemd timer unit\n      copy:\n        src: files/bunker_alarm.timer\n        dest: "{{ timer_path }}"\n        mode: '0644'\n\n    - name: Reload systemd daemon\n      command: systemctl daemon-reload\n      notify: Enable and start timer\n\n  handlers:\n    - name: Enable and start timer\n      systemd:\n        name: bunker_alarm.timer\n        enabled: true\n        state: started\n
