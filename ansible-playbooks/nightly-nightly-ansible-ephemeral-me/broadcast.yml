---
- name: Broadcast ephemeral message
  hosts: ephemeral_targets
  vars:
    message: "{{ message | default('Hello from the apocalypse!') }}"
    ttl_seconds: "{{ ttl_seconds | default(3600) }}"
  tasks:
    - name: Ensure message directory exists
      ansible.builtin.file:
        path: "/tmp/ephemeral_messages/{{ inventory_hostname }}"
        state: directory
        mode: '0755'

    - name: Write the message file
      ansible.builtin.copy:
        dest: "/tmp/ephemeral_messages/{{ inventory_hostname }}/message.txt"
        content: "{{ message }}\nTTL: {{ ttl_seconds }} seconds"
        mode: '0644'
