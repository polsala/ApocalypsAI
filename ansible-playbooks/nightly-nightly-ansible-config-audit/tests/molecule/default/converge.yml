---
- name: Converge
  hosts: instance
  gather_facts: yes
  roles:
    # If you had a role, you'd include it here.
    # For a playbook, we just run the playbook directly.
  tasks:
    - name: Include the audit_config playbook
      include_role:
        name: ../../../
      vars:
        # Override default vars for testing if needed
        audit_baseline_dir: "/tmp/molecule/audit_baseline"
        audit_report_path: "/tmp/molecule/audit_report.txt"
        baseline_files:
          - path: "/tmp/test_file_1"
            checksum: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" # sha256sum of empty file
          - path: "/tmp/test_file_2"
            checksum: "a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
        baseline_services:
          - name: "fake_service_1"
            state: "started"
        baseline_users:
          - username: "testuser"
            exists: true
            group: "users"
          - username: "nonexistent_user"
            exists: false
