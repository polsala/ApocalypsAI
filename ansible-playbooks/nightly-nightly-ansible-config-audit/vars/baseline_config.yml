# Define the expected state of your systems.
# This is a sample baseline. Customize it for your needs.

# Directory for audit logs/reports (optional)
audit_baseline_dir: "/opt/apoc_audit"
audit_report_path: "/tmp/apoc_system_audit_report.txt"

# Files to check and their expected SHA256 checksums
# You'll need to generate these checksums on a known-good system.
baseline_files:
  - path: "/etc/ssh/sshd_config"
    checksum: "a1b2c3d4e5f67890abcdef1234567890abcdef1234567890abcdef1234567890"
  - path: "/etc/passwd"
    checksum: "0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba"

# Services that should be running
baseline_services:
  - name: "sshd"
    state: "started"
  - name: "cron"
    state: "started"

# Users that should exist and their primary group
baseline_users:
  - username: "root"
    exists: true
    group: "root"
  - username: "sysadmin"
    exists: true
    group: "users"
  - username: "unwanted_user"
    exists: false
