[test_servers]
localhost ansible_connection=local

[all:vars]
# Test chaos configuration
chaos_enabled=true
chaos_level=low
chaos_duration=10
cleanup_enabled=true
chaos_reports_dir=/tmp/test_chaos_reports

# Test network chaos settings
network_chaos_probability=0.1
network_latency_ms=50
network_packet_loss=2

# Test resource chaos settings
resource_chaos_probability=0.1
memory_consumption_mb=50
cpu_stress_duration=5

# Test service chaos settings
service_chaos_probability=0.15
service_restart_delay=3

# Test time chaos settings
time_chaos_probability=0.05
time_shift_seconds=30

# Test random chaos settings
random_chaos_probability=0.1
