[test_servers]
localhost ansible_connection=local

[all:vars]
# Chaos configuration
chaos_enabled=true
chaos_level=medium
chaos_duration=30
cleanup_enabled=true
chaos_reports_dir=/tmp/chaos_reports

# Network chaos settings
network_chaos_probability=0.3
network_latency_ms=100
network_packet_loss=5

# Resource chaos settings
resource_chaos_probability=0.2
memory_consumption_mb=100
cpu_stress_duration=10

# Service chaos settings
service_chaos_probability=0.25
service_restart_delay=5

# Time chaos settings
time_chaos_probability=0.1
time_shift_seconds=60

# Random chaos settings
random_chaos_probability=0.15
