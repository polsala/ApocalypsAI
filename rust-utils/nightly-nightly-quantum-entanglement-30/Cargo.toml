[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical utility that generates and verifies quantum entanglement pairs for fun and pseudo-scientific validation"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = "3.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
test = "0.1"
