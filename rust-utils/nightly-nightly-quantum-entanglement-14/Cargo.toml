[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
edition = "2021"
description = "A whimsical CLI tool that checks if two code snippets are 'quantum entangled'"
authors = ["ApocalypsAI"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "quantum-entanglement-checker"
path = "src/main.rs"
