[package]
name = "nightly-quantum-entropy-seeder"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A CLI tool that generates cryptographically strong random seeds using quantum noise from public APIs"
license = "MIT"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rand = "0.8"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
