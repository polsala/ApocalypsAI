[package]
name = "nightly-chaos-bus-simulator"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical CLI tool that simulates a chaotic bus system with random events, delays, and passenger interactions"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
test-case = "3.0"
