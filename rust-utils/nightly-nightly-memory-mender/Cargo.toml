[package]
name = "nightly-memory-mender"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI tool to detect and mend minor data corruptions in text files."
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI" # Placeholder, will be updated by agent

[[bin]]
name = "nightly-memory-mender"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "1"
tempfile = "3"
