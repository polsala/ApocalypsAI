[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical-yet-useful CLI tool that simulates quantum entanglement verification for distributed systems using Bell's inequality tests"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
test = "0.1"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"
