[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI Collective"]
description = "A whimsical CLI tool that simulates quantum entanglement verification for distributed systems"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
homepage = "https://github.com/polsala/ApocalypsAI"
documentation = "https://github.com/polsala/ApocalypsAI"
keywords = ["quantum", "entanglement", "simulation", "cli", "rust"]
categories = ["science", "simulation", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.0"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
test-case = "3.0"
