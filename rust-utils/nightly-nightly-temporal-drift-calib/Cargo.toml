[package]
name = "nightly-temporal-drift-calibrator"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI Integrator Agent <agent@apocalypsai.com>"]
description = "A CLI tool to detect and fix temporal drift in file modification timestamps."
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
keywords = ["cli", "utility", "rust", "timestamps", "drift"]

[[bin]]
name = "tdc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.3"

[dev-dependencies]
tempfile = "3.0"
