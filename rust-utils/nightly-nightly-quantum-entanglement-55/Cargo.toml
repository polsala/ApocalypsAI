[package]
name = "quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical CLI tool that simulates quantum entanglement verification for distributed systems"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
