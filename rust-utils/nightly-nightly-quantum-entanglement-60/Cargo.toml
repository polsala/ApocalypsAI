[package]
name = "nightly-quantum-entanglement-simulator"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical quantum entanglement simulator that generates entangled particle pairs and visualizes their spooky action at a distance"
license = "MIT"

[dependencies]
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "nightly-quantum-entanglement-simulator"
path = "src/main.rs"
