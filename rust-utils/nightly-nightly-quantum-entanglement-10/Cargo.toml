[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical utility that simulates quantum entanglement verification for distributed systems"
license = "MIT"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
target-cpu = "native"
lto = true
