[package]
name = "nightly-temporal-purifier"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["std"] }
anyhow = "1.0"
walkdir = "2.3"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "0.1"
filetime = "0.2"
