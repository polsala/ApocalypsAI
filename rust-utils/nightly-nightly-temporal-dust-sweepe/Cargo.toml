[package]
name = "nightly-temporal-dust-sweeper"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
chrono = "0.11"
regex = "1"
filetime = "0.2" # For setting file modification times in tests and potentially main if access_time is used

[dev-dependencies]
assert_cmd = "2"
predicates = "0.1"
tempfile = "3"
