[package]
name = "nightly-data-dust-bunny-sweeper"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.3"
chrono = { version = "0.4", features = ["std"] } # `std` feature for SystemTime conversion

[dev-dependencies]
tempfile = "3.0"
filetime = "0.2" # For setting file times in tests
