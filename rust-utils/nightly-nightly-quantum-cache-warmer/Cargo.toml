[package]
name = "nightly-quantum-cache-warmer"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A high-performance CLI tool that preloads frequently accessed data into memory using quantum-inspired probabilistic caching algorithms"
license = "MIT"
homepage = "https://github.com/polsala/ApocalypsAI"
repository = "https://github.com/polsala/ApocalypsAI"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rand = "0.8"
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
test = "0.1"

[[bin]]
name = "nightly-quantum-cache-warmer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
