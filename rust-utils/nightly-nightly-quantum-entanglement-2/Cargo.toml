[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI Community"]
description = "A whimsical utility that simulates quantum entanglement verification for distributed systems"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
keywords = ["quantum", "distributed", "monitoring", "cli"]
