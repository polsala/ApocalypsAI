[package]
name = "nightly-digital-tremor-scan"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.3"

[dev-dependencies]
tempfile = "0.3"
filetime = "0.2"
