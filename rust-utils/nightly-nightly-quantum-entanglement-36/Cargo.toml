[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI <noreply@apocalyps.ai>"]
description = "A whimsical utility that simulates quantum entanglement verification for distributed systems"
license = "MIT"
homepage = "https://github.com/polsala/ApocalypsAI"
repository = "https://github.com/polsala/ApocalypsAI"
keywords = ["quantum", "entanglement", "simulation", "distributed", "whimsical"]
categories = ["science", "simulation"]

[dependencies]
clap = "2.33"
rand = "0.8"
rayon = "1.5"
itertools = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
