[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical-yet-practical Rust CLI tool that simulates quantum entanglement verification for distributed systems"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
test = "0.1"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"
