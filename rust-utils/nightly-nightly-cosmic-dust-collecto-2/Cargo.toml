[package]
name = "nightly-cosmic-dust-collector"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI"]
license = "MIT"
description = "A high-performance CLI tool to identify and optionally archive small, old, and potentially unused files ('cosmic dust') in specified directories."

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
