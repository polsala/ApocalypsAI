[package]
name = "quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
description = "A whimsical-yet-practical Rust CLI tool that simulates quantum entanglement verification for distributed systems"
authors = ["ApocalypsAI"]
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"

dependencies = [
    clap = { version = "4.0", features = ["derive"] },
    serde = { version = "1.0", features = ["derive"] },
    serde_json = "1.0",
    serde_yaml = "0.9",
    serde_xml_rs = "0.6",
    rand = "0.8",
    chrono = { version = "0.4", features = ["serde"] },
]

[[bin]]
name = "quantum-entanglement-checker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
