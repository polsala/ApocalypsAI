[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical CLI tool that simulates quantum entanglement verification for distributed systems"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2.1"

[dev-dependencies]
test-case = "3.1"
