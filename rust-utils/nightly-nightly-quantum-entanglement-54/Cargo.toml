[package]
name = "nightly-quantum-entanglement-simulator"
version = "0.1.0"
edition = "2021"
authors = ["ApocalypsAI Community"]
description = "A whimsical CLI tool that simulates quantum entanglement states for fun and educational purposes"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
homepage = "https://github.com/polsala/ApocalypsAI"
documentation = "https://github.com/polsala/ApocalypsAI"
keywords = ["quantum", "entanglement", "simulation", "cli", "educational"]
categories = ["science", "simulation", "cli-utilities"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.0"
