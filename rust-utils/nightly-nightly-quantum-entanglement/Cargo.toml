[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical utility that generates and verifies quantum-like entanglement states for fun and testing purposes"
license = "MIT"

[dependencies]
clap = "4.0"
colored = "2.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"
