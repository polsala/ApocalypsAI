[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
description = "A whimsical CLI tool that simulates quantum entanglement verification for distributed systems"
authors = ["ApocalypsAI Community"]
edition = "2021"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
homepage = "https://github.com/polsala/ApocalypsAI"
documentation = "https://github.com/polsala/ApocalypsAI"
keywords = ["quantum", "entanglement", "cli", "devops", "distributed"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "2.0"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
test-fixture = "0.5"
tempfile = "3.0"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
