[package]
name = "nightly-quantum-quip-generator"
version = "0.1.0"
edition = "2021"
description = "A whimsical CLI tool that generates quantum-themed programming jokes and puns"
authors = ["ApocalypsAI Community"]
license = "MIT"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
colorize = "0.1"

[dev-dependencies]
tokio-test = "0.4"
