[package]
name = "nightly-temporal-file-sweeper"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
walkdir = "2.3"
anyhow = "1.0" # For simplified error handling

[dev-dependencies]
tempfile = "3.0"
filetime = "0.2" # To set file modification times in tests
