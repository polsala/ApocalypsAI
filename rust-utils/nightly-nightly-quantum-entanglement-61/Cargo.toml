[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
description = "A whimsical-yet-useful Rust CLI tool that simulates quantum entanglement verification for distributed systems"
authors = ["ApocalypsAI"]
edition = "2021"
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
documentation = "https://github.com/polsala/ApocalypsAI/tree/main/rust-utils/nightly-quantum-entanglement-checker"
keywords = ["quantum", "entanglement", "cli", "rust", "simulation"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
