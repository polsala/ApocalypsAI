[package]
name = "nightly-digital-echo-scrubber"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
walkdir = "2"
chrono = "0.4" # For formatting SystemTime

[dev-dependencies]
assert_cmd = "2"
predicates = "0.1"
tempfile = "3"
filetime = "0.2" # For setting file modification times in tests
