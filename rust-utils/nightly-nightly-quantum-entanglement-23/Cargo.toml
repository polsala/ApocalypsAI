[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
authors = ["ApocalypsAI"]
description = "A whimsical utility that simulates quantum entanglement for file pairs"
license = "MIT"

[dependencies]
clap = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
