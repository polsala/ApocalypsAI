[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
description = "A whimsical utility that checks if two code files are quantum-entangled (identical) with spooky quantum-themed reports"
authors = ["ApocalypsAI Community"]
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
categories = ["command-line-utilities"]
keywords = ["quantum", "entanglement", "file-comparison", "cli"]

[dependencies]
sha2 = "0.10"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
