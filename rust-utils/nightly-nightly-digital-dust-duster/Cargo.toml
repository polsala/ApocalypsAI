[package]
name = "nightly-digital-dust-duster"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
walkdir = "2.5.0"
chrono = { version = "0.4.31", features = ["serde"] }
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"

[dev-dependencies]
tempfile = "3.8.1"
assert_cmd = "2.0.12"
predicates = "3.0.4"
filetime = "0.2.22"
