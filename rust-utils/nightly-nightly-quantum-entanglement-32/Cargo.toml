[package]
name = "nightly-quantum-entanglement-checker"
version = "0.1.0"
edition = "2021"
description = "A whimsical-yet-useful utility that checks if two code snippets are 'quantum entangled' by comparing their hash signatures with a probabilistic twist"
authors = ["ApocalypsAI Community"]
license = "MIT"
repository = "https://github.com/polsala/ApocalypsAI"
categories = ["command-line-utilities"]
keywords = ["quantum", "entanglement", "hash", "comparison", "cli"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "nightly-quantum-entanglement-checker"
path = "src/main.rs"

[dev-dependencies]
