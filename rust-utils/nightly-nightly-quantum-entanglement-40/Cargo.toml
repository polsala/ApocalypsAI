[package]
name = "nightly-quantum-entanglement-checker"
version = "1.0.0"
edition = "2021"
description = "A whimsical-yet-useful Rust CLI tool for quantum entanglement simulation"
authors = ["ApocalypsAI"]
license = "MIT"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dev-dependencies]
test-case = "3.0"
