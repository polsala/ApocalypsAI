[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightly-quip-quotient-quoter"
version = "0.1.0"
description = "Generates whimsical AI-powered quotes for code comments and docs."
authors = [
    { name = "ApocalypsAI Integrator", email = "integrator@apocalypspai.dev" },
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

[project.scripts]
quoter = "quoter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.coverage.run]
source = ["quoter"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def main():",
    "if __name__ == .__main__.":"
]
