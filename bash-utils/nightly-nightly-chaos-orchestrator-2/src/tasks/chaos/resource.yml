# Resource Chaos Scenarios
# Simulate resource exhaustion for chaos engineering

- name: Apply CPU stress chaos
  when: chaos_scenarios.resource_chaos.cpu.enabled | default(false)
  block:
    - name: Check if chaos probability allows CPU stress
      set_fact:
        apply_cpu_stress: "{{ (100 * (ansible_date_time.epoch | int % 100)) <= (chaos_scenarios.resource_chaos.cpu.probability * 100) }}"

    - name: Apply CPU stress
      when: apply_cpu_stress
      block:
        - name: Log CPU stress start
          lineinfile:
            path: "{{ chaos_report_file }}"
            line: "- CPU Stress: Started at {{ ansible_date_time.iso8601 }} ({{ chaos_scenarios.resource_chaos.cpu.workers | default(2) }} workers)"

        - name: Start CPU stress process
          shell: >
            timeout {{ chaos_scenarios.resource_chaos.cpu.duration | default(60) }}s
            stress --cpu {{ chaos_scenarios.resource_chaos.cpu.workers | default(2) }}
            & echo $! > /tmp/cpu_stress.pid
          async: 0
          poll: 0

        - name: Wait for CPU stress duration
          wait_for:
            timeout: "{{ chaos_scenarios.resource_chaos.cpu.duration | default(60) }}"

        - name: Stop CPU stress process
          shell: >
            if [ -f /tmp/cpu_stress.pid ]; then
              kill $(cat /tmp/cpu_stress.pid) 2>/dev/null || true
              rm -f /tmp/cpu_stress.pid
            fi
          ignore_errors: yes

        - name: Log CPU stress end
          lineinfile:
            path: "{{ chaos_report_file }}"
            line: "- CPU Stress: Ended at {{ ansible_date_time.iso8601 }}"

- name: Apply memory stress chaos
  when: chaos_scenarios.resource_chaos.memory.enabled | default(false)
  block:
    - name: Check if chaos probability allows memory stress
      set_fact:
        apply_memory_stress: "{{ (100 * (ansible_date_time.epoch | int % 100)) <= (chaos_scenarios.resource_chaos.memory.probability * 100) }}"

    - name: Apply memory stress
      when: apply_memory_stress
      block:
        - name: Log memory stress start
          lineinfile:
            path: "{{ chaos_report_file }}"
            line: "- Memory Stress: Started at {{ ansible_date_time.iso8601 }} ({{ chaos_scenarios.resource_chaos.memory.size | default('100M') }})"

        - name: Start memory stress process
          shell: >
            timeout {{ chaos_scenarios.resource_chaos.memory.duration | default(60) }}s
            stress --vm 1 --vm-bytes {{ chaos_scenarios.resource_chaos.memory.size | default('100M') }}
            & echo $! > /tmp/memory_stress.pid
          async: 0
          poll: 0

        - name: Wait for memory stress duration
          wait_for:
