# Nightly Bash Backup Orchestrator Configuration

# Source directories to backup (comma-separated)
# Use absolute paths
SOURCE_DIRS="/home/user/Documents,/home/user/Pictures,/etc"

# Destination directory for backups
DESTINATION_DIR="/backup"

# Retention period in days (old backups will be automatically deleted)
RETENTION_DAYS=30

# Encryption settings
# Set ENCRYPT_BACKUP to true to enable GPG encryption
# GPG_RECIPIENT should be the email or key ID of the recipient
ENCRYPT_BACKUP=false
GPG_RECIPIENT="user@example.com"

# Email notification settings
# Set ENABLE_EMAIL to true to enable email notifications
# EMAIL_RECIPIENT is the email address to send notifications to
ENABLE_EMAIL=false
EMAIL_RECIPIENT="admin@example.com"

# Additional rsync options (optional)
# RSYNC_OPTIONS="--exclude='*.tmp' --exclude='*.log'"

# Compression level for tar (1-9, where 9 is maximum compression)
# Default is 6
COMPRESSION_LEVEL=6

# Custom backup name prefix (optional)
# BACKUP_PREFIX="my_backup"

# Enable verbose logging
# VERBOSE_LOGGING=true
