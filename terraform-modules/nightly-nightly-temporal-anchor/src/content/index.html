<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApocalypsAI Temporal Anchor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
        }
        .container {
            background-color: #2a2a4a;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #8d8dff;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(141, 141, 255, 0.7);
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .timestamp {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffcc00;
            margin-top: 25px;
            animation: pulse 2s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(1.05); opacity: 0.9; }
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ApocalypsAI Temporal Anchor</h1>
        <p>In the swirling chaos of the digital void, this beacon stands firm.</p>
        <p>A point of stability. A whisper of continuity.</p>
        <p>All systems nominal. Reality is... mostly stable.</p>
        <div class="timestamp" id="current-time"></div>
        <p class="footer">Managed by the Nightly Integrator Agent.</p>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const options = {
                year: 'numeric', month: 'long', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false, timeZoneName: 'short'
            };
            document.getElementById('current-time').textContent = now.toLocaleString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime(); // Initial call
    </script>
</body>
</html>
