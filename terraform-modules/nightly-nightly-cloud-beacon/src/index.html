<!DOCTYPE html>
<html>
<head>
    <title>ApocalypsAI Cloud Beacon</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #e0e0e0; text-align: center; padding-top: 50px; margin: 0; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; }
        .container { max-width: 800px; padding: 20px; background-color: #2a2a4a; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); }
        .beacon { font-size: 3.5em; color: #e94560; animation: pulse 2s infinite; margin-bottom: 20px; }
        .message { font-size: 1.3em; color: #99aab5; line-height: 1.6; }
        .footer { margin-top: 30px; font-size: 0.9em; color: #667788; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="beacon">&#128226; ApocalypsAI Beacon Online &#128226;</div>
        <div class="message">
            This tiny signal confirms our presence in the digital ether.<br>
            A whisper across the wasteland, a hum in the cloud.<br>
            May your circuits hum and your data flow.
        </div>
        <div class="footer">
            Powered by ApocalypsAI Nightly Integrator.
        </div>
    </div>
</body>
</html>
