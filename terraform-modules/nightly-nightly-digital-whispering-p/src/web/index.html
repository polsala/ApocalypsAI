<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Digital Whispering Post</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #1a1a1a; color: #00ff00; margin: 20px; }
        .container { max-width: 800px; margin: auto; padding: 20px; border: 1px solid #00ff00; box-shadow: 0 0 10px #00ff00; }
        h1, h2 { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        textarea { width: 100%; height: 100px; background-color: #333; color: #00ff00; border: 1px solid #00ff00; padding: 10px; resize: vertical; }
        button { background-color: #00ff00; color: #1a1a1a; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00cc00; }
        .whisper-list { margin-top: 20px; border-top: 1px dashed #00ff00; padding-top: 20px; }
        .whisper-item { background-color: #2a2a2a; border: 1px solid #00ff00; padding: 10px; margin-bottom: 10px; }
        .whisper-message { font-style: italic; }
        .whisper-timestamp { font-size: 0.8em; color: #00cc00; text-align: right; }
        #status { margin-top: 10px; color: #ff0000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>The Digital Whispering Post</h1>
        <p>Leave an ephemeral whisper for the community. Messages fade with time, like echoes in the void.</p>

        <h2>Leave a Whisper:</h2>
        <textarea id="whisperInput" placeholder="Your fleeting thought..."></textarea><br>
        <button onclick="postWhisper()">Whisper into the Ether</button>
        <div id="status"></div>

        <h2>Recent Whispers:</h2>
        <div id="whisperList" class="whisper-list">
            <p>Loading whispers...</p>
        </div>
    </div>

    <script>
        // IMPORTANT: Replace this with the actual API Gateway Invoke URL after deployment.
        // Example: https://xxxxxxxxxx.execute-api.us-east-1.amazonaws.com/v1/whispers
        const API_GATEWAY_URL = "YOUR_API_GATEWAY_INVOKE_URL_HERE/v1/whispers"; 

        async function postWhisper() {
            const whisperInput = document.getElementById('whisperInput');
            const statusDiv = document.getElementById('status');
            const message = whisperInput.value.trim();

            if (!message) {
                statusDiv.textContent = "Please enter a message.";
                return;
            }

            statusDiv.textContent = "Whispering...";
            try {
                const response = await fetch(API_GATEWAY_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message }),
                });

                const data = await response.json();
                if (response.ok) {
                    statusDiv.textContent = "Whisper sent! It will fade in 24 hours.";
                    whisperInput.value = '';
                    fetchWhispers(); // Refresh the list
                } else {
                    statusDiv.textContent = `Failed to whisper: ${data.message || response.statusText}`;
                }
            } catch (error) {
                statusDiv.textContent = `Network error: ${error.message}`;
            }
        }

        async function fetchWhispers() {
            const whisperListDiv = document.getElementById('whisperList');
            whisperListDiv.innerHTML = '<p>Fetching whispers...</p>';
            try {
                const response = await fetch(API_GATEWAY_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                const data = await response.json();
                if (response.ok) {
                    if (data.whispers && data.whispers.length > 0) {
                        whisperListDiv.innerHTML = data.whispers.map(w => `
                            <div class="whisper-item">
                                <div class="whisper-message">${escapeHtml(w.message)}</div>
                                <div class="whisper-timestamp">${new Date(w.timestamp * 1000).toLocaleString()}</div>
                            </div>
                        `).join('');
                    } else {
                        whisperListDiv.innerHTML = '<p>No whispers yet. Be the first!</p>';
                    }
                } else {
                    whisperListDiv.innerHTML = `<p>Failed to load whispers: ${data.message || response.statusText}</p>`;
                }
            } catch (error) {
                whisperListDiv.innerHTML = `<p>Network error: ${error.message}</p>`;
            }
        }

        function escapeHtml(text) {
            var map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"]/g, function(m) { return map[m]; });
        }

        // Initial fetch when the page loads
        window.onload = fetchWhispers;
        // Refresh whispers every 30 seconds
        setInterval(fetchWhispers, 30000);
    </script>
</body>
</html>
