name: Nightly Self-Heal
on:
  schedule:
    - cron: '42 2 * * *'
permissions:
  contents: write
  pull-requests: write
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install requests rich pyyaml pytest
      - name: Run nightly integrator
        id: run_agent
        env:
          APOCALYPSAI_PROVIDER: cheap_mix
        run: |
          set +e
          python agents/agent_integrator.py --repo "${{ github.repository }}" --mode nightly
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fail on agent error
        if: ${{ steps.run_agent.outputs.status != '0' && steps.run_agent.outputs.status != '2' }}
        run: |
          echo "ERROR: Nightly integrator failed with status ${{ steps.run_agent.outputs.status }}"
          exit 1
      - name: No-op detected
        if: ${{ steps.run_agent.outputs.status == '2' }}
        run: echo "Agent reported no-op; skipping PR."
      - name: Validate diff
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          if [ ! -s .apocalypsai/last.diff ]; then
            echo "ERROR: .apocalypsai/last.diff missing or empty"
            exit 1
          fi
      - name: Apply diff
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          python tools/apply_diff.py .apocalypsai/last.diff
      - name: Configure git
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          git config user.name "apocalypsai-bot"
          git config user.email "bot@apocalypsai.local"
      - name: Prepare branch metadata
        if: ${{ steps.run_agent.outputs.status == '0' }}
        id: meta
        run: |
          set -euo pipefail
          slug=$(date -u +"%Y%m%d")
          readable=$(date -u +"%Y-%m-%d")
          summary="self-heal ${readable}"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "readable=$readable" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      - name: Create branch
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          git checkout -b "ai/nightly-${{ steps.meta.outputs.slug }}"
      - name: Commit changes
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          result = subprocess.run(["git", "status", "--porcelain", "-z"], capture_output=True, check=True)
          data = result.stdout
          if not data:
              print("ERROR: No unstaged changes detected.", file=sys.stderr)
              sys.exit(1)
          paths = []
          i = 0
          while i < len(data):
              j = data.find(b"\0", i)
              if j == -1:
                  break
              entry = data[i:j].decode()
              i = j + 1
              status = entry[:2]
              if status and status[0] in {"R", "C"}:
                  path = entry.split(" -> ", 1)[1]
              else:
                  path = entry[3:]
              if path == ".apocalypsai/last.diff":
                  continue
              paths.append(path)
          paths = list(dict.fromkeys(paths))
          if not paths:
              print("ERROR: No eligible changes to stage after excluding .apocalypsai/last.diff", file=sys.stderr)
              sys.exit(1)
          subprocess.run(["git", "add", "--"] + paths, check=True)
          PY
          if git diff --cached --quiet; then
            echo "ERROR: No staged changes after diff application"
            exit 1
          fi
          git commit -m "chore(nightly): self-heal ${{ steps.meta.outputs.readable }}"
      - name: Push branch
        if: ${{ steps.run_agent.outputs.status == '0' }}
        env:
          BRANCH: ai/nightly-${{ steps.meta.outputs.slug }}
        run: |
          set -euo pipefail
          git push --set-upstream "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
      - name: Open pull request
        if: ${{ steps.run_agent.outputs.status == '0' }}
        env:
          BRANCH: ai/nightly-${{ steps.meta.outputs.slug }}
          SUMMARY: ${{ steps.meta.outputs.summary }}
          READABLE: ${{ steps.meta.outputs.readable }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Rationale
          - Nightly integrator proposes self-healing refinements discovered on ${READABLE}.
          
          ## Why safe to merge
          - Diff remains tiny and reversible.
          - Includes doc/test touch-ups where relevant.
          - No secrets or sensitive files touched.
          
          ## Test Plan
          - \`pytest -q\`
          
          ## Links
          - Generated docs and examples committed alongside this change.
          
          ## Mock Justification
          - Not applicable; nightly adjustments did not introduce new mocks.
          EOF
          )
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(nightly): ${SUMMARY}" \
            --body "$body"
