name: Gemini Generator
on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install requests rich pyyaml pytest
      - name: Run Gemini generator
        id: run_agent
        env:
          APOCALYPSAI_PROVIDER: gemini
        run: |
          set +e
          output=$(python agents/agent_integrator.py --repo "${{ github.repository }}" --mode nightly 2>&1)
          status=$?
          set -e
          echo "$output"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Extract metadata if present
          if echo "$output" | grep -q "__METADATA_START__"; then
            metadata=$(echo "$output" | sed -n 's/.*__METADATA_START__\(.*\)__METADATA_END__.*/\1/p')
            echo "metadata=$metadata" >> "$GITHUB_OUTPUT"
          else
            echo "metadata={}" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Fail on agent error
        if: ${{ steps.run_agent.outputs.status != '0' && steps.run_agent.outputs.status != '2' }}
        run: |
          echo "ERROR: Gemini agent failed with status ${{ steps.run_agent.outputs.status }}"
          exit 1
      - name: No-op detected
        if: ${{ steps.run_agent.outputs.status == '2' }}
        run: echo "Agent reported no-op; skipping PR."
      - name: Stage utility files
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          
          # V2 classifier paths + legacy utils/
          VALID_PREFIXES = [
              "python-utils/", "rust-utils/", "bash-utils/", "react-webpage/",
              "github-actions/", "devops-tools/", "docker-tools/", "cli-apps/",
              "web-apis/", "js-utils/", "data-scripts/", "test-suite-tools/",
              "monitoring-scripts/", "infra-automation/", "go-utils/", "typescript-utils/",
              "node-utils/", "java-utils/", "cpp-utils/", "ansible-playbooks/",
              "terraform-modules/", "k8s-resources/", "ci-cd-pipelines/",
              "database-scripts/", "ml-notebooks/", "api-clients/", "utils/"
          ]
          
          result = subprocess.run(
              ["git", "status", "--porcelain", "-z"],
              capture_output=True,
              check=True,
          )
          data = result.stdout
          if not data:
              print("ERROR: Agent reported success but workspace has no changes.", file=sys.stderr)
              sys.exit(1)
          paths = []
          i = 0
          while i < len(data):
              j = data.find(b"\0", i)
              if j == -1:
                  break
              entry = data[i:j].decode()
              i = j + 1
              status = entry[:2]
              if status and status[0] in {"R", "C"}:
                  path = entry.split(" -> ", 1)[1]
              else:
                  path = entry[3:]
              
              # Check if path starts with any valid prefix
              if not any(path.startswith(prefix) for prefix in VALID_PREFIXES):
                  print(f"ERROR: Agent touched path outside valid directories: {path}", file=sys.stderr)
                  sys.exit(1)
              paths.append(path)
          if not paths:
              print("ERROR: No eligible paths detected under valid utility directories.", file=sys.stderr)
              sys.exit(1)
          subprocess.run(["git", "add", "--"] + paths, check=True)
          PY
      - name: Configure git
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          git config user.name "apocalypsai-bot"
          git config user.email "bot@apocalypsai.local"
      - name: Prepare branch metadata
        if: ${{ steps.run_agent.outputs.status == '0' }}
        id: meta
        run: |
          set -euo pipefail
          timestamp=$(date -u +"%Y%m%d-%H%M")
          
          # Parse metadata from agent output
          metadata='${{ steps.run_agent.outputs.metadata }}'
          util_name=$(echo "$metadata" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('util_name', 'unknown'))" 2>/dev/null || echo "unknown")
          summary=$(echo "$metadata" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('summary', 'autogenerated update'))" 2>/dev/null || echo "autogenerated update")
          provider=$(echo "$metadata" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('provider', 'gemini'))" 2>/dev/null || echo "gemini")
          target_dir=$(echo "$metadata" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('target_dir', 'utils/'))" 2>/dev/null || echo "utils/")
          file_count=$(echo "$metadata" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data.get('file_count', 0))" 2>/dev/null || echo "0")
          
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "util_name=$util_name" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"
          echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
          echo "file_count=$file_count" >> "$GITHUB_OUTPUT"
      - name: Create branch
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          git checkout -b "ai/gemini-${{ steps.meta.outputs.timestamp }}"
      - name: Commit changes
        if: ${{ steps.run_agent.outputs.status == '0' }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "ERROR: No staged changes in utility directories"
            exit 1
          fi
          # Check that only valid V2 classifier paths or legacy utils/ are staged
          if git diff --cached --name-only | grep -Ev '^(python-utils|rust-utils|bash-utils|react-webpage|github-actions|devops-tools|docker-tools|cli-apps|web-apis|js-utils|data-scripts|test-suite-tools|monitoring-scripts|infra-automation|go-utils|typescript-utils|node-utils|java-utils|cpp-utils|ansible-playbooks|terraform-modules|k8s-resources|ci-cd-pipelines|database-scripts|ml-notebooks|api-clients|utils)/' >/dev/null; then
            echo "ERROR: Non-utility files accidentally staged"
            git diff --cached --name-only
            exit 1
          fi
          git commit -m "feat(gemini): ${{ steps.meta.outputs.summary }}"
      - name: Push branch
        if: ${{ steps.run_agent.outputs.status == '0' }}
        env:
          BRANCH: ai/gemini-${{ steps.meta.outputs.timestamp }}
        run: |
          set -euo pipefail
          git push --set-upstream "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
      - name: Open pull request
        if: ${{ steps.run_agent.outputs.status == '0' }}
        env:
          BRANCH: ai/gemini-${{ steps.meta.outputs.timestamp }}
          SUMMARY: ${{ steps.meta.outputs.summary }}
          UTIL_NAME: ${{ steps.meta.outputs.util_name }}
          PROVIDER: ${{ steps.meta.outputs.provider }}
          TARGET_DIR: ${{ steps.meta.outputs.target_dir }}
          FILE_COUNT: ${{ steps.meta.outputs.file_count }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          ## Implementation Summary
          - **Utility**: ${UTIL_NAME}
          - **Provider**: ${PROVIDER}
          - **Location**: \`${TARGET_DIR}\`
          - **Files Created**: ${FILE_COUNT}
          - **Description**: ${SUMMARY}
          
          ## Rationale
          - Automated proposal from the Gemini generator delivering a fresh community utility.
          - This utility was generated using the **${PROVIDER}** AI provider.
          
          ## Why safe to merge
          - Utility is isolated to \`${TARGET_DIR}\`.
          - README + tests ship together (see folder contents).
          - No secrets or credentials touched.
          - All changes are additive and self-contained.
          
          ## Test Plan
          - Follow the instructions in the generated README at \`${TARGET_DIR}/README.md\`
          - Run tests located in \`${TARGET_DIR}/tests/\`
          
          ## Links
          - Generated docs and examples committed alongside this change.
          
          ## Mock Justification
          - Not applicable; generator did not introduce new mocks.
          EOF
          )
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(${PROVIDER}): ${SUMMARY}" \
            --body "$body"
