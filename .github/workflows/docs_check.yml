name: Docs Check
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
permissions:
  contents: read
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install requests rich pyyaml pytest
      - name: Validate documentation coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, sys, pathlib
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          result = subprocess.run(
              ["git", "diff", "--name-status", f"{base}..{head}"],
              capture_output=True,
              text=True,
              check=True,
          )
          lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          packs = {}
          for line in lines:
              parts = line.split('\t', 1)
              if len(parts) != 2:
                  continue
              status, path = parts
              if not path.startswith("packs/"):
                  continue
              components = path.split('/')
              if len(components) < 2:
                  continue
              pack = components[1]
              packs.setdefault(pack, set()).add(path)
          errors = []
          for pack in sorted(packs):
              pack_path = pathlib.Path("packs") / pack
              readme = pack_path / "README.md"
              if not readme.exists():
                  errors.append(f"Pack {pack} missing README.md")
                  continue
              text = readme.read_text(encoding="utf-8")
              lower = text.lower()
              if not any(keyword in lower for keyword in ("quickstart", "getting started")):
                  errors.append(f"Pack {pack} README.md missing Quickstart section")
              examples_dir = pack_path / "examples"
              has_examples = examples_dir.exists() and any(p.is_file() for p in examples_dir.rglob("*"))
              if not any(keyword in lower for keyword in ("example", "--help", "usage")) and not has_examples:
                  errors.append(f"Pack {pack} missing runnable example or --help documentation")
          changes = {path for _, path in (line.split('\t', 1) for line in lines if '\t' in line)}
          if packs and not any(path in {"changes/next.md", "CHANGELOG.md"} for path in changes):
              errors.append("Missing changelog update (changes/next.md or CHANGELOG.md)")
          if errors:
              for err in errors:
                  print(f"ERROR: {err}")
              sys.exit(1)
          PY
