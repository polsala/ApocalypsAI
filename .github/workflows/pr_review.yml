name: Cross-AI PR Review
on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
permissions:
  contents: read
  pull-requests: write
env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install requests rich pyyaml pytest
      - name: Run consolidated reviewer
        env:
          APOCALYPSAI_REVIEW_PROVIDERS: openrouter,groq,gemini
        run: |
          set -euo pipefail
          python agents/agent_reviewer.py --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
