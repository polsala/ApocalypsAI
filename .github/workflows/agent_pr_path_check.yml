name: Agent PR Path Conflict Check
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
permissions:
  contents: read
  pull-requests: write
env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  check-agent-pr-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -U pip
          pip install requests rich pyyaml pytest
      
      - name: Check if agent PR and validate paths
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          
          # Add agents to path
          sys.path.insert(0, str(Path.cwd()))
          
          from agents import agent_utils
          
          def check_agent_pr_paths(repo: str, pr_number: int) -> tuple[bool, str, list[str]]:
              """Check if an agent PR violates path isolation rules.
              
              Returns:
                  Tuple of (is_agent_pr, violation_reason, changed_files)
              """
              try:
                  pr = agent_utils.get_pr(repo, pr_number)
                  
                  # Check if PR is from an AI agent branch
                  branch = pr.get("head", {}).get("ref", "")
                  is_ai_pr = any(branch.startswith(f"ai/{agent}-") for agent in ["gemini", "groq", "openrouter"])
                  
                  if not is_ai_pr:
                      return False, "", []
                  
                  # This is an agent PR, now check paths
                  files = agent_utils.get_pr_files(repo, pr_number)
                  changed_files = [f.get("filename", "") for f in files]
                  
                  # All agent changes should be in utils/<single_util_name>/
                  # Find the isolated directory (should be only one)
                  util_dirs = set()
                  violations = []
                  
                  for filepath in changed_files:
                      if not filepath.startswith("utils/"):
                          violations.append(f"File outside utils/: {filepath}")
                      else:
                          # Extract the util directory name (utils/<util_name>/...)
                          parts = filepath.split("/")
                          if len(parts) >= 2:
                              util_name = parts[1]
                              util_dirs.add(util_name)
                  
                  # Check if changes span multiple utility directories
                  if len(util_dirs) > 1:
                      violations.append(f"Changes affect multiple utility directories: {', '.join(sorted(util_dirs))}")
                  
                  if violations:
                      reason = "Path isolation violation detected:\n" + "\n".join(f"  - {v}" for v in violations)
                      return True, reason, changed_files
                  
                  return True, "", changed_files
                  
              except Exception as e:
                  print(f"ERROR: Failed to check PR paths: {e}", file=sys.stderr)
                  return False, "", []
          
          def main():
              repo = os.environ.get("GITHUB_REPOSITORY")
              pr_number = int(os.environ.get("PR_NUMBER", "0"))
              
              if not repo or not pr_number:
                  print("ERROR: GITHUB_REPOSITORY or PR_NUMBER not set")
                  return 1
              
              print(f"Checking PR #{pr_number} in {repo}...")
              
              is_agent_pr, violation, changed_files = check_agent_pr_paths(repo, pr_number)
              
              if not is_agent_pr:
                  print("✅ Not an agent PR, skipping path check")
                  return 0
              
              if violation:
                  print(f"❌ Path violation detected:\n{violation}")
                  print("\nChanged files:")
                  for f in changed_files:
                      print(f"  - {f}")
                  
                  # Build comment text
                  comment_parts = [
                      "## ❌ Agent PR Path Conflict Detected",
                      "",
                      "This pull request has been automatically closed because it violates the agent path isolation requirements.",
                      "",
                      "### Violations Found:",
                      violation,
                      "",
                      "### Requirements:",
                      "- **Agent PRs must only modify files within a single isolated directory**: `utils/<util_name>/`",
                      "- All changes must be self-contained within that directory",
                      "- No modifications outside `utils/` are allowed",
                      "- No modifications spanning multiple utility directories are allowed",
                      "",
                      "### Changed Files:"
                  ]
                  for f in changed_files:
                      comment_parts.append(f"- `{f}`")
                  comment_parts.extend([
                      "",
                      "### How to Fix:",
                      "1. Ensure all changes are isolated to a single directory under `utils/`",
                      "2. Do not modify files outside your utility's directory",
                      "3. Do not modify shared files or other agents' directories",
                      "4. Create a new PR with properly isolated changes",
                      "",
                      f"For more information, see [AGENTS.md](https://github.com/{repo}/blob/main/AGENTS.md) section on \"Output artifacts\" and \"Utility Requirements\".",
                      "",
                      "---",
                      "*This is an automated check to prevent merge conflicts and maintain clean separation between agent-generated utilities.*"
                  ])
                  comment = "\n".join(comment_parts)
                  
                  try:
                      agent_utils.close_pr(repo, pr_number, comment)
                      print(f"✅ PR #{pr_number} closed with explanation comment")
                  except agent_utils.GitHubError as e:
                      print(f"ERROR: Failed to close PR #{pr_number}: {e}", file=sys.stderr)
                      return 1
                  
                  return 0
              else:
                  print(f"✅ Agent PR #{pr_number} follows path isolation rules")
                  return 0
          
          if __name__ == "__main__":
              sys.exit(main())
          PY
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
